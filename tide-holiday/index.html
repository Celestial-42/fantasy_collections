<!DOCTYPE html>
<html lang="zh-CN">

<style>
  :root{
    --ink:#120c08;
    --ink-deep:#070403;
    --bone:#f5e9d6;
    --bone-dim:#d7c3a6;
    --muted:#9f8a70;
    --accent:#e5ad78;
    --accent-hot:#ffd7a3;
    --sea:#7bb9b2;
    --coral:#d97b5f;
    --line:rgba(245,233,214,.14);
    --line-soft:rgba(245,233,214,.06);
    --panel:rgba(20,14,10,.7);
    --serif:"Iowan Old Style","Baskerville","Palatino Linotype","Songti SC","STSong","Noto Serif CJK SC",serif;
    --sans:"Avenir Next","Helvetica Neue","PingFang SC","Hiragino Sans GB",sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{width:100%;height:100%;margin:0;}
  html{background:var(--ink);}
  body{
    overflow:hidden;
    background:
      radial-gradient(78% 68% at 24% 8%, rgba(150,96,52,.18), transparent 62%),
      radial-gradient(70% 64% at 82% 24%, rgba(92,133,128,.12), transparent 66%),
      radial-gradient(120% 90% at 50% 100%, #191008 0%, #0c0806 62%, #050303 100%);
    color:var(--bone);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    user-select:none;
  }
  #stage{position:fixed;inset:0;}
  #scene{
    display:block;width:100%;height:100%;outline:none;
    cursor:grab;touch-action:none;
  }
  #scene.dragging{cursor:grabbing;}
  .vignette,.grain{position:fixed;inset:0;pointer-events:none;}
  .vignette{
    z-index:2;
    background:
      radial-gradient(ellipse at 50% 44%, transparent 34%, rgba(7,4,2,.16) 68%, rgba(3,2,1,.7) 100%),
      linear-gradient(180deg, rgba(6,4,2,.5), transparent 31%, transparent 68%, rgba(3,2,1,.66));
  }
  .grain{
    z-index:3;opacity:.1;mix-blend-mode:soft-light;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.62'/%3E%3C/svg%3E");
  }

  .masthead{
    position:fixed;z-index:5;
    top:clamp(22px,4vw,52px);
    left:clamp(22px,4.5vw,64px);
    max-width:min(42vw,560px);
    pointer-events:none;
  }
  .brand{display:flex;align-items:center;gap:11px;color:var(--muted);font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;}
  .brand svg{width:26px;height:34px;color:var(--accent);opacity:.88;}
  .masthead h1{
    margin:18px 0 0;
    font-family:var(--serif);
    font-weight:500;
    font-size:clamp(40px,5.2vw,76px);
    letter-spacing:.07em;
    line-height:.98;
    color:var(--bone);
    text-shadow:0 8px 34px rgba(0,0,0,.36);
  }
  .title-en{
    margin-top:13px;
    font-size:9.5px;letter-spacing:.46em;text-transform:uppercase;color:var(--accent);
  }
  .intro{
    margin:16px 0 0;
    display:flex;align-items:center;gap:14px;
    color:var(--muted);font-size:10.5px;letter-spacing:.16em;
  }
  .intro::before{content:"";width:34px;height:1px;background:var(--line);}
  .intro span{color:var(--bone-dim);letter-spacing:.08em;}

  .panel{
    position:fixed;z-index:6;
    top:clamp(22px,4vw,52px);
    right:clamp(22px,4.5vw,64px);
    width:min(300px,30vw);
    padding:17px 18px 15px;
    background:linear-gradient(160deg, rgba(26,18,12,.82), rgba(13,9,7,.65));
    border:1px solid var(--line);
    box-shadow:0 24px 60px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.035);
    backdrop-filter:blur(14px);
  }
  .panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
  .panel-head span{font-size:8.5px;letter-spacing:.28em;color:var(--muted);text-transform:uppercase;}
  .panel-head strong{font-family:var(--serif);font-size:24px;font-weight:400;color:var(--bone);letter-spacing:.04em;}
  .panel-rule{height:1px;background:var(--line-soft);margin:11px 0 12px;}
  .panel-meta{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:10px;color:var(--bone-dim);}
  .panel-meta em{font-style:normal;color:var(--muted);font-size:9px;letter-spacing:.08em;}
  .panel-row{
    margin-top:9px;padding-top:9px;border-top:1px solid var(--line-soft);
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:9px;color:var(--muted);letter-spacing:.08em;
  }
  .panel-row b{font-weight:500;color:var(--sea);font-size:10px;}
  .panel-sound{align-items:center;}
  .panel-sound button{
    appearance:none;border:1px solid rgba(229,173,120,.22);background:rgba(229,173,120,.05);
    padding:2px 6px;min-width:26px;min-height:20px;margin-left:8px;
    display:inline-flex;align-items:center;justify-content:center;
    font-family:var(--sans);font-size:9px;line-height:1;letter-spacing:.12em;color:var(--sea);
    cursor:pointer;transition:color .25s ease,border-color .25s ease,background .25s ease;
  }
  .panel-sound button:hover,.panel-sound button.is-on{
    color:var(--accent);border-color:rgba(229,173,120,.55);background:rgba(229,173,120,.13);
  }
  .panel-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px;}
  .panel-actions button,.panel-actions a{
    appearance:none;border:1px solid var(--line);
    background:rgba(255,255,255,.025);
    color:var(--bone-dim);text-decoration:none;
    font-family:var(--sans);font-size:9px;letter-spacing:.12em;
    display:flex;align-items:center;justify-content:center;min-height:32px;
    cursor:pointer;transition:.25s ease;
  }
  .panel-actions button:hover,.panel-actions a:hover{color:var(--bone);border-color:rgba(229,173,120,.48);background:rgba(229,173,120,.06);}

  .side-mark{
    position:fixed;z-index:4;right:clamp(14px,2vw,24px);top:50%;
    transform:rotate(90deg) translateX(50%);transform-origin:right center;
    font-size:8px;letter-spacing:.42em;color:rgba(245,233,214,.25);
    text-transform:uppercase;pointer-events:none;white-space:nowrap;
  }

  .hintbar{
    position:fixed;z-index:5;left:50%;bottom:clamp(18px,3vw,34px);
    transform:translateX(-50%);
    display:flex;align-items:center;gap:clamp(14px,2.4vw,30px);
    color:rgba(245,233,214,.34);font-size:9px;letter-spacing:.1em;
    white-space:nowrap;pointer-events:none;
  }
  .hintbar b{font-weight:500;color:rgba(245,233,214,.58);margin-right:5px;}
  .hintbar i{width:1px;height:9px;background:rgba(245,233,214,.13);}
  @media (max-width: 700px){.hintbar .tide-hint{display:none;}}
  .hint-note{
    position:fixed;z-index:4;left:clamp(22px,4.5vw,64px);bottom:clamp(48px,6vw,72px);
    color:rgba(245,233,214,.28);font-family:var(--serif);font-size:10px;letter-spacing:.11em;
    pointer-events:none;
  }

  .loading{
    position:fixed;inset:0;z-index:30;display:grid;place-items:center;
    background:radial-gradient(70% 60% at 50% 40%, #1b110c, #080504 78%);
    opacity:1;visibility:visible;transition:opacity .9s ease,visibility .9s;
  }
  .loading.done{opacity:0;visibility:hidden;pointer-events:none;}
  .loading-inner{display:grid;place-items:center;gap:18px;color:var(--bone-dim);text-align:center;}
  .loading-mark{width:44px;height:56px;color:var(--accent);opacity:.82;animation:float 4s ease-in-out infinite;}
  .loading-title{font-family:var(--serif);font-size:28px;letter-spacing:.2em;color:var(--bone);}
  .loading-sub{font-size:9px;letter-spacing:.24em;color:var(--muted);text-transform:uppercase;}
  @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
  @media (prefers-reduced-motion: reduce){.loading-mark{animation:none;}}

  @media (max-width: 900px){
    .masthead{max-width:62vw;}
    .panel{width:min(250px,40vw);padding:13px 14px 12px;}
    .panel-head strong{font-size:20px;}
    .panel-actions{grid-template-columns:1fr;}
    .side-mark{display:none;}
  }
  @media (max-width: 700px){
    .masthead{top:18px;left:18px;max-width:70vw;}
    .masthead h1{font-size:clamp(34px,10vw,48px);margin-top:13px;}
    .title-en{font-size:8px;letter-spacing:.32em;}
    .intro{font-size:9px;letter-spacing:.1em;margin-top:11px;display:block;}
    .intro::before{display:none;}
    .intro span{display:block;margin-top:5px;}
    .panel{top:18px;right:14px;width:132px;padding:10px 10px 9px;background:rgba(18,12,8,.58);}
    .panel-head span{font-size:7px;letter-spacing:.14em;}
    .panel-head strong{font-size:16px;}
    .panel-meta{display:block;font-size:8px;line-height:1.7;}
    .panel-meta em{display:block;font-size:7px;}
    .panel-row{font-size:7.5px;margin-top:7px;padding-top:7px;}
    .panel-row b{font-size:8px;}
    .panel-sound button{font-size:8px;min-width:30px;min-height:22px;padding:3px 6px;margin-left:6px;}
    .panel-actions{grid-template-columns:1fr;gap:5px;margin-top:9px;}
    .panel-actions button,.panel-actions a{min-height:25px;font-size:7.5px;}
    .hintbar{bottom:14px;gap:10px;font-size:7.5px;letter-spacing:.04em;}
    .hintbar b{margin-right:3px;}
    .hint-note{display:none;}
  }
</style>
</head>

<script type="module">
import * as THREE from 'three';

// -------------------------------------------------------------------------
// Setup
// -------------------------------------------------------------------------

const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.04;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x120c08);
scene.fog = new THREE.FogExp2(0x1c120c, .019);

const camera = new THREE.PerspectiveCamera(34, 1, .05, 80);
const target = new THREE.Vector3(0, 2.02, 0);
const HOME = { az: .04, polar: 1.31, dist: 7.88 };
const view = { az: HOME.az, polar: HOME.polar, dist: HOME.dist, tAz: HOME.az, tPolar: HOME.polar, tDist: HOME.dist };

const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => {
  const t = clamp((x - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
};
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(20060816);
const rand = (a = 0, b = 1) => a + rng() * (b - a);

const BOX = new THREE.BoxGeometry(1, 1, 1);
const Y_AXIS = new THREE.Vector3(0, 1, 0);
const dummy = new THREE.Object3D();
const _v = new THREE.Vector3();
const _v2 = new THREE.Vector3();

function std(color, roughness = .82, metalness = 0, extra = {}){
  return new THREE.MeshStandardMaterial({ color, roughness, metalness, ...extra });
}
const M = {
  skin: std(0xe7b88e, .78),
  skinWarm: std(0xdca87e, .8),
  skinChild: std(0xecc29b, .8),
  hair: std(0x302017, .84),
  hairWarm: std(0x543522, .84),
  dark: std(0x211814, .72),
  black: std(0x100c0b, .62),
  cream: std(0xf1e5cf, .86),
  white: std(0xf7f0e4, .82),
  navy: std(0x2f465e, .82),
  blue: std(0x477189, .8),
  coral: std(0xd66f57, .82),
  coralDark: std(0xb5513f, .82),
  teal: std(0x3f8e8e, .8),
  mint: std(0x9ccbb7, .84),
  straw: std(0xd8ba83, .86),
  strawDark: std(0xb28a51, .86),
  wood: std(0x7b4a2d, .8),
  woodDark: std(0x3b2418, .86),
  metal: std(0xcbb38b, .34, .58),
  gold: std(0xd3b073, .3, .5),
  book: std(0x517b8b, .8),
  paper: std(0xf3e6cd, .92),
  sand: std(0xd6b17c, .96),
  sandDark: std(0xb89163, .96),
  stone: std(0x9b8268, .92),
  towelBlue: std(0x7eb5b4, .9),
  towelCoral: std(0xd88a71, .9),
  radio: std(0xe5d5b7, .7),
  radioDark: std(0x263d4a, .6),
  bucket: std(0xd9705b, .62),
  spade: std(0x8f2f29, .65)
};

// -------------------------------------------------------------------------
// Procedural textures
// -------------------------------------------------------------------------

function canvasOf(w, h = w){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return [c, c.getContext('2d')];
}
function texFrom(c, repeatX = 1, repeatY = 1){
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  if (repeatX !== 1 || repeatY !== 1){
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(repeatX, repeatY);
  }
  return t;
}

function makeWoodTexture(w = 1024, h = 512, tone = 'table'){
  const [c, x] = canvasOf(w, h);
  const palette = tone === 'base'
    ? ['#2c1810', '#1d0f09', '#4e2c1b', '#6d4329']
    : ['#382016', '#1a0e08', '#5a351f', '#72482b'];
  x.fillStyle = palette[0]; x.fillRect(0, 0, w, h);
  const rows = tone === 'base' ? 5 : 6;
  for (let row = 0; row < rows; row++){
    const y0 = row * h / rows;
    x.fillStyle = palette[row % palette.length];
    x.globalAlpha = .6;
    x.fillRect(0, y0, w, h / rows + 1);
    x.globalAlpha = 1;
    for (let i = 0; i < 38; i++){
      const gy = y0 + rand(2, h / rows - 2);
      x.strokeStyle = `rgba(${row % 2 ? '120,74,42' : '42,22,13'},${rand(.05,.22)})`;
      x.lineWidth = rand(.5, 1.7);
      x.beginPath();
      for (let xx = 0; xx <= w; xx += 16){
        const yy = gy + Math.sin(xx * .013 + i * 1.7 + row) * rand(.5, 3.6);
        if (xx === 0) x.moveTo(xx, yy); else x.lineTo(xx, yy);
      }
      x.stroke();
    }
    x.strokeStyle = 'rgba(10,5,3,.55)';
    x.lineWidth = 2;
    x.beginPath(); x.moveTo(0, y0); x.lineTo(w, y0); x.stroke();
  }
  for (let i = 0; i < 5; i++){
    const kx = rand(0, w), ky = rand(0, h);
    x.strokeStyle = 'rgba(24,11,6,.4)';
    x.lineWidth = 2;
    x.beginPath(); x.ellipse(kx, ky, rand(8, 24), rand(3, 9), rand(0, TAU), 0, TAU); x.stroke();
  }
  return texFrom(c, tone === 'base' ? 1 : 4, tone === 'base' ? 1 : 3);
}

function makeSandTexture(){
  const [c, x] = canvasOf(1024, 1024);
  const g = x.createLinearGradient(0, 0, 0, 1024);
  g.addColorStop(0, '#e1c08c');
  g.addColorStop(.5, '#d8b57f');
  g.addColorStop(1, '#cfa870');
  x.fillStyle = g; x.fillRect(0, 0, 1024, 1024);
  for (let i = 0; i < 5200; i++){
    const l = rand(0, 1);
    x.fillStyle = l > .62 ? 'rgba(255,241,208,.28)' : l > .28 ? 'rgba(112,73,43,.15)' : 'rgba(245,221,176,.2)';
    const r = rand(.4, 1.8);
    x.beginPath(); x.arc(rand(0, 1024), rand(0, 1024), r, 0, TAU); x.fill();
  }
  x.lineWidth = 3;
  for (let i = 0; i < 34; i++){
    x.strokeStyle = `rgba(255,238,200,${rand(.04,.13)})`;
    x.beginPath();
    const y = rand(0, 1024);
    for (let xx = 0; xx <= 1024; xx += 20){
      const yy = y + Math.sin(xx * .015 + i * 1.4) * rand(2, 9);
      if (xx === 0) x.moveTo(xx, yy); else x.lineTo(xx, yy);
    }
    x.stroke();
  }
  return texFrom(c, 3, 3);
}

function makeBackdropTexture(){
  const [c, x] = canvasOf(1600, 900);
  const g = x.createRadialGradient(380, 250, 20, 380, 250, 950);
  g.addColorStop(0, '#3d2618');
  g.addColorStop(.42, '#1f130d');
  g.addColorStop(1, '#090605');
  x.fillStyle = g; x.fillRect(0, 0, 1600, 900);
  const cool = x.createRadialGradient(1260, 410, 20, 1260, 410, 560);
  cool.addColorStop(0, 'rgba(83,126,122,.17)');
  cool.addColorStop(1, 'rgba(30,35,31,0)');
  x.fillStyle = cool; x.fillRect(0, 0, 1600, 900);
  for (let i = 0; i < 90; i++){
    x.fillStyle = `rgba(255,214,166,${rand(.01,.055)})`;
    x.beginPath(); x.arc(rand(0, 1600), rand(0, 900), rand(10, 60), 0, TAU); x.fill();
  }
  return texFrom(c);
}

function makeSkyTexture(){
  const [c, x] = canvasOf(2048, 1024);
  const g = x.createLinearGradient(0, 0, 0, 1024);

function makeNoteTexture(symbol){
  const [c, x] = canvasOf(128, 128);
  x.clearRect(0, 0, 128, 128);
  const glow = x.createRadialGradient(64, 64, 5, 64, 64, 64);
  glow.addColorStop(0, 'rgba(255,236,196,.3)');
  glow.addColorStop(.5, 'rgba(255,236,196,.1)');
  glow.addColorStop(1, 'rgba(255,236,196,0)');
  x.fillStyle = glow;
  x.fillRect(0, 0, 128, 128);
  x.lineCap = 'round';
  x.lineJoin = 'round';
  const cream = 'rgba(255,246,220,.96)';
  const ink = 'rgba(35,58,53,.9)';
  function head(cx, cy, rot){
    x.save();
    x.translate(cx, cy);
    x.rotate(rot);
    x.beginPath();
    x.ellipse(0, 0, 18, 12, 0, 0, TAU);
    x.fillStyle = cream;
    x.fill();
    x.strokeStyle = ink;
    x.lineWidth = 4;
    x.stroke();
    x.restore();
  }
  function strokePath(draw){
    draw();
    x.strokeStyle = ink;
    x.lineWidth = 10;
    x.stroke();
    draw();
    x.strokeStyle = cream;
    x.lineWidth = 5;
    x.stroke();
  }
  head(48, 90, -.32);
  strokePath(() => {
    x.beginPath();
    x.moveTo(64, 84);
    x.lineTo(64, 26);
  });
  strokePath(() => {
    x.beginPath();
    x.moveTo(64, 26);
    x.bezierCurveTo(94, 34, 98, 58, 80, 70);
  });
  if (symbol === '♫'){
    head(94, 75, -.32);
    strokePath(() => {
      x.beginPath();
      x.moveTo(110, 69);
      x.lineTo(110, 27);
    });
    strokePath(() => {
      x.beginPath();
      x.moveTo(64, 30);
      x.lineTo(110, 28);
    });
  }
  return texFrom(c);
}

function block(parent, w, h, d, mat, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, cast = true){
  const m = new THREE.Mesh(BOX, mat);
  m.scale.set(w, h, d);

  m.castShadow = cast;

}
function limb(parent, a, b, thickness, depth, mat, cast = true){
  const dir = _v.copy(b).sub(a);
  const len = dir.length();
  const m = new THREE.Mesh(BOX, mat);
  m.position.copy(a).addScaledVector(dir, .5);
  m.quaternion.setFromUnitVectors(Y_AXIS, dir.normalize());
  m.scale.set(thickness, len, depth);
  m.castShadow = cast;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}
function softSprite(color, scale, opacity, additive = false){

    map: softTex, color, transparent: true, opacity,

    toneMapped: false
  });
  const s = new THREE.Sprite(mat);
  s.scale.set(scale, scale, 1);
  return s;
}

const SHORE_Z = 1.02;
const SHORE_RADIUS = 1.965;
const CASTLE_X = -.58;
const CASTLE_Z = .58;
function shoreZAt(x){
  return SHORE_Z + .045 * Math.sin(x * 2.8 + .35) + .022 * Math.sin(x * 6.3 + .9);
}
const shoreEdgeX = Math.sqrt(Math.max(0, SHORE_RADIUS * SHORE_RADIUS - SHORE_Z * SHORE_Z)) - .015;

const wetSandMat = new THREE.MeshBasicMaterial({ color: 0x9b7a54, transparent: true, opacity: .28, depthWrite: false, side: THREE.DoubleSide });
function makeShoreBand(zBack, zFront, y, mat, segments = 80){
  const positions = [];
  const indices = [];
  for (let i = 0; i <= segments; i++){
    const x = lerp(-shoreEdgeX, shoreEdgeX, i / segments);
    const z = shoreZAt(x);
    positions.push(x, y, z + zBack, x, y, z + zFront);
  }
  for (let i = 0; i < segments; i++){
    const a = i * 2;
    indices.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, mat);
  mesh.renderOrder = 2;
  jarRig.add(mesh);
  return mesh;
}

const seaUniforms = {
  uTime: { value: 0 },
  uWave: { value: 0 },
  uDeep: { value: new THREE.Color('#1d5f6f') },
  uShallow: { value: new THREE.Color('#75c2b5') },
  uSky: { value: new THREE.Color('#d9e8d7') }
};
const seaMat = new THREE.ShaderMaterial({
  uniforms: seaUniforms,
  side: THREE.DoubleSide,
  vertexShader: `
    uniform float uTime;
    varying vec2 vPos;
    void main(){
      vPos = position.xy;
      vec3 p = position;
      float worldZ = -position.y;
      p.z += sin(position.x * 5.0 + uTime * 1.1) * .004
           + sin(worldZ * 7.0 - uTime * 1.7 + position.x * 2.0) * .005;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
    }
  `,
  fragmentShader: `
    uniform float uTime;
    uniform float uWave;
    uniform vec3 uDeep;
    uniform vec3 uShallow;
    uniform vec3 uSky;
    varying vec2 vPos;
    void main(){
      float worldZ = -vPos.y;
      float shoreLine = 1.02 + .045 * sin(vPos.x * 2.8 + .35) + .022 * sin(vPos.x * 6.3 + .9);
      float depth = worldZ - shoreLine;
      vec3 col = mix(uShallow, uDeep, smoothstep(.12, 1.05, depth));
      float bands = sin(depth * 25.0 - uTime * 2.1 + vPos.x * 2.4 + sin(vPos.x * 4.0) * 1.4);
      col += vec3(.04, .075, .065) * smoothstep(.2, .9, bands) * .45;
      float skyRef = smoothstep(.25, 1.05, depth) * .13;
      col = mix(col, uSky, skyRef);
      float glint = pow(max(0.0, sin(vPos.x * 4.2 + uTime * .35)), 20.0);
      col += vec3(1.0, .88, .64) * glint * (.04 + .03 * sin(uTime * 1.3));
      float shoreFoam = 1.0 - smoothstep(.015, .2, depth);
      float foamBand = smoothstep(.55, .95, sin(depth * 40.0 - uTime * 2.8 + vPos.x * 4.3));
      float foam = shoreFoam * (.22 + .5 * foamBand) + uWave * shoreFoam * (.45 + .35 * foamBand);
      col = mix(col, vec3(.94, .985, .94), clamp(foam, 0.0, .72));
      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }
  `
});
function buildWaterShape(){
  const shape = new THREE.Shape();
  const segs = 64;
  shape.moveTo(-shoreEdgeX, -shoreZAt(-shoreEdgeX));
  for (let i = 1; i <= segs; i++){
    const x = lerp(-shoreEdgeX, shoreEdgeX, i / segs);
    shape.lineTo(x, -shoreZAt(x));
  }
  const zR = shoreZAt(shoreEdgeX);
  const phi0 = Math.atan2(zR, shoreEdgeX);
  for (let i = 1; i <= segs; i++){
    const phi = lerp(phi0, Math.PI - phi0, i / segs);
    shape.lineTo(Math.cos(phi) * SHORE_RADIUS, -Math.sin(phi) * SHORE_RADIUS);
  }
  shape.closePath();
  return shape;
}

  uTime: { value: 0 },
  uLevel: { value: 0 },
  uEdge: { value: 1.06 },
  uCastle: { value: new THREE.Vector2(CASTLE_X, CASTLE_Z) },
  uShallow: { value: new THREE.Color('#63c0b2') },
  uDeep: { value: new THREE.Color('#2e7d77') }
};
const tideMat = new THREE.ShaderMaterial({
  uniforms: tideUniforms,
  transparent: true,
  depthWrite: false,
  side: THREE.DoubleSide,
  vertexShader: `
    varying vec2 vPos;
    void main(){
      vPos = position.xy;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform float uTime;
    uniform float uLevel;
    uniform float uEdge;
    uniform vec2 uCastle;
    uniform vec3 uShallow;
    uniform vec3 uDeep;
    varying vec2 vPos;
    void main(){
      float x = vPos.x;
      float worldZ = -vPos.y;
      float shore = 1.02 + .045 * sin(x * 2.8 + .35) + .022 * sin(x * 6.3 + .9);
      if (worldZ > shore) discard;
      float edge = uEdge + .03 * sin(x * 4.6 + uTime * 1.7) + .014 * sin(x * 9.4 - uTime * .9);
      if (worldZ < edge) discard;
      float depth = worldZ - edge;
      vec3 col = mix(uShallow, uDeep, smoothstep(.03, .5, depth));
      float bands = sin(depth * 30.0 - uTime * 2.6 + x * 2.2 + sin(x * 5.0) * 1.2);
      col += vec3(.035, .065, .055) * smoothstep(.2, .95, bands) * .35;
      float glint = pow(max(0.0, sin(x * 5.4 + uTime * .8 + depth * 14.0)), 22.0);
      col += vec3(1.0, .93, .74) * glint * .05;
      float foam = 1.0 - smoothstep(0.0, .045, depth);
      vec2 c = vec2(x - uCastle.x, worldZ - uCastle.y);
      float r = length(c);
      float wob = .012 * sin(atan(c.y, c.x) * 5.0 + uTime * 1.1);
      if (r + wob < .285) discard;
      float rim = smoothstep(.27, .295, r) * (1.0 - smoothstep(.32, .36, r));
      foam = max(foam, rim * .9);
      col = mix(col, vec3(.95, .985, .94), clamp(foam, 0.0, .8));
      float alpha = mix(.52, .76, foam) * smoothstep(0.0, .03, depth) * mix(.8, 1.0, uLevel);
      gl_FragColor = vec4(col, alpha);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }
  `
});

function makeLounger(x, z, ry, fabricA, fabricB){
  const root = new THREE.Group();

  for (const sx of [-.23, .23]){

      const toe = new THREE.Mesh(new THREE.SphereGeometry(.03, 8, 6), chairMatMetal);
      toe.position.set(sx, .01, zz);
      root.add(toe);
    }
    block(root, .04, .035, .62, chairMatFrame, sx, .18, -.25);
  }
  block(root, .48, .035, .038, chairMatFrame, 0, .18, -.54);
  for (let i = 0; i < 5; i++){
    block(root, .49, .024, .108, i % 2 ? fabricA : fabricB, 0, .205, -.47 + i * .115);
  }

  // 抬起的靠背，角度与上身一致
  const back = new THREE.Group();
  back.position.set(0, .205, -.005);
  back.rotation.x = -LOUNGE_BACK_ANGLE;
  root.add(back);
  for (let i = 0; i < 4; i++){
    block(back, .49, .026, .12, i % 2 ? fabricA : fabricB, 0, .012, .065 + i * .12);
  }
  for (const sx of [-.285, .285]){
    block(back, .04, .035, .52, chairMatFrame, sx, 0, .26);
    block(back, .03, .12, .03, chairMatMetal, sx, -.07, .12);
  }
  block(back, .47, .03, .035, chairMatFrame, 0, 0, .52);

  block(back, .27, .065, .155, fabricB, 0, .048, .375);
  block(back, .29, .022, .17, fabricA, 0, .082, .375);

  return root;
}

function emitSand(count = 5, force = .45){
  for (let i = 0; i < count; i++){
    const p = sandParticles[sandCursor++ % sandCount];
    const a = rand(0, TAU);
    p.life = rand(.35, .8);
    p.maxLife = p.life;
    p.x = .13 + rand(-.07, .07);
    p.y = SAND_Y + .04;
    p.z = .7 + rand(-.05, .05);
    const s = rand(.12, .38) * force;
    p.vx = Math.cos(a) * s;
    p.vy = rand(.35, .85) * force;
    p.vz = Math.sin(a) * s;
    p.size = rand(.012, .028);
    p.spin = rand(-6, 6);
  }
}
function updateSand(dt){
  for (let i = 0; i < sandCount; i++){
    const p = sandParticles[i];
    if (p.life > 0){
      p.life = Math.max(0, p.life - dt);
      p.vy -= 1.45 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
      if (p.y < SAND_Y + .015){ p.y = SAND_Y + .015; p.vy *= -.25; p.vx *= .6; p.vz *= .6; }
      p.spin += dt * 5;
      const lifeK = Math.min(1, p.life / .18);
      dummy.position.set(p.x, p.y, p.z);
      dummy.rotation.set(p.spin, p.spin * .6, 0);
      dummy.scale.setScalar(p.size * lifeK);
    } else {
      dummy.position.set(0, -10, 0);
      dummy.rotation.set(0, 0, 0);
      dummy.scale.setScalar(0);
    }
    dummy.updateMatrix();
    sandInst.setMatrixAt(i, dummy.matrix);
  }
  sandInst.instanceMatrix.needsUpdate = true;
}

const tideStateEl = document.getElementById('tideState');
const hintNoteEl = document.getElementById('hintNote');
const TIDE_EDGE_LOW = 1.045;
const TIDE_EDGE_PEAK = .255;
const tide = { active:false, t:0, level:0, edge:TIDE_EDGE_LOW, rescue:0, carry:0, hop:0, receding:false };

function startTideEvent(){
  if (tide.active) return false;
  tide.active = true;
  tide.t = 0;
  tide.level = 0;
  tide.rescue = 0;
  tide.carry = 0;
  tide.hop = 0;
  tide.receding = false;
  clickFx.sea = 2.0;
  clickFx.child = 0;
  clickFx.bucket = 0;
  clickFx.castle = 0;
  seaUniforms.uWave.value = 1;
  foamMat.opacity = .55;
  emitSand(9, .55);
  if (tideStateEl) tideStateEl.textContent = '涨潮 · 上涌';
  if (hintNoteEl) hintNoteEl.textContent = '潮水漫上沙滩，一家人在把下午往后搬。';
  return true;
}

function updateTide(dt, time){
  if (tide.active){
    tide.t += dt;
    const t = tide.t;
    const rise = smooth(0, 2.1, t);
    const fall = smooth(4.2, 6.6, t);
    tide.level = rise * (1 - fall);
    tide.rescue = smooth(.15, 1.15, t) * (1 - smooth(5.0, 6.05, t));
    tide.carry = smooth(.2, .62, t) * (1 - smooth(6.2, 6.6, t));
    tide.hop = Math.sin(clamp((t - .15) / 1.0, 0, 1) * Math.PI) * (t < 1.4 ? .055 : 0)
             + Math.sin(clamp((t - 5.0) / .9, 0, 1) * Math.PI) * (t > 5.0 && t < 6.0 ? .035 : 0);
    if (t > 4.2 && !tide.receding){
      tide.receding = true;
      if (tideStateEl) tideStateEl.textContent = '退潮 · 回落';
      if (hintNoteEl) hintNoteEl.textContent = '潮水退回去，沙堡还留在原地。';
    }
    if (t > 7.15){
      tide.active = false;
      tide.t = 0;
      tide.level = tide.rescue = tide.carry = tide.hop = 0;
      if (tideStateEl) tideStateEl.textContent = '退潮 · 低';
      if (hintNoteEl) hintNoteEl.textContent = '夏天被留在玻璃罩里，潮水还在慢慢退。';
    }
  } else {
    tide.level = tide.rescue = tide.carry = tide.hop = 0;
  }

  tide.edge = lerp(TIDE_EDGE_LOW, TIDE_EDGE_PEAK, tide.level);
  tideUniforms.uTime.value = time + 2.0;
  tideUniforms.uLevel.value = tide.level;
  tideUniforms.uEdge.value = tide.edge;
  tideSheet.visible = tide.level > .002;
  tideSheet.position.y = SAND_Y + .028 + tide.level * .005;
}

function triggerClick(kind, obj){
  if (tide.active && (kind === 'child' || kind === 'bucket' || kind === 'castle')) return;
  if (kind === 'dad'){
    clickFx.dad = 2.2;
  } else if (kind === 'mom'){

  } else if (kind === 'child'){
    clickFx.child = 2.4;
    emitSand(12, .7);
  } else if (kind === 'umbrella'){
    clickFx.umbrella = 2.1;
  } else if (kind === 'ball'){
    clickFx.ball = 1.7;
  } else if (kind === 'radio'){
    clickFx.radio = 2.3;
    toggleAudio();
  } else if (kind === 'sea'){
    clickFx.sea = 2.0;
    startTideEvent();
  } else if (kind === 'gull'){
    const g = gulls[obj.userData.index];
    if (g) g.startle = 1.6;
    clickFx.gull = 1.2;
  } else if (kind === 'bucket'){
    clickFx.bucket = 1.5;
    emitSand(7, .45);

    emitSand(9, .55);

}
function handleClick(e){
  const rect = canvas.getBoundingClientRect();
  pointerNDC.set(
    ((e.clientX - rect.left) / rect.width) * 2 - 1,
    -((e.clientY - rect.top) / rect.height) * 2 + 1
  );
  raycaster.setFromCamera(pointerNDC, camera);
  const hits = raycaster.intersectObjects(clickTargets, true);
  for (const hit of hits){
    let o = hit.object;
    while (o){
      if (o.userData && o.userData.kind){
        triggerClick(o.userData.kind, o);
        return true;
      }
      o = o.parent;
    }
  }
  return false;
}

function updateWater(time, dt){
  seaUniforms.uTime.value = time + 2.0;
  clickFx.sea = Math.max(0, clickFx.sea - dt);
  const clickWave = clickFx.sea > 0 ? Math.sin((1 - clickFx.sea / 2.0) * Math.PI) : 0;
  const wave = Math.max(clickWave, tide.level * .92);
  seaUniforms.uWave.value = wave;
  const baseFoam = .3 + Math.sin(time * 1.4) * .07;
  foamMat.opacity = baseFoam + wave * .26 + tide.level * .12;
  foamInnerMat.opacity = .14 + Math.sin(time * 1.8 + .8) * .04 + wave * .16 + tide.level * .08;
  foam.position.y = .119 + Math.sin(time * 1.25) * .002 + tide.level * .006;
  foamInner.position.y = .123 + Math.sin(time * 1.6) * .002 + tide.level * .005;
}

function updateGulls(dt, time){
  for (const g of gulls){
    g.startle = Math.max(0, g.startle - dt);
    const boost = g.startle > 0 ? 1.8 : 1;
    const a = g.phase + time * g.speed * boost;
    const x = Math.cos(a) * g.radius;
    const z = -.72 + Math.sin(a) * (g.radius * .5);
    g.group.position.set(x, g.y + Math.sin(time * .7 + g.phase) * .06, z);
    g.group.rotation.y = Math.atan2(-Math.cos(a) * Math.sign(g.speed), Math.sin(a) * .5 * Math.sign(g.speed));
    const flap = Math.sin(time * (g.startle > 0 ? 18 : 7) + g.phase) * (g.startle > 0 ? .7 : .36) + .1;
    g.wingL.rotation.z = flap;
    g.wingR.rotation.z = -flap;
    g.wingL.rotation.x = Math.sin(time * .8 + g.phase) * .06;
    g.wingR.rotation.x = g.wingL.rotation.x;
  }
}

function updateClouds(dt, time){
  for (const c of clouds){
    c.sprite.position.x = c.spec.x + Math.sin(time * c.spec.speed + c.phase) * .16;
    c.sprite.position.y = c.spec.y + Math.sin(time * .18 + c.phase) * .018;
    c.sprite.material.opacity = c.spec.o + Math.sin(time * .31 + c.phase) * .05;
  }
  skySunGlow.material.opacity = .16 + Math.sin(time * .7) * .025;
}

function updateBall(time, dt){
  clickFx.ball = Math.max(0, clickFx.ball - dt);
  const p = clickFx.ball > 0 ? 1 - clickFx.ball / 1.7 : 0;
  const hop = clickFx.ball > 0 ? Math.sin(p * Math.PI) * .35 : 0;
  const floating = tide.level;
  ball.position.x = -1.18 - floating * .06;
  ball.position.z = .55 - floating * .12;
  ball.position.y = SAND_Y + .16 + Math.sin(time * 1.7) * .01 * (1 - floating) + hop
                    + floating * .034 + Math.sin(time * 2.6) * .006 * floating;
  ballMesh.rotation.y += dt * (.15 + (clickFx.ball > 0 ? 5.5 : 0) + floating * 1.8);
  ballMesh.rotation.z = Math.sin(time * 1.2) * .05 + Math.sin(time * 1.5) * .08 * floating;
}

function updateBucket(time, dt){
  clickFx.bucket = Math.max(0, clickFx.bucket - dt);
  const p = clickFx.bucket > 0 ? Math.sin((1 - clickFx.bucket / 1.5) * Math.PI) : 0;
  const carry = tide.carry;
  if (carry > .001){
    child.updateMatrixWorld(true);
    const hand = new THREE.Vector3();
    childCarryAnchor.getWorldPosition(hand);
    jarRig.worldToLocal(hand);
    hand.y -= .16;
    hand.z += .02;
    bucket.position.set(
      lerp(.54, hand.x, carry),
      lerp(SAND_Y + .01, hand.y, carry) + p * .12,
      lerp(.68, hand.z, carry)
    );
    bucket.rotation.set(0, .3, Math.sin(time * 7) * .06 * carry);
  } else {
    bucket.position.set(.54, SAND_Y + .01 + p * .12, .68);
    bucket.rotation.set(0, .3 + p * 2.5, Math.sin(time * 9) * .12 * p);
  }
}

function updateCastle(time, dt){
  clickFx.castle = Math.max(0, clickFx.castle - dt);
  const p = clickFx.castle > 0 ? Math.sin((1 - clickFx.castle / 1.3) * Math.PI) : 0;
  castle.scale.set(1 + p * .06, 1 + p * .06, 1 + p * .06);
  castleFlag.rotation.y = Math.sin(time * 2.4) * .2 + p * .9;
}

function updateRadio(time, dt){
  clickFx.radio = Math.max(0, clickFx.radio - dt);
  const p = clickFx.radio > 0 ? Math.sin((1 - clickFx.radio / 2.3) * Math.PI) : 0;
  radio.position.z = .42 - tide.level * .03;
  radio.position.y = SAND_Y + .08 + Math.sin(time * 2.2) * .003 + p * .025
                    + tide.level * .018 + Math.sin(time * 2.8) * .004 * tide.level;
  radio.rotation.z = Math.sin(time * 3.4) * .012 + Math.sin(time * 12) * .035 * p;
  antenna.rotation.z = -.36 + Math.sin(time * 1.7) * .02 + p * .18;
  radioLedMat.emissiveIntensity = audio.on ? .9 + Math.sin(time * 5.2) * .22 : 0;
  if (audio.on){
    for (const n of notes){
      const u = ((time * .22 + n.offset) % 1 + 1) % 1;
      n.sprite.visible = u > .08 && u < .82;
      if (n.sprite.visible){
        n.sprite.position.set(1.18 + n.drift * u + Math.sin(time * 1.7 + n.offset) * .06, .4 + u * .62, .5 + Math.sin(time * .7 + n.offset) * .08);
        n.sprite.material.opacity = Math.sin(((u - .08) / .74) * Math.PI) * .62;
        n.sprite.scale.set(.12 + u * .035, .12 + u * .035, 1);
      }
    }
  } else {
    for (const n of notes){
      const u = clickFx.radio > 0 ? clamp((1 - clickFx.radio / 2.3) * 1.5 - n.offset, 0, 1) : 1;
      n.sprite.visible = clickFx.radio > 0 && u > 0 && u < 1;
      if (n.sprite.visible){
        n.sprite.position.set(1.18 + n.drift * u + Math.sin(time * 1.7 + n.offset) * .06, .4 + u * .62, .5 + Math.sin(time * .7 + n.offset) * .08);
        n.sprite.material.opacity = Math.sin(u * Math.PI) * .75;
        n.sprite.scale.set(.12 + u * .035, .12 + u * .035, 1);
      }
    }
  }
}

function updateTideProps(time, dt){
  const lv = tide.level;
  towelL.position.set(-1.43, SAND_Y + .012 + lv * .032, .47 - lv * .1);
  towelL.rotation.y = .26 + Math.sin(time * 1.2) * .05 * lv;
  towelR.position.set(1.42, SAND_Y + .012 + lv * .029, .5 - lv * .09);
  towelR.rotation.y = -.21 - Math.sin(time * 1.1 + .7) * .05 * lv;
}

function updateUmbrella(time, dt){
  clickFx.umbrella = Math.max(0, clickFx.umbrella - dt);
  const p = clickFx.umbrella > 0 ? Math.sin((1 - clickFx.umbrella / 2.1) * Math.PI) : 0;
  umbrellaTilt.rotation.z = -.11 + Math.sin(time * .55) * .008 + p * .1;
  umbrellaTilt.rotation.x = -.045 + Math.cos(time * .46) * .006;
  canopy.rotation.y = time * .045 + p * 2.8;
  canopyRim.rotation.z = p * 1.4;
  for (let i = 0; i < fringes.length; i++){
    fringes[i].rotation.x = Math.sin(time * 2.3 + i * .8) * .08 + p * Math.sin(time * 14 + i) * .18;
  }
}

function updateFamily(time, dt){
  const tideWave = tide.level * (1 + Math.sin(time * 7.5) * .06);
  // idle breathing and small gestures
  dad.head.rotation.z = Math.sin(time * .5 + 1.1) * .022;
  mom.head.rotation.z = Math.sin(time * .55 + 3.2) * .022;
  mom.head.rotation.y = .05 + Math.sin(time * .34 + 2.2) * .035;

  clickFx.dad = Math.max(0, clickFx.dad - dt);
  const dadP = clickFx.dad > 0 ? Math.sin((1 - clickFx.dad / 2.2) * Math.PI) : 0;
  dad.armR.rotation.x = Math.sin(time * .8) * .012 - dadP * .92 - tideWave * .38;
  dad.armR.rotation.z = dadP * .2 + tideWave * .08;
  dad.armL.rotation.x = Math.sin(time * .9 + 2.1) * .01 - tideWave * .3;
  dad.armL.rotation.z = -tideWave * .05;
  dad.head.rotation.y = -.05 + dadP * .18 + tideWave * .1;
  for (let i = 0; i < dad.legs.length; i++){
    dad.legs[i].rotation.x = -tideWave * .52;
    dad.legs[i].rotation.z = (i === 0 ? -1 : 1) * tideWave * .035;
  }

  clickFx.mom = Math.max(0, clickFx.mom - dt);
  const momP = clickFx.mom > 0 ? Math.sin((1 - clickFx.mom / 2.2) * Math.PI) : 0;
  mom.armL.rotation.x = Math.sin(time * .8 + 1.4) * .012 - momP * .92 - tideWave * .38;
  mom.armL.rotation.z = momP * .2 - tideWave * .08;
  mom.armR.rotation.x = Math.sin(time * .9 + .7) * .01 - tideWave * .3;
  mom.armR.rotation.z = tideWave * .05;
  mom.head.rotation.y = .05 + Math.sin(time * .34 + 2.2) * .035 + momP * .18 - tideWave * .1;
  for (let i = 0; i < mom.legs.length; i++){
    mom.legs[i].rotation.x = -tideWave * .52;
    mom.legs[i].rotation.z = (i === 0 ? -1 : 1) * tideWave * .035;
  }

  clickFx.child = Math.max(0, clickFx.child - dt);
  const childBoost = clickFx.child > 0 ? 2.4 : 0;
  const digSpeed = 2.1 + childBoost;
  const rescue = tide.rescue;
  const idle = 1 - rescue;
  const dig = (Math.sin(time * digSpeed) * .5 + .5) * idle;
  const armSwing = Math.sin(time * digSpeed) * .28 * idle;
  childTorso.rotation.x = .22 + dig * .06 + (clickFx.child > 0 ? .04 : 0) - rescue * .1;
  childArmR.rotation.x = -.34 + armSwing * .8 + dig * .35 + rescue * .25;
  childArmR.rotation.z = -.16 + Math.sin(time * digSpeed + .8) * .18 * idle - rescue * .08;
  childHead.group.rotation.z = Math.sin(time * .7 + 1.2) * .025;
  childHead.group.rotation.x = -.08 + Math.sin(time * 1.1) * .02;
  childHead.group.rotation.y = .05 + rescue * .28;
  if (childBoost > 0 && rescue < .2){
    childArmR.rotation.x -= .15;
    childArmR.rotation.z += Math.sin(time * 18) * .1;
  }
  childArmL.rotation.x = lerp(-.12 + Math.sin(time * digSpeed + 2.1) * .08, -1.15, rescue);
  childArmL.rotation.z = lerp(.04 + Math.sin(time * .9 + .2) * .025, .34, rescue);
  child.position.set(lerp(.12, .2, rescue), SAND_Y + .02 + tide.hop, lerp(.38, .1, rescue));
  child.rotation.y = -.08 - .22 * rescue;

  sandAccumulator += dt * (digSpeed > 3.5 ? 4.5 : 1.7) * idle;
  if (sandAccumulator > 1.0){
    sandAccumulator = 0;
    emitSand(clickFx.child > 0 ? 4 : 2, clickFx.child > 0 ? .7 : .38);
  }
}

function updateSandSky(time){
  skyDome.rotation.y = Math.sin(time * .018) * .005;
  toyBoat.position.y = .145 + Math.sin(time * .85) * .007;
  toyBoat.rotation.z = Math.sin(time * .7) * .035;
  toyWake.material.opacity = .12 + Math.sin(time * 1.2) * .03;
  glintA.material.opacity = .12 + Math.sin(time * 1.1) * .035;
  glintB.material.opacity = .065 + Math.sin(time * 1.4 + 2.0) * .02;
}

// -------------------------------------------------------------------------
// Ambient audio: surf and radio
// -------------------------------------------------------------------------

const soundBtn = document.getElementById('soundBtn');
const audio = { ctx:null, master:null, radioGain:null, surfGain:null, surfFilter:null, analyser:null, on:false };

function makeSurfBuffer(ctx){
  const sr = ctx.sampleRate;
  const n = Math.floor(sr * 2.5);
  const buf = ctx.createBuffer(1, n, sr);
  const d = buf.getChannelData(0);
  let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
  for (let i = 0; i < n; i++){
    const w = Math.random() * 2 - 1;
    b0 = .99886 * b0 + w * .0555179;
    b1 = .99332 * b1 + w * .0750759;
    b2 = .96900 * b2 + w * .1538520;
    b3 = .86650 * b3 + w * .3104856;
    b4 = .55000 * b4 + w * .5329522;
    b5 = -.7616 * b5 - w * .0168980;
    d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * .5362) * .15;
    b6 = w * .115926;
  }
  const fade = Math.floor(sr * .05);
  for (let i = 0; i < fade; i++){
    const k = i / fade;
    d[i] *= k;
    d[n - 1 - i] *= k;
  }
  return buf;
}

function makeRadioBuffer(ctx){
  const sr = 24000;
  const dur = 8;
  const n = sr * dur;
  const buf = ctx.createBuffer(1, n, sr);
  const d = buf.getChannelData(0);
  const chords = [
    [261.63, 329.63, 392.00, 493.88],
    [220.00, 261.63, 329.63, 392.00],
    [174.61, 220.00, 261.63, 329.63],
    [196.00, 246.94, 293.66, 349.23]
  ];
  for (let i = 0; i < n; i++){
    const t = i / sr;
    const chord = chords[Math.floor(t / 2) % 4];
    let s = 0;
    for (let k = 0; k < chord.length; k++){
      const f = chord[k] * (1 + (k % 2 ? .0015 : -.0015));
      s += Math.sin(TAU * f * t + Math.sin(TAU * .13 * t + k) * .2) * .05;
    }
    const step = Math.floor(t / .5);
    const noteT = t - step * .5;
    const arp = chord[(step + 1) % 4] * 2;
    s += Math.sin(TAU * arp * t) * Math.exp(-noteT * 6.5) * .08;
    if (Math.random() < .0006) s += (Math.random() * 2 - 1) * .05;
    d[i] = s * Math.min(1, t / .04, (dur - t) / .04);
  }
  return buf;
}

function initAudio(){
  if (audio.ctx) return;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  const ctx = new Ctx();
  audio.ctx = ctx;

  const master = ctx.createGain();
  master.gain.value = 0;
  const analyser = ctx.createAnalyser();
  analyser.fftSize = 256;
  master.connect(analyser);
  analyser.connect(ctx.destination);
  audio.master = master;
  audio.analyser = analyser;

  const surfSrc = ctx.createBufferSource();
  surfSrc.buffer = makeSurfBuffer(ctx);
  surfSrc.loop = true;
  const surfFilter = ctx.createBiquadFilter();
  surfFilter.type = 'lowpass';
  surfFilter.frequency.value = 520;
  surfFilter.Q.value = .7;
  const surfWave = ctx.createGain();
  surfWave.gain.value = .5;
  const waveLfo = ctx.createOscillator();
  waveLfo.frequency.value = .09;
  const waveDepth = ctx.createGain();
  waveDepth.gain.value = .16;
  waveLfo.connect(waveDepth);
  waveDepth.connect(surfWave.gain);
  const surfGain = ctx.createGain();
  surfGain.gain.value = .45;
  surfSrc.connect(surfFilter);
  surfFilter.connect(surfWave);
  surfWave.connect(surfGain);
  surfGain.connect(master);
  surfSrc.start();
  waveLfo.start();
  audio.surfFilter = surfFilter;
  audio.surfGain = surfGain;

  const radioSrc = ctx.createBufferSource();
  radioSrc.buffer = makeRadioBuffer(ctx);
  radioSrc.loop = true;
  const radioFilter = ctx.createBiquadFilter();
  radioFilter.type = 'lowpass';
  radioFilter.frequency.value = 1900;
  const radioGain = ctx.createGain();
  radioGain.gain.value = .3;
  radioSrc.connect(radioFilter);
  radioFilter.connect(radioGain);
  radioGain.connect(master);
  radioSrc.start();
  audio.radioGain = radioGain;
}

function updateSoundUI(){
  if (!soundBtn) return;
  soundBtn.textContent = audio.on ? '开' : '关';
  soundBtn.setAttribute('aria-pressed', String(audio.on));
  soundBtn.classList.toggle('is-on', audio.on);
}

function toggleAudio(){
  initAudio();
  if (!audio.ctx) return;
  if (audio.ctx.state === 'suspended') audio.ctx.resume();
  audio.on = !audio.on;
  const now = audio.ctx.currentTime;
  audio.master.gain.cancelScheduledValues(now);
  audio.master.gain.setTargetAtTime(audio.on ? .9 : 0, now, .12);
  updateSoundUI();
}

function updateAudio(){
  if (!audio.ctx || !audio.on) return;
  const now = audio.ctx.currentTime;
  const lv = tide.level;
  audio.surfGain.gain.setTargetAtTime(.45 + lv * .3, now, .12);
  audio.surfFilter.frequency.setTargetAtTime(500 + lv * 1650, now, .2);
  audio.radioGain.gain.setTargetAtTime(.3 * (1 - lv * .35), now, .2);
}

function audioLevel(){
  if (!audio.analyser) return 0;
  const arr = new Uint8Array(audio.analyser.fftSize);
  audio.analyser.getByteTimeDomainData(arr);
  let sum = 0;
  for (let i = 0; i < arr.length; i++){
    const v = (arr[i] - 128) / 128;
    sum += v * v;
  }
  return Math.sqrt(sum / arr.length);
}

if (soundBtn) soundBtn.addEventListener('click', (e) => {
  e.preventDefault();
  toggleAudio();
  if (audio.on) clickFx.radio = Math.max(clickFx.radio, 2.3);
});

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .05);
  timeNow += dt;

  updateCamera(dt);
  updateTide(dt, timeNow);
  updateWater(timeNow, dt);
  updateGulls(dt, timeNow);
  updateClouds(dt, timeNow);
  updateFamily(timeNow, dt);
  updateUmbrella(timeNow, dt);
  updateBall(timeNow, dt);
  updateBucket(timeNow, dt);
  updateCastle(timeNow, dt);
  updateRadio(timeNow, dt);
  updateTideProps(timeNow, dt);
  updateSand(dt);
  updateSandSky(timeNow);
  updateAudio();

  glassUniforms.uFresnel.value = 1 + Math.sin(timeNow * .45) * .08;
  renderer.render(scene, camera);
  if (!ready){
    ready = true;
    window.__TIDE_READY__ = true;
    setTimeout(() => document.getElementById('loading').classList.add('done'), 360);
  }
}

// -------------------------------------------------------------------------
// Camera and pointer controls
// -------------------------------------------------------------------------

const clock = new THREE.Clock();
let timeNow = 0;
let ready = false;
let dragging = false;
let pointerDown = false;
let pointerTravel = 0;
let pointerStartAt = 0;
let prevPointer = { x: 0, y: 0 };
const activePointers = new Map();
let pinchStart = 0;
let pinchBase = 0;
let pinched = false;
let lastInteract = performance.now();

function noteInteraction(){
  lastInteract = performance.now();
}
function updateCamera(dt){
  const now = performance.now();
  if (!dragging && now - lastInteract > 7000){
    view.tAz += dt * .018;
  }
  const k = 1 - Math.pow(.0016, dt);
  view.az = lerp(view.az, view.tAz, k);
  view.polar = lerp(view.polar, view.tPolar, k);
  view.dist = lerp(view.dist, view.tDist, k);
  const sp = Math.sin(view.polar);
  camera.position.set(
    target.x + Math.sin(view.az) * sp * view.dist,
    target.y + Math.cos(view.polar) * view.dist,
    target.z + Math.cos(view.az) * sp * view.dist
  );
  camera.lookAt(target);
}
function applyHomeView(snap = false){
  const narrow = window.innerWidth / window.innerHeight < .82;
  const nextTarget = narrow ? 1.9 : 2.02;
  const dist = narrow ? 8.8 : 7.88;
  const polar = narrow ? 1.28 : 1.31;
  target.y = nextTarget;
  view.tAz = .04;
  view.tPolar = polar;
  view.tDist = dist;
  if (snap){
    view.az = .04;
    view.polar = polar;
    view.dist = dist;
  }
}

canvas.addEventListener('pointerdown', (e) => {
  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  noteInteraction();
  if (activePointers.size === 1){
    dragging = true;
    pointerDown = true;
    pointerStartAt = performance.now();
    pointerTravel = 0;
    pinched = false;
    prevPointer = { x: e.clientX, y: e.clientY };
    canvas.classList.add('dragging');
  } else {
    dragging = false;
    pinched = true;
    pointerDown = false;
    const pts = [...activePointers.values()];
    pinchStart = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    pinchBase = view.tDist;
  }
});
canvas.addEventListener('pointermove', (e) => {
  if (!activePointers.has(e.pointerId)) return;
  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (activePointers.size >= 2){
    const pts = [...activePointers.values()];
    const sep = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    if (pinchStart > 0 && sep > 4) view.tDist = clamp(pinchBase * (pinchStart / sep), 5.1, 10.8);
    noteInteraction();
    return;
  }
  if (!dragging) return;
  const dx = e.clientX - prevPointer.x;
  const dy = e.clientY - prevPointer.y;
  prevPointer = { x: e.clientX, y: e.clientY };
  pointerTravel += Math.abs(dx) + Math.abs(dy);
  view.tAz = clamp(view.tAz - dx * .0046, -.62, .62);
  view.tPolar = clamp(view.tPolar + dy * .0032, .91, 1.43);
  noteInteraction();
});
function endPointer(e, allowClick){
  const was = dragging;
  const canClick = pointerDown && pointerTravel < 8 && performance.now() - pointerStartAt < 560;
  activePointers.delete(e.pointerId);
  try {
    if (canvas.hasPointerCapture?.(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
  } catch (err) {}
  if (activePointers.size === 0){
    if (allowClick && was && canClick && !pinched) handleClick(e);
    dragging = false;
    pointerDown = false;
    pinched = false;
    canvas.classList.remove('dragging');
  } else if (activePointers.size === 1){
    const pt = [...activePointers.values()][0];
    prevPointer = { x: pt.x, y: pt.y };
    pointerDown = false;
    dragging = true;
    pointerTravel = 99;
  }
  noteInteraction();
}
canvas.addEventListener('pointerup', (e) => endPointer(e, true));
canvas.addEventListener('pointercancel', (e) => endPointer(e, false));
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  view.tDist = clamp(view.tDist * Math.exp(e.deltaY * .00105), 5.1, 10.8);
  noteInteraction();
}, { passive: false });
canvas.addEventListener('dblclick', (e) => {
  e.preventDefault();
  applyHomeView();
  noteInteraction();
});
canvas.addEventListener('contextmenu', e => e.preventDefault());

document.getElementById('homeBtn').addEventListener('click', () => {
  applyHomeView();
  noteInteraction();
});
window.addEventListener('resize', onResize);
function onResize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w < 700 ? 42 : 34;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
  if (w < 700){
    if (Math.abs(view.tDist - HOME.dist) < .05){
      target.y = 1.9;
      view.tDist = view.dist = 8.8;
      view.tPolar = view.polar = 1.28;
    }
  }
}

// -------------------------------------------------------------------------
// Boot and debug
// -------------------------------------------------------------------------

applyHomeView(true);
onResize();
updateCamera(.016);
renderer.render(scene, camera);
requestAnimationFrame(animate);

window.__TIDE_DEBUG__ = {
  THREE, scene, camera, renderer, view, target, jarRig, baseGroup, skyDome, glass,
  dad, mom, child, umbrella, ball, radio, bucket, castle, gulls, sea, tideSheet, tide,
  clickTargets, clickFx, audio, audioLevel,
  triggerClick, handleClick, startTideEvent, toggleAudio,
  setCamera(az, polar, dist, tx = 0, ty = 1.92, tz = 0){
    target.set(tx, ty, tz);
    view.tAz = view.az = az;
    view.tPolar = view.polar = polar;
    view.tDist = view.dist = dist;
    updateCamera(.016);
    lastInteract = performance.now();
  },
  home(){ applyHomeView(true); updateCamera(.016); },
  hideUI(hide = true){
    document.querySelectorAll('.masthead,.panel,.hintbar,.hint-note,.side-mark,.loading').forEach(e => e.style.display = hide ? 'none' : '');
  },
  showUI(){
    document.querySelectorAll('.masthead,.panel,.hintbar,.hint-note,.side-mark,.loading').forEach(e => e.style.display = '');
  },
  snapshot(){
    return {
      ready: !!window.__TIDE_READY__,
      calls: renderer.info.render.calls,
      triangles: renderer.info.render.triangles,
      pixelRatio: renderer.getPixelRatio(),
      camera: camera.position.toArray().map(v => +v.toFixed(2)),
      clickFx: { ...clickFx },
      tide: { active: tide.active, level: +tide.level.toFixed(2), rescue: +tide.rescue.toFixed(2), carry: +tide.carry.toFixed(2) },
      audio: { on: audio.on, state: audio.ctx ? audio.ctx.state : 'none', level: +audioLevel().toFixed(3) }
    };
  }
};
</script>
</body>
</html>
