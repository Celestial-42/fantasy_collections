<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0c0a0a" />
<title>瓶中沧海 · A Sea in a Bottle</title>
<style>
  :root{
    --ink:#0b0908;
    --bone:#efe5d2;
    --bone-dim:#b9ad99;
    --amber:#d8a66a;
    --amber-hot:#f0c38c;
    --sea:#7fc8c1;
    --line:rgba(238,224,200,.16);
    --panel:rgba(17,14,13,.52);
    --serif:"Iowan Old Style","Baskerville","Palatino Linotype","Songti SC","STSong","Noto Serif CJK SC",serif;
    --sans:"Avenir Next","Helvetica Neue","PingFang SC","Hiragino Sans GB",sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{width:100%;height:100%;margin:0;}
  html{background:var(--ink);}
  body{
    overflow:hidden;
    background:
      radial-gradient(120% 80% at 50% 0%, #2b1a14 0%, #120e0d 45%, #080707 100%);
    color:var(--bone);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    user-select:none;
  }
  #stage{position:fixed;inset:0;}
  #scene{
    display:block;
    width:100%;
    height:100%;
    outline:none;
    cursor:grab;
    touch-action:none;
  }
  #scene.dragging{cursor:grabbing;}

  .vignette,
  .grain,
  .warmth,
  .flash{
    position:fixed;
    inset:0;
    pointer-events:none;
  }
  .vignette{
    z-index:2;
    background:
      radial-gradient(ellipse at 50% 45%, transparent 34%, rgba(5,4,4,.20) 66%, rgba(5,4,4,.68) 100%),
      linear-gradient(180deg, rgba(8,6,6,.24), transparent 18%, transparent 72%, rgba(8,6,6,.48));
  }
  .grain{
    z-index:3;
    opacity:.16;
    mix-blend-mode:soft-light;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.65'/%3E%3C/svg%3E");
  }
  .warmth{
    z-index:2;
    background:radial-gradient(ellipse at 48% 58%, rgba(204,142,82,.06), transparent 46%);
    transition:opacity 1.4s ease;
  }
  .flash{
    z-index:4;
    opacity:0;
    background:radial-gradient(ellipse at 50% 28%, rgba(218,235,255,.9), rgba(163,197,229,.3) 38%, transparent 72%);
    mix-blend-mode:screen;
    transition:opacity .08s linear;
  }

  .masthead{
    position:fixed;
    z-index:10;
    top:clamp(22px,4vw,52px);
    left:clamp(22px,4.5vw,64px);
    right:clamp(22px,4.5vw,64px);
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    pointer-events:none;
  }
  .brand{
    display:flex;
    align-items:flex-start;
    gap:18px;
    max-width:min(600px,55vw);
    text-shadow:0 2px 24px rgba(0,0,0,.4);
  }
  .brand-mark{
    width:34px;
    height:52px;
    flex:0 0 auto;
    opacity:.86;
    margin-top:5px;
  }
  .brand-copy .eyebrow{
    margin:0 0 10px;
    color:var(--amber);
    font-family:var(--sans);
    font-size:9px;
    font-weight:600;
    line-height:1.2;
    letter-spacing:.34em;
    text-transform:uppercase;
  }
  h1{
    margin:0;
    font-family:var(--serif);
    font-weight:400;
    font-size:clamp(38px,4.7vw,70px);
    line-height:.92;
    letter-spacing:.06em;
  }
  .latin{
    margin:13px 0 0;
    color:var(--bone-dim);
    font-size:9px;
    font-weight:500;
    letter-spacing:.48em;
    line-height:1;
    text-transform:uppercase;
  }
  .chapter{
    margin:17px 0 0;
    color:rgba(239,229,210,.58);
    font-family:var(--serif);
    font-size:12px;
    letter-spacing:.1em;
  }

  .timepanel{
    pointer-events:none;
    width:min(276px,34vw);
    padding:17px 18px 16px;
    border:1px solid var(--line);
    border-radius:3px;
    background:linear-gradient(145deg, rgba(27,22,19,.55), rgba(12,10,9,.22));
    box-shadow:0 16px 40px rgba(0,0,0,.18);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
  }
  .time-head{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px;
  }
  .phase{
    font-family:var(--serif);
    font-size:20px;
    letter-spacing:.15em;
    color:var(--bone);
    white-space:nowrap;
  }
  .clock{
    color:var(--amber-hot);
    font-family:var(--sans);
    font-size:11px;
    font-weight:500;
    letter-spacing:.22em;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .time-rule{
    position:relative;
    height:1px;
    margin:17px 0 10px;
    background:rgba(239,229,210,.16);
  }
  .time-rule .marker{
    position:absolute;
    top:-3px;
    left:0;
    width:7px;
    height:7px;
    margin-left:-3px;
    border-radius:50%;
    background:var(--amber-hot);
    box-shadow:0 0 10px rgba(240,195,140,.75);
    transition:left .2s linear;
  }
  .time-scale{
    position:relative;
    height:11px;
    color:rgba(239,229,210,.4);
    font-size:8px;
    letter-spacing:.13em;
  }
  .time-scale span{
    position:absolute;
    top:0;
    white-space:nowrap;
    transform:translateX(-50%);
  }
  .time-scale span:nth-child(1){left:0;transform:none;}
  .time-scale span:nth-child(2){left:25%;}
  .time-scale span:nth-child(3){left:50%;}
  .time-scale span:nth-child(4){left:75%;}
  .speed-note{
    display:flex;
    align-items:center;
    gap:7px;
    margin-top:13px;
    color:rgba(239,229,210,.36);
    font-size:8px;
    letter-spacing:.16em;
    text-transform:uppercase;
  }
  .speed-note i{
    width:4px;height:4px;border-radius:50%;
    background:var(--amber);
    box-shadow:0 0 8px rgba(216,166,106,.7);
  }
  .back-index{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-top:13px;
    padding:7px 9px;
    border:1px solid rgba(239,229,210,.16);
    background:rgba(10,8,8,.16);
    color:rgba(239,229,210,.42);
    font-family:var(--sans);
    font-size:8px;
    letter-spacing:.18em;
    line-height:1;
    text-decoration:none;
    pointer-events:auto;
    transition:border-color .25s ease, color .25s ease, background .25s ease;
  }
  .back-index .arrow{
    font-size:11px;
    line-height:1;
    transition:transform .25s ease;
  }
  .back-index:hover{
    border-color:rgba(216,166,106,.5);
    color:var(--amber-hot);
    background:rgba(216,166,106,.06);
  }
  .back-index:hover .arrow{transform:translateX(-3px);}
  .back-index:focus-visible{
    outline:1px solid var(--amber);
    outline-offset:3px;
  }

  .sideindex{
    position:fixed;
    z-index:10;
    top:50%;
    left:clamp(20px,2.2vw,34px);
    transform:translateY(-50%) rotate(180deg);
    writing-mode:vertical-rl;
    pointer-events:none;
    color:rgba(239,229,210,.28);
    font-size:8px;
    letter-spacing:.28em;
    text-transform:uppercase;
  }
  .sideindex::before{
    content:"";
    display:inline-block;
    width:1px;height:34px;
    margin-top:12px;
    background:rgba(239,229,210,.18);
  }

  .footer{
    position:fixed;
    z-index:12;
    left:clamp(18px,4.5vw,64px);
    right:clamp(18px,4.5vw,64px);
    bottom:clamp(18px,3.2vw,38px);
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:end;
    gap:18px;
    pointer-events:none;
  }
  .hint-block{
    justify-self:start;
    align-self:end;
    max-width:290px;
    color:rgba(239,229,210,.52);
    font-size:9px;
    line-height:2;
    letter-spacing:.12em;
  }
  .hint-block .hint-main{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:7px;
    color:rgba(239,229,210,.72);
  }
  .hint-key{
    display:inline-flex;
    align-items:center;
    height:20px;
    padding:0 7px;
    border:1px solid rgba(239,229,210,.2);
    border-radius:2px;
    color:var(--bone);
    font-size:8px;
    letter-spacing:.14em;
    background:rgba(10,8,8,.25);
  }
  .hint-sub{
    margin-top:7px;
    color:rgba(239,229,210,.3);
    font-size:8px;
    letter-spacing:.18em;
    text-transform:uppercase;
  }

  .console{
    pointer-events:auto;
    display:flex;
    align-items:stretch;
    gap:0;
    height:46px;
    border:1px solid var(--line);
    border-radius:3px;
    background:linear-gradient(160deg, rgba(29,23,20,.7), rgba(12,10,9,.55));
    box-shadow:0 14px 44px rgba(0,0,0,.28);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    overflow:hidden;
  }
  .console-label{
    display:flex;
    align-items:center;
    padding:0 14px;
    border-right:1px solid rgba(239,229,210,.1);
    color:rgba(239,229,210,.36);
    font-size:8px;
    letter-spacing:.16em;
    white-space:nowrap;
  }
  .speed-buttons{display:flex;align-items:stretch;}
  .speed-btn{
    position:relative;
    min-width:43px;
    padding:0 10px;
    border:0;
    border-right:1px solid rgba(239,229,210,.08);
    background:transparent;
    color:rgba(239,229,210,.48);
    font-family:var(--sans);
    font-size:9px;
    letter-spacing:.1em;
    cursor:pointer;
    transition:color .2s ease, background .2s ease;
  }
  .speed-btn:hover{color:var(--bone);background:rgba(239,229,210,.04);}
  .speed-btn.active{
    color:var(--ink);
    background:var(--amber-hot);
    font-weight:600;
  }
  .speed-btn.pause{
    min-width:44px;
    font-size:9px;
    border-right:0;
  }
  .speed-btn.pause.active{
    color:var(--bone);
    background:rgba(239,229,210,.14);
  }
  .sound-btn{
    min-width:40px;
    padding:0 9px;
    border:0;
    border-left:1px solid rgba(239,229,210,.08);
    background:transparent;
    color:rgba(239,229,210,.45);
    cursor:pointer;
    display:grid;
    place-items:center;
    transition:color .2s ease, background .2s ease;
  }
  .sound-btn:hover{color:var(--bone);background:rgba(239,229,210,.04);}
  .sound-btn.on{color:var(--amber-hot);background:rgba(216,166,106,.08);}
  .sound-btn .wave{display:block;}
  .sound-btn .slash{display:none;}
  .sound-btn:not(.on) .wave{display:none;}
  .sound-btn:not(.on) .slash{display:block;}
  .sound-icon{display:grid;place-items:center;}
  .sound-icon.hint{animation:audioPulse 2.2s ease-in-out infinite;}
  @keyframes audioPulse{
    0%,100%{opacity:.5;}
    50%{opacity:1;filter:drop-shadow(0 0 6px rgba(240,195,140,.5));}
  }
  .storm-control{
    pointer-events:auto;
    justify-self:end;
    align-self:end;
    display:flex;
    align-items:center;
    gap:14px;
    height:46px;
    padding:0 17px;
    border:1px solid var(--line);
    border-radius:3px;
    background:linear-gradient(160deg, rgba(29,23,20,.7), rgba(12,10,9,.55));
    box-shadow:0 14px 44px rgba(0,0,0,.28);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    color:rgba(239,229,210,.62);
    font-family:var(--sans);
    font-size:9px;
    letter-spacing:.16em;
    cursor:pointer;
    transition:background .3s ease,color .3s ease,border-color .3s ease;
    user-select:none;
    touch-action:none;
  }
  .storm-control:hover{
    color:var(--bone);
    border-color:rgba(239,229,210,.28);
  }
  .storm-control .bolt{
    position:relative;
    width:19px;height:22px;
    transition:filter .3s ease, transform .3s ease;
  }
  .storm-control .keycap{
    color:rgba(239,229,210,.3);
    font-size:7px;
    letter-spacing:.13em;
    border-left:1px solid rgba(239,229,210,.14);
    padding-left:13px;
  }
  body.is-storm .storm-control{
    color:#e7f2ff;
    border-color:rgba(143,191,230,.44);
    background:linear-gradient(160deg, rgba(27,39,50,.82), rgba(10,15,20,.7));
  }
  body.is-storm .storm-control .bolt{
    filter:drop-shadow(0 0 7px rgba(147,203,255,.9));
    transform:translateY(-1px);
  }
  body.is-storm .storm-control .keycap{color:rgba(158,203,242,.62);}
  body.is-storm .phase{color:#dbeaff;}
  body.is-storm .timepanel{border-color:rgba(141,186,220,.26);}
  body.is-storm .warmth{opacity:.25;}

  .loading{
    position:fixed;
    inset:0;
    z-index:40;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(ellipse at 50% 45%, #271910 0%, #100c0b 48%, #070606 100%);
    opacity:1;
    visibility:visible;
    transition:opacity 1s ease, visibility 1s;
  }
  .loading.done{opacity:0;visibility:hidden;}
  .loading-inner{width:min(340px,64vw);text-align:center;}
  .loading-mark{
    width:44px;height:44px;margin:0 auto 28px;
    opacity:.8;
    animation:float 4s ease-in-out infinite;
  }
  .loading-title{
    font-family:var(--serif);
    font-size:22px;
    letter-spacing:.34em;
    color:var(--bone);
    margin-left:.34em;
  }
  .loading-en{
    margin:13px 0 26px;
    color:rgba(239,229,210,.28);
    font-size:7px;
    letter-spacing:.42em;
    text-transform:uppercase;
  }
  .loading-track{
    position:relative;
    height:1px;
    overflow:hidden;
    background:rgba(239,229,210,.12);
  }
  .loading-track::after{
    content:"";
    position:absolute;top:0;left:-40%;
    width:40%;height:100%;
    background:linear-gradient(90deg, transparent, var(--amber-hot), transparent);
    animation:scan 1.8s cubic-bezier(.7,0,.3,1) infinite;
  }
  .loading-status{
    margin:25px 0 0;
    color:rgba(239,229,210,.26);
    font-size:8px;
    letter-spacing:.22em;
  }
  .loading.is-error .loading-track::after{display:none;}
  .loading.is-error .loading-title{font-size:17px;line-height:1.7;letter-spacing:.12em;}
  .loading.is-error .loading-status{color:rgba(239,229,210,.5);line-height:2;}
  .loading.is-error .loading-mark{animation:none;opacity:.35;}
  @keyframes scan{to{left:110%;}}
  @keyframes float{0%,100%{transform:translateY(-2px) rotate(-2deg);}50%{transform:translateY(4px) rotate(2deg);}}

  .credit{
    position:fixed;
    z-index:10;
    right:clamp(20px,4.5vw,64px);
    top:calc(clamp(22px,4vw,52px) + 185px);
    writing-mode:vertical-rl;
    color:rgba(239,229,210,.20);
    font-size:7px;
    letter-spacing:.26em;
    text-transform:uppercase;
    pointer-events:none;
  }

  @media (max-width: 880px){
    .masthead{align-items:flex-start;}
    .brand{max-width:62vw;gap:13px;}
    .brand-mark{width:24px;height:38px;margin-top:2px;}
    .brand-copy .eyebrow{font-size:7px;letter-spacing:.26em;margin-bottom:8px;}
    h1{font-size:clamp(32px,8vw,48px);}
    .latin{font-size:7px;letter-spacing:.34em;margin-top:10px;}
    .chapter{display:none;}
    .timepanel{width:172px;padding:12px 13px 11px;}
    .phase{font-size:16px;}
    .clock{font-size:9px;}
    .time-rule{margin:12px 0 8px;}
    .time-scale{font-size:6px;letter-spacing:.05em;}
    .speed-note{display:none;}
    .sideindex{display:none;}
    .credit{display:none;}
    .footer{
      grid-template-columns:1fr;
      gap:11px;
      align-items:end;
      justify-items:stretch;
    }
    .hint-block{display:none;}
    .console{justify-self:center;}
    .storm-control{justify-self:center;height:42px;}
    .console{height:42px;}
    .speed-btn{min-width:40px;}
  }
  @media (max-width: 540px){
    .brand{max-width:55vw;}
    h1{font-size:32px;letter-spacing:.04em;}
    .timepanel{width:144px;}
    .phase{font-size:14px;letter-spacing:.08em;}
    .clock{font-size:8px;letter-spacing:.12em;}
    .time-scale span:nth-child(2),.time-scale span:nth-child(3){display:none;}
    .masthead{gap:10px;}
    .console-label{display:none;}
    .speed-btn{min-width:44px;padding:0 8px;}
    .storm-control{padding:0 14px;gap:10px;}
    .storm-control .keycap{display:none;}
  }
  @media (prefers-reduced-motion: reduce){
    .loading-mark{animation:none;}
    .loading-track::after{animation-duration:3.6s;}
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="scene" role="img" aria-label="一艘三桅帆船航行在横卧玻璃瓶中的暮色海洋上"></canvas>
</div>
<div class="warmth" id="warmth"></div>
<div class="vignette"></div>
<div class="grain"></div>
<div class="flash" id="flash"></div>

<header class="masthead">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 34 52" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M17 1v8M17 43v8" stroke="currentColor" stroke-width=".8" opacity=".5"/>
      <path d="M9 13.5h16M6 38.5h22" stroke="currentColor" stroke-width=".8" opacity=".45"/>
      <path d="M10 17c0-2.4 3.1-4.4 7-4.4s7 2 7 4.4v9.2c0 5.2-3.1 9.4-7 12.5-3.9-3.1-7-7.3-7-12.5V17Z" stroke="currentColor" stroke-width=".9" opacity=".8"/>
      <path d="M11.2 28.6c2.1 0 2.1 1.5 4.2 1.5s2.1-1.5 4.2-1.5 2.1 1.5 3.5 1.5" stroke="currentColor" stroke-width=".8" opacity=".8"/>
      <circle cx="17" cy="19.8" r="1.3" fill="currentColor" opacity=".8"/>
    </svg>
    <div class="brand-copy">
      <p class="eyebrow">Atelier No. 01 · WebGL Voxel Diorama</p>
      <h1>瓶中沧海</h1>
      <p class="latin">A Sea in a Bottle</p>
      <p class="chapter">在玻璃的疆界里，让一整片海继续呼吸。</p>
    </div>
  </div>

  <aside class="timepanel" aria-label="昼夜时间">
    <div class="time-head">
      <span class="phase" id="phase">黄昏</span>
      <span class="clock" id="clock">17:18</span>
    </div>
    <div class="time-rule"><span class="marker" id="dayMarker"></span></div>
    <div class="time-scale" aria-hidden="true">
      <span>黎明</span><span>正午</span><span>黄昏</span><span>子夜</span>
    </div>
    <div class="speed-note"><i></i><span id="speedLabel">延时 ×1 · 潮汐时流</span></div>
    <a class="back-index" href="../" aria-label="返回总集目录">
      <span class="arrow" aria-hidden="true">←</span>
      <span>总集目录</span>
    </a>
  </aside>
</header>

<div class="sideindex">Bottled ocean / 01</div>
<div class="credit">Made of light &amp; salt</div>

<footer class="footer">
  <div class="hint-block">
    <div class="hint-main">
      <span class="hint-key">拖拽</span><span>环视</span>
      <span class="hint-key">滚轮</span><span>推近</span>
      <span class="hint-key">SPACE</span><span>按住起风</span>
    </div>
    <div class="hint-sub">Idle gaze resumes — 静置片刻，镜头自行巡航</div>
  </div>

  <div class="console" role="group" aria-label="昼夜时流与环境声">
    <span class="console-label">潮汐时流</span>
    <div class="speed-buttons">
      <button class="speed-btn" data-speed="1" type="button">×1</button>
      <button class="speed-btn active" data-speed="4" type="button">×4</button>
      <button class="speed-btn" data-speed="12" type="button">×12</button>
      <button class="speed-btn pause" id="pauseBtn" type="button" aria-label="暂停时间">❚❚</button>
      <button class="sound-btn" id="audioBtn" type="button" aria-label="开启环境声" aria-pressed="false" title="开启环境声">
        <span class="sound-icon hint" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 9.3h3.4L12 5.1v13.8l-4.6-4.2H4z"/>
            <path class="wave" d="M15.4 9.2a4.1 4.1 0 0 1 0 5.6M18 6.7a7.7 7.7 0 0 1 0 10.6"/>

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function makeRadialTexture(stops = [
  [0, 'rgba(255,255,255,1)'],
  [0.16, 'rgba(255,255,255,.9)'],
  [0.44, 'rgba(255,255,255,.22)'],
  [1, 'rgba(255,255,255,0)']
], size = 256){
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  for (const [p, color] of stops) g.addColorStop(p, color);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makeShadowTexture(){
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(128,128,16,128,128,128);
  g.addColorStop(0,'rgba(0,0,0,.62)');
  g.addColorStop(.34,'rgba(0,0,0,.38)');
  g.addColorStop(.72,'rgba(0,0,0,.11)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,256,256);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

}

function makeCanvasTexture(width, height, painter){

}

// -------------------------------------------------------------------------

const cubeGeometry = new THREE.BoxGeometry(1, 1, 1);
const unitDummy = new THREE.Object3D();
const unitColor = new THREE.Color();

class VoxelList {
  constructor(material){
    this.material = material;
    this.items = [];
  }
  add(x, y, z, w, h, d, color, opts = {}){
    this.items.push({
      x, y, z, w, h, d, color,
      rx: opts.rx || 0,
      ry: opts.ry || 0,
      rz: opts.rz || 0
    });
    return this;
  }
  build(parent){
    if (!this.items.length) return null;
    const mesh = new THREE.InstancedMesh(cubeGeometry, this.material, this.items.length);
    for (let i = 0; i < this.items.length; i++){
      const b = this.items[i];
      unitDummy.position.set(b.x, b.y, b.z);
      unitDummy.rotation.set(b.rx, b.ry, b.rz);
      unitDummy.scale.set(b.w, b.h, b.d);
      unitDummy.updateMatrix();
      mesh.setMatrixAt(i, unitDummy.matrix);
      unitColor.set(b.color);
      mesh.setColorAt(i, unitColor);
    }
    mesh.instanceMatrix.needsUpdate = true;
    if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
    mesh.frustumCulled = false;
    if (parent) parent.add(mesh);
    return mesh;
  }
}

function buildBooks(){
  const specs = [
    { x:-7.35, y:.18, z:2.95, w:2.35, h:.34, d:3.05, ry:.075, cover:'#31453b', edge:'#d6c39c', band:'#b28a4e' },

    { x:-7.39, y:.76, z:2.96, w:1.70, h:.23, d:2.25, ry:.045, cover:'#28344c', edge:'#d9c9a7', band:'#a8834d' }
  ];
  for (const b of specs){
    const sin = Math.sin(b.ry), cos = Math.cos(b.ry);
    const ox = (dx, dz) => b.x + dx * cos + dz * sin;
    const oz = (dx, dz) => b.z - dx * sin + dz * cos;
    // page block
    roomMatte.add(ox(0,0), b.y, oz(0,0), b.w - .12, b.h * .68, b.d - .10, b.edge, { ry:b.ry });
    // top & bottom covers
    roomMatte.add(ox(0,0), b.y + b.h*.43, oz(0,0), b.w, b.h*.13, b.d, b.cover, { ry:b.ry });
    roomMatte.add(ox(0,0), b.y - b.h*.43, oz(0,0), b.w, b.h*.13, b.d, b.cover, { ry:b.ry });
    // spine
    roomMatte.add(ox(-b.w*.48, 0), b.y - b.h*.1, oz(-b.w*.48, 0), .065, b.h*.9, b.d*.98, b.cover, { ry:b.ry });

    }
    // page striations
    for (let i=0; i<3; i++){
      roomMatte.add(ox(0, (i-1)*b.d*.29), b.y + .015, oz(0, (i-1)*b.d*.29), b.w*.82, .006, .012, '#bfae8c', { ry:b.ry });
    }
  }

  roomMatte.add(-7.92, .59, 4.22, .12, .014, .86, '#852f2d', { ry:.08 });
  roomMatte.add(-7.96, .47, 4.62, .1, .014, .52, '#6d2525', { rz:.35 });
}

function cylinderBetween(a, b, radius, material, segments = 8){
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const geo = new THREE.CylinderGeometry(radius, radius, len, segments, 1);
  const mesh = new THREE.Mesh(geo, material);
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.normalize());
  mesh.frustumCulled = false;
  return mesh;
}

function latheFromProfile(profile, segments = 96, scale = 1, closeMouth = false){
  const pts = profile.map(([r, y]) => new THREE.Vector2(r * scale, y));
  if (closeMouth){
    const last = profile[profile.length - 1];
    pts.push(new THREE.Vector2(0.001, last[1]));
  }
  const geo = new THREE.LatheGeometry(pts, segments);
  geo.rotateZ(-Math.PI / 2);
  geo.translate(-BOTTLE_LEN / 2, 0, 0);
  geo.computeVertexNormals();
  return geo;
}

  uEye: { value: new THREE.Vector3() },
  uKeyColor: { value: new THREE.Color('#ffd7a5') },
  uSkyColor: { value: new THREE.Color('#9fc7da') },
  uStorm: { value: 0 },
  uGlow: { value: new THREE.Color('#e8c49a') }
};
const glassMaterial = new THREE.ShaderMaterial({
  uniforms: glassUniforms,
  transparent: true,
  depthWrite: false,
  side: THREE.DoubleSide,
  blending: THREE.NormalBlending,
  vertexShader: /* glsl */`
    varying vec3 vN;
    varying vec3 vWorld;
    varying vec3 vLocal;
    void main(){
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorld = wp.xyz;
      vLocal = position;
      vN = normalize(mat3(modelMatrix) * normal);
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: /* glsl */`
    varying vec3 vN;
    varying vec3 vWorld;
    varying vec3 vLocal;
    uniform vec3 uKeyColor;
    uniform vec3 uSkyColor;
    uniform vec3 uGlow;
    uniform float uStorm;

    float hash(vec2 p){ return fract(sin(dot(p, vec2(41.3, 289.1))) * 43758.5453); }

    void main(){
      vec3 N = normalize(vN);
      vec3 V = normalize(cameraPosition - vWorld);
      float ndv = abs(dot(N, V));
      float fresnel = pow(1.0 - ndv, 2.5);
      vec3 L1 = normalize(vec3(-0.55, 0.78, 0.42));
      vec3 L2 = normalize(vec3(0.72, -0.15, 0.68));
      vec3 H1 = normalize(L1 + V);
      vec3 H2 = normalize(L2 + V);
      float spec1 = pow(max(dot(N, H1), 0.0), 150.0);
      float spec2 = pow(max(dot(N, H2), 0.0), 48.0) * .22;
      float soft = pow(max(dot(N, H1), 0.0), 14.0) * .07;
      // narrow reflected window band
      float band = smoothstep(.78, .985, N.y * .82 + N.z * .18);
      band *= smoothstep(.18, .92, ndv) * .14;

      float rim = smoothstep(.1, .9, fresnel);
      vec3 tint = mix(vec3(.20,.31,.31), vec3(.58,.74,.74), rim);
      vec3 col = tint * (.16 + fresnel * .62);
      col += uSkyColor * band;
      col += uKeyColor * (spec1 * 1.35 + spec2 + soft);
      col += uGlow * rim * .25;
      col += uGlow * smoothstep(.92, 1.0, N.y) * .16;

      float grain = (hash(gl_FragCoord.xy) - .5) * .018;
      float alpha = .025 + fresnel * .34 + spec1 * .72 + spec2 * .2 + band * .36 + soft;
      alpha += uStorm * .018;

      gl_FragColor = vec4(col + grain, clamp(alpha, 0.0, .9));
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }
  `
});

const innerSkyGeometry = latheFromProfile(bottleProfile, 96, 0.974, true);

  uTop: { value: new THREE.Color('#4d427e') },
  uHorizon: { value: new THREE.Color('#f0955f') },
  uLow: { value: new THREE.Color('#33222c') },
  uSunPos: { value: new THREE.Vector3(-2, 1, -.8) },
  uSunColor: { value: new THREE.Color('#ffc27e') },
  uSunStrength: { value: 0.35 },
  uMoonPos: { value: new THREE.Vector3(-2, 2, -.8) },
  uMoonColor: { value: new THREE.Color('#c6dcff') },
  uMoonStrength: { value: 0 },
  uStorm: { value: 0 },
  uFlash: { value: 0 },
  uNight: { value: 0.4 }
};
const skyMaterial = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: true,
  uniforms: skyUniforms,
  vertexShader: /* glsl */`
    varying vec3 vLocal;
    void main(){
      vLocal = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: /* glsl */`
    varying vec3 vLocal;
    uniform vec3 uTop;
    uniform vec3 uHorizon;
    uniform vec3 uLow;
    uniform vec3 uSunPos;
    uniform vec3 uSunColor;
    uniform vec3 uMoonPos;
    uniform vec3 uMoonColor;
    uniform float uSunStrength;
    uniform float uMoonStrength;
    uniform float uStorm;
    uniform float uFlash;
    uniform float uNight;

    float hash21(vec2 p){
      p = fract(p * vec2(123.34, 456.21));
      p += dot(p, p + 45.32);
      return fract(p.x * p.y);
    }

    void main(){
      vec3 dir = normalize(vLocal);
      float h = smoothstep(-1.05, 3.05, vLocal.y);
      float lowMix = smoothstep(-.95, -.05, vLocal.y);
      vec3 col = mix(uLow, uHorizon, lowMix);
      col = mix(col, uTop, smoothstep(.08, .98, h));

      float sunGlow = pow(max(dot(dir, normalize(uSunPos)), 0.0), 92.0);
      float moonGlow = pow(max(dot(dir, normalize(uMoonPos)), 0.0), 110.0);
      col += uSunColor * sunGlow * uSunStrength * .075;
      col += uMoonColor * moonGlow * uMoonStrength * .045;

      // low horizon warmth and a quiet separation from the water
      col += uHorizon * pow(1.0 - smoothstep(-1.0, .05, vLocal.y), 3.2) * .12;

      // subtle atmospheric banding
      float band = sin(vLocal.x * 1.9 + sin(vLocal.y * 3.1) * 1.4) * .5 + .5;
      col += (band - .5) * .012 * (1.0 - uNight * .6);

      vec3 stormLow = vec3(.028, .047, .067);
      vec3 stormTop = vec3(.008, .014, .025);
      vec3 stormCol = mix(stormLow, stormTop, smoothstep(-.2, .85, h));
      col = mix(col, stormCol, uStorm * .86);
      col += vec3(.65, .78, 1.0) * uFlash * (0.28 + h * .85);

      col += (hash21(gl_FragCoord.xy) - .5) / 255.0;
      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }
  `
});

  uOpacity: { value: 0 },
  uPixelRatio: { value: renderer.getPixelRatio() }
};

  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  uniforms: starUniforms,
  vertexShader: /* glsl */`
    attribute float aSize;
    attribute float aPhase;
    uniform float uTime;
    uniform float uOpacity;
    uniform float uPixelRatio;
    varying float vTwinkle;
    void main(){
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = (aSize * 980.0 * uPixelRatio) / max(2.0, -mv.z);
      vTwinkle = (.55 + .45 * sin(uTime * 1.45 + aPhase)) * uOpacity;
    }
  `,
  fragmentShader: /* glsl */`
    varying float vTwinkle;
    void main(){
      vec2 p = gl_PointCoord - .5;
      float d = length(p);
      float core = smoothstep(.5, .03, d);
      float glint = smoothstep(.08, .0, abs(p.x)) * smoothstep(.47, .02, abs(p.y))
                  + smoothstep(.08, .0, abs(p.y)) * smoothstep(.47, .02, abs(p.x));
      float a = core * .72 + glint * .35;
      if (a < .01) discard;
      gl_FragColor = vec4(vec3(.72,.84,1.0) * (1.0 + vTwinkle * .8), a * vTwinkle);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }
  `
});

    g.addColorStop(1,'rgba(255,150,70,0)');
    ctx.fillStyle=g;
    ctx.fillRect(0,0,w,h);
    ctx.save();
    ctx.translate(cx,cy);
    ctx.globalCompositeOperation='lighter';
    for(let i=0;i<16;i++){
      ctx.rotate(TAU/16);
      const ray=ctx.createLinearGradient(0,0,w*.43,0);
      ray.addColorStop(0,'rgba(255,236,182,.2)');
      ray.addColorStop(1,'rgba(255,216,150,0)');
      ctx.fillStyle=ray;
      ctx.fillRect(20,-2,w*.31,4);

  });
}

function waveHeight(x, z, time, storm = 0){
  let h = Math.sin(x * 2.35 + time * 1.05) * .043
        + Math.sin(z * 3.05 - time * 1.40 + x * .55) * .030
        + Math.sin((x + z) * 4.60 + time * 2.05) * .015;
  h += storm * (
        Math.sin(x * 5.40 + z * 2.12 + time * 2.90) * .074 +
        Math.sin(z * 7.30 - x * 1.10 - time * 3.40) * .046 +
        Math.sin((x - z) * 3.70 + time * 1.75) * .030
      );
  return h * (1.0 + storm * .52) * 1.22;
}

const waterGeometry = new THREE.PlaneGeometry(6.0, 5.42, 104, 94);
waterGeometry.rotateX(-Math.PI / 2);
waterGeometry.translate(BODY_CENTER_X, WATER_LEVEL, 0);
const waterUniforms = {
  uTime: { value: 0 },
  uStorm: { value: 0 },
  uNight: { value: .35 },
  uCenterX: { value: BODY_CENTER_X },
  uDeep: { value: new THREE.Color('#0a3942') },
  uShallow: { value: new THREE.Color('#2d9492') },
  uFoam: { value: new THREE.Color('#e5f4e9') },
  uSkyTop: { value: new THREE.Color('#423a77') },
  uSkyHorizon: { value: new THREE.Color('#f39a63') },
  uSunDir: { value: new THREE.Vector3(-.2, .8, -.5) },
  uSunColor: { value: new THREE.Color('#ffcf9c') }
};
const waterMaterial = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  uniforms: waterUniforms,
  vertexShader: /* glsl */`
    uniform float uTime;
    uniform float uStorm;
    varying vec3 vWorldPos;
    varying vec2 vGrid;
    varying vec3 vNormalW;
    varying float vHeight;
    varying float vEdge;

    float wave(vec2 p, float t, float s){
      float h = sin(p.x * 2.35 + t * 1.05) * .043
              + sin(p.y * 3.05 - t * 1.40 + p.x * .55) * .030
              + sin((p.x + p.y) * 4.60 + t * 2.05) * .015;
      h += s * (
            sin(p.x * 5.40 + p.y * 2.12 + t * 2.90) * .074 +
            sin(p.y * 7.30 - p.x * 1.10 - t * 3.40) * .046 +
            sin((p.x - p.y) * 3.70 + t * 1.75) * .030
          );
      return h * (1.0 + s * .52) * 1.22;
    }

    void main(){
      vec3 p = position;
      float h = wave(p.xz, uTime, uStorm);
      p.y += h;
      float eps = .035;
      float hx = wave(p.xz + vec2(eps, 0.0), uTime, uStorm) - wave(p.xz - vec2(eps, 0.0), uTime, uStorm);
      float hz = wave(p.xz + vec2(0.0, eps), uTime, uStorm) - wave(p.xz - vec2(0.0, eps), uTime, uStorm);
      vec3 n = normalize(vec3(-hx, 2.0 * eps, -hz));
      vec4 world = modelMatrix * vec4(p, 1.0);
      vWorldPos = world.xyz;
      vNormalW = normalize(mat3(modelMatrix) * n);
      vGrid = position.xz;
      vHeight = h;
      gl_Position = projectionMatrix * viewMatrix * world;
    }
  `,
  fragmentShader: /* glsl */`
    uniform float uTime;
    uniform float uStorm;
    uniform float uNight;
    uniform float uCenterX;
    uniform vec3 uDeep;
    uniform vec3 uShallow;
    uniform vec3 uFoam;
    uniform vec3 uSkyTop;
    uniform vec3 uSkyHorizon;
    uniform vec3 uSunDir;
    uniform vec3 uSunColor;
    varying vec3 vWorldPos;
    varying vec2 vGrid;
    varying vec3 vNormalW;
    varying float vHeight;

    float sdRoundBox(vec2 p, vec2 b, float r){
      vec2 q = abs(p) - b + r;
      return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
    }
    float hash21(vec2 p){
      p = fract(p * vec2(123.34, 456.21));
      p += dot(p, p + 45.32);
      return fract(p.x * p.y);
    }
    float crestNoise(vec2 p, float t){
      return sin(p.x * 10.5 + sin(p.y * 6.2 + t) * 1.4 + t * 1.1)
           * sin(p.y * 8.7 - t * .9 + p.x * 1.3) * .5 + .5;
    }

    void main(){
      vec2 q = vec2(vGrid.x - uCenterX, vGrid.y);
      float sd = sdRoundBox(q, vec2(2.93, 2.62), .34);
      if (sd > -.015) discard;

      vec3 N = normalize(vNormalW);
      // facet breakup makes the displaced sheet read as a voxel sea
      N = normalize(mix(N, normalize(cross(dFdx(vWorldPos), dFdy(vWorldPos))), .33));
      vec3 V = normalize(cameraPosition - vWorldPos);
      float fres = pow(1.0 - max(dot(N, V), 0.0), 3.0);
      float crest = smoothstep(.020 + uStorm*.03, .13 + uStorm*.055, vHeight);
      float pattern = crestNoise(vGrid, uTime);
      float foam = crest * smoothstep(.15, .67, pattern + uStorm * .6);
      float caps = smoothstep(.070 + uStorm*.03, .15 + uStorm*.055, vHeight) * (.45 + uStorm*.55);
      caps *= smoothstep(.18, .58, pattern + .16);
      float edgeFoam = smoothstep(.14, 0.0, -sd) * (.12 + uStorm*.24);
      float glint = pow(max(dot(reflect(-normalize(uSunDir), N), V), 0.0), 120.0) * (1.0 - uNight * .8);

      vec3 deep = uDeep * mix(.62, 1.0, uNight);
      vec3 shallow = uShallow * mix(.86, .62, uNight);
      vec3 col = mix(deep, shallow, smoothstep(-.10, .15, vHeight));
      float tile = mod(floor(vGrid.x * 38.0) + floor(vGrid.y * 34.0), 2.0);
      col *= 1.0 + (tile - .5) * .022;
      vec3 skyCol = mix(uSkyHorizon, uSkyTop, clamp(N.y * .5 + .5, 0.0, 1.0));
      col = mix(col, skyCol, fres * .58);
      col = mix(col, uFoam, clamp(foam * .88 + caps * .82 + edgeFoam, 0.0, .9));
      col += uSunColor * glint * .7;
      col += uSunColor * fres * .05;
      col = mix(col, col * vec3(.5,.65,.72), uStorm * .28);

      float alpha = .70 + fres * .20 + foam * .05 + edgeFoam * .3;
      alpha = mix(alpha, .93, uStorm * .12);
      gl_FragColor = vec4(col, clamp(alpha, 0.0, .96));
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }
  `
});
const water = new THREE.Mesh(waterGeometry, waterMaterial);
water.renderOrder = 9;
water.frustumCulled = false;
bottleWorld.add(water);

// Underwater volume: a deep, rounded interior tint with no seabed
const waterVolumeGeometry = latheFromProfile(bottleProfile, 72, .935, true);
const volumeUniforms = {
  uWaterLevel: { value: WATER_LEVEL },
  uTime: { value: 0 },
  uStorm: { value: 0 },
  uDeep: { value: new THREE.Color('#031b2b') },
  uShallow: { value: new THREE.Color('#1a6468') },
  uNight: { value: .35 }
};
const waterVolumeMaterial = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  transparent: true,
  depthWrite: false,
  uniforms: volumeUniforms,
  vertexShader: /* glsl */`
    varying vec3 vPos;
    void main(){
      vPos = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: /* glsl */`
    uniform float uWaterLevel;
    uniform float uTime;
    uniform float uStorm;
    uniform vec3 uDeep;
    uniform vec3 uShallow;
    uniform float uNight;
    varying vec3 vPos;
    void main(){
      if (vPos.y > uWaterLevel - .02) discard;
      float depth = clamp((uWaterLevel - vPos.y) / 2.15, 0.0, 1.0);
      vec3 col = mix(uShallow, uDeep, smoothstep(.0, 1.0, depth));
      float bands = sin(vPos.x * 7.2 + uTime * .33) * sin(vPos.z * 6.5 - uTime * .24);
      float caustic = smoothstep(.35, .95, bands * .5 + .5) * (1.0 - depth) * .16;
      col += vec3(.25,.58,.55) * caustic;
      col = mix(col, col * vec3(.35,.55,.68), uNight * .34);
      float alpha = mix(.08, .68, pow(depth, .72));
      alpha *= .92 - uStorm * .05;
      gl_FragColor = vec4(col, alpha);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }
  `
});
const waterVolume = new THREE.Mesh(waterVolumeGeometry, waterVolumeMaterial);
waterVolume.renderOrder = 5;
waterVolume.frustumCulled = false;
bottleWorld.add(waterVolume);

// faint front-face tint to give the water body a little weight
const waterVolumeFrontMaterial = waterVolumeMaterial.clone();
waterVolumeFrontMaterial.side = THREE.FrontSide;
waterVolumeFrontMaterial.uniforms = volumeUniforms;
waterVolumeFrontMaterial.fragmentShader = waterVolumeFrontMaterial.fragmentShader.replace(
  'gl_FragColor = vec4(col, alpha);',
  'gl_FragColor = vec4(col, alpha * .06);'
);
const waterVolumeFront = new THREE.Mesh(waterVolumeGeometry, waterVolumeFrontMaterial);
waterVolumeFront.renderOrder = 11;
waterVolumeFront.frustumCulled = false;
bottleWorld.add(waterVolumeFront);

const bottleMatte = new VoxelList(matVoxel);
const bottleMetal = new VoxelList(matMetal);
const bottleGlow = new VoxelList(matGlow);

const islandPalette = {
  grass: ['#527946','#628b50','#4b7045','#6f9558','#597c49'],
  grassDark: ['#3f603d','#486b41'],
  sand: ['#b79a69','#c5a773','#ad8e60','#d0b27e'],
  wetSand: ['#8a775b','#9a8362','#7b6d58'],
  rock: ['#4d4a43','#5b564c','#45443e','#615a4e'],
  rockDeep: ['#333a3b','#2a3132','#3d4140']
};

function islandTopAt(x, z){
  const d = Math.hypot(x - ISLAND_X, z - ISLAND_Z);
  if (d < .53) return -.41;
  if (d < .72) return -.50;
  if (d < .91) return -.60;
  if (d < 1.05) return -.72;
  if (d < 1.18) return -.85;
  return null;
}

function buildIsland(){
  const step = .145;
  for (let ix = -9; ix <= 9; ix++){
    for (let iz = -9; iz <= 9; iz++){
      const gx = ix * step;
      const gz = iz * step;
      const jitter = Math.sin(ix * 12.9898 + iz * 78.233) * .5 + .5;
      const d = Math.hypot(gx, gz) + (jitter - .5) * .17;
      if (d > 1.2) continue;
      let top;
      if (d < .55) top = -.41 + jitter * .025;
      else if (d < .78) top = -.50 + jitter * .04;
      else if (d < .97) top = -.61 + jitter * .05;
      else if (d < 1.09) top = -.73 + jitter * .04;
      else top = -.87 + jitter * .035;

      const x = ISLAND_X + gx;
      const z = ISLAND_Z + gz;
      const bottom = -1.88 + d * .19;
      let y = bottom;
      let first = true;
      while (y < top){
        const h = Math.min(.18, top - y + .02);
        let c;
        if (y < -1.2) c = pick(islandPalette.rockDeep);
        else if (y < -.95) c = pick(islandPalette.rock);
        else if (y < top - .13 && top < -.64) c = pick(islandPalette.wetSand);
        else if (y < top - .13) c = pick(islandPalette.sand);
        else if (top > -.65) c = pick(islandPalette.grass);
        else if (top > -.8) c = pick(islandPalette.sand);
        else c = pick(islandPalette.rock);
        if (first && top < -.62 && jitter > .55) c = pick(islandPalette.sand);
        bottleMatte.add(
          x + (jitter - .5) * .012, y + h/2, z + (jitter - .5) * .012,
          step * 1.035, h + .002, step * 1.035, c
        );
        y += h;
        first = false;
      }
      // top cap
      let topColor;
      if (top > -.64 && d < .9) topColor = pick(islandPalette.grass);
      else if (top > -.82) topColor = pick(islandPalette.sand);
      else topColor = pick(islandPalette.rock);
      bottleMatte.add(x, top + .028, z, step * 1.04, .07, step * 1.04, topColor);
    }
  }

  // beach stones and shells
  for (let i=0;i<18;i++){
    const a = randRange(0, TAU);
    const d = randRange(.88, 1.13);
    const x = ISLAND_X + Math.cos(a) * d;
    const z = ISLAND_Z + Math.sin(a) * d;
    const top = islandTopAt(x,z) || -.82;
    bottleMatte.add(x, top + .09, z, randRange(.06,.14), .08, randRange(.06,.13), pick(islandPalette.rock), { ry: randRange(0,TAU) });
  }
  for (let i=0;i<9;i++){
    const a = randRange(0, TAU);
    const d = randRange(.95, 1.16);
    const x = ISLAND_X + Math.cos(a) * d;
    const z = ISLAND_Z + Math.sin(a) * d;
    const top = islandTopAt(x,z) || -.84;
    bottleMatte.add(x, top + .055, z, .055, .022, .075, i%2 ? '#d8cdb2' : '#d8a38d', { ry: randRange(0,TAU) });
  }

  // grass tufts
  for (let i=0;i<26;i++){
    const a = randRange(0, TAU);
    const d = randRange(.12, .87);
    const x = ISLAND_X + Math.cos(a)*d;
    const z = ISLAND_Z + Math.sin(a)*d;
    const top = islandTopAt(x,z) || -.5;
    if (top < -.7) continue;
    bottleMatte.add(x, top + .10, z, .022, .10, .022, '#7b9b55');
    bottleMatte.add(x + .035, top + .08, z + .02, .018, .07, .018, '#8bab60');
  }

  // a few tiny red flowers
  for (let i=0;i<8;i++){
    const x = ISLAND_X + randRange(-.7,.7);
    const z = ISLAND_Z + randRange(-.7,.7);
    const top = islandTopAt(x,z);
    if (top === null || top < -.65) continue;
    bottleMatte.add(x, top + .14, z, .02, .1, .02, '#6b8348');
    bottleMatte.add(x, top + .20, z, .035, .035, .035, i%2 ? '#cb6b55' : '#d9b464');
  }
}

function buildLighthouse(){
  const bx = -3.18, bz = -.34, baseY = -.42;
  bottleMatte.add(bx, baseY + .035, bz, .66, .12, .66, '#645748');
  bottleMatte.add(bx, baseY + .08, bz, .5, .12, .5, '#776656');
  const layers = 12;
  for (let layer=0; layer<layers; layer++){
    const t = layer / (layers-1);
    const r = lerp(.255, .165, t);
    const y = baseY + .12 + layer * .073;
    const color = (Math.floor(layer / 2) % 2 === 0) ? '#c9c3b0' : '#b1483e';
    const n = 8;
    for (let i=0;i<n;i++){
      const a = (i/n) * TAU + .18;
      const w = .105;
      const px = bx + Math.cos(a) * r;
      const pz = bz + Math.sin(a) * r;
      bottleMatte.add(px, y, pz, w, .075, w, color, { ry: -a });
    }
    if (layer % 3 === 0){
      bottleMatte.add(bx, y - .005, bz, r*2.2, .035, r*2.2, '#6f5e4d');
    }
  }
  const topY = baseY + .12 + layers * .073;
  bottleMatte.add(bx, topY, bz, .50, .055, .50, '#4b4038');
  bottleMatte.add(bx, topY + .018, bz, .38, .06, .38, '#8d7a66');
  // gallery rails
  for (let i=0;i<8;i++){
    const a = i/8 * TAU;
    bottleMetal.add(bx + Math.cos(a)*.24, topY + .15, bz + Math.sin(a)*.24, .023, .20, .023, '#3d3b38');
  }
  bottleMetal.add(bx, topY + .26, bz, .22, .02, .22, '#3d3b38');
  // lantern room
  const lightY = topY + .16;
  bottleGlow.add(bx, lightY, bz, .17, .19, .17, '#ffcf78');
  bottleMatte.add(bx-.14, lightY, bz-.11, .032, .30, .032, '#443b32');
  bottleMatte.add(bx+.14, lightY, bz-.11, .032, .30, .032, '#443b32');
  bottleMatte.add(bx-.14, lightY, bz+.11, .032, .30, .032, '#443b32');
  bottleMatte.add(bx+.14, lightY, bz+.11, .032, .30, .032, '#443b32');
  // roof tiers
  bottleMatte.add(bx, topY + .37, bz, .34, .055, .34, '#7e3a33');
  bottleMatte.add(bx, topY + .405, bz, .24, .05, .24, '#9f4940');
  bottleMatte.add(bx, topY + .438, bz, .12, .045, .12, '#b95b50');
  bottleMatte.add(bx, topY + .47, bz, .035, .09, .035, '#4a3b2e');
  // a small door
  bottleMatte.add(bx, baseY + .20, bz + .255, .12, .24, .035, '#3f2d20');
  return { x: bx, y: lightY, z: bz };
}

function buildCottage(){
  const bx = -1.94, bz = .08;
  const baseY = -.53;
  bottleMatte.add(bx, baseY + .04, bz, .70, .11, .60, '#695b4d');
  bottleMatte.add(bx, baseY + .10, bz, .60, .075, .52, '#82705e');
  const wallY = baseY + .18;
  // walls
  bottleMatte.add(bx, wallY, bz, .54, .30, .43, '#d6c7a9');
  // timber frame
  bottleMatte.add(bx-.255, wallY, bz, .045, .31, .445, '#493223');
  bottleMatte.add(bx+.255, wallY, bz, .045, .31, .445, '#493223');
  bottleMatte.add(bx, wallY, bz-.205, .54, .31, .045, '#493223');
  bottleMatte.add(bx, wallY+.13, bz, .54, .035, .44, '#493223');
  // door and windows
  bottleMatte.add(bx-.12, wallY-.07, bz+.226, .10, .19, .025, '#5c3b26');
  bottleMetal.add(bx-.12, wallY-.11, bz+.243, .014, .014, .014, '#d4a961');
  bottleGlow.add(bx+.10, wallY+.03, bz+.226, .105, .095, .025, '#ffbd68');
  bottleMatte.add(bx+.10, wallY+.085, bz+.237, .12, .022, .025, '#4e3525');
  bottleMatte.add(bx+.10, wallY+.03, bz+.237, .018, .10, .025, '#4e3525');
  bottleGlow.add(bx+.24, wallY+.01, bz+.05, .025, .10, .09, '#ffaf5c');
  // roof slopes: ridge along x
  for (let i=0;i<5;i++){
    const off = (i+1.3)*.048;
    const color = i%2 ? '#79433a' : '#8c4c41';
    bottleMatte.add(bx, wallY + .255 + i*.045, bz - off, .61 - i*.06, .045, .13, color, { rx:-.63 });
    bottleMatte.add(bx, wallY + .255 + i*.045, bz + off, .61 - i*.06, .045, .13, color, { rx:.63 });
  }
  bottleMatte.add(bx, wallY + .46, bz, .25, .05, .08, '#553d2d');
  bottleMatte.add(bx-.20, wallY + .33, bz-.02, .07, .25, .07, '#756553');
  // chimney smoke stones
  bottleMatte.add(bx-.20, wallY + .49, bz-.02, .08, .05, .08, '#4e453e');
  // little fence
  for (let i=0;i<5;i++){
    bottleMatte.add(bx+.38 + i*.055, baseY+.10, bz+.28, .018, .22, .018, '#6c5338');
  }
  bottleMatte.add(bx+.49, baseY+.16, bz+.28, .34, .018, .018, '#6c5338');
  return { x:bx, y:wallY, z:bz };
}

function buildPalm(px, py, pz, scale, leanX, leanZ, phase){
  const group = new THREE.Group();
  group.position.set(px, py, pz);
  const list = new VoxelList(matVoxel);
  const trunkColors = ['#816242','#745638','#8f6e4a','#694c31'];
  let topX = 0, topY = 0, topZ = 0;
  const steps = 9;
  for (let i=0; i<steps; i++){
    const t = i / (steps - 1);
    const y = .04 + t * 1.02 * scale;
    const x = (leanX * t * t) * scale;
    const z = (leanZ * t * t) * scale;
    list.add(x, y, z, lerp(.12,.08,t)*scale, .16*scale, lerp(.12,.08,t)*scale, trunkColors[i%4], { rz: -leanX*.12, rx: leanZ*.12 });
    topX = x; topY = y; topZ = z;
  }
  const leafColors = ['#3e6e4c','#4a7e54','#356246','#5b8b5c'];
  for (let i=0;i<8;i++){
    const a = i/8*TAU + .18;
    const length = (i%2 ? .44 : .55) * scale;
    for (let k=0;k<3;k++){
      const d=(k+1)/3;
      const lx=topX + Math.cos(a)*length*d;
      const lz=topZ + Math.sin(a)*length*d;
      const ly=topY + .13*scale - d*.16*scale - (i%3===0?.03:0);
      list.add(lx, ly, lz, length*.40, .035*scale, .07*scale, leafColors[(i+k)%4], { ry: -a, rz: .18*(1-d) });
    }
  }
  for (let i=0;i<4;i++){
    const a = i/4*TAU + .4;
    list.add(topX + Math.cos(a)*.055, topY + .025, topZ + Math.sin(a)*.055, .055*scale, .055*scale, .055*scale, '#755e38');
  }
  list.build(group);
  group.rotation.y = phase;
  bottleWorld.add(group);
  return { group, phase, baseRot: randRange(-.02,.02) };
}

function buildDock(){
  const x = -2.57;
  const zStart = .87;
  const zEnd = 1.35;
  const planks = 8;
  for (let i=0;i<planks;i++){
    const z = lerp(zStart, zEnd, i/(planks-1));
    bottleMatte.add(x, -.885 + (i%2)*.004, z, .44, .055, .075, i%2 ? '#6a4a2f' : '#5d4029', { ry: randRange(-.025,.025) });

function makeBeamFan(){

    ], 3));
    const mesh = new THREE.Mesh(geo, beamMaterial);
    mesh.frustumCulled = false;
    mesh.renderOrder = 12;
    group.add(mesh);

function createSailGeometry(width, height, bulge, segX = 12, segY = 10){
  const positions = [];
  const uvs = [];
  const indices = [];
  for (let iy=0; iy<=segY; iy++){
    for (let ix=0; ix<=segX; ix++){
      const u = ix / segX;
      const v = iy / segY;
      const x = Math.sin(u * Math.PI) * Math.sin(v * Math.PI) * bulge;
      const y = (v - .5) * height;
      const z = (u - .5) * width;
      positions.push(x, y, z);
      uvs.push(u, 1-v);
    }
  }
  for (let iy=0; iy<segY; iy++){
    for (let ix=0; ix<segX; ix++){
      const a = iy*(segX+1)+ix;
      const b = a+1;
      const c = a+segX+1;
      const d = c+1;
      indices.push(a,b,c, b,d,c);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return geo;
}

function addRopeSegment(points, sag = 0){
  // points: array of Vector3, draws a gently sagging line
  const curvePoints = [];
  for (let i=0; i<points.length-1; i++){
    const a = points[i], b = points[i+1];
    const steps = 5;
    for (let s=0; s<steps; s++){
      const t = s/steps;
      curvePoints.push(new THREE.Vector3(
        lerp(a.x,b.x,t),
        lerp(a.y,b.y,t) - Math.sin(t*Math.PI)*sag,
        lerp(a.z,b.z,t)
      ));
    }
  }
  curvePoints.push(points[points.length-1].clone());
  for (let i=0;i<curvePoints.length-1;i++){
    riggingPositions.push(curvePoints[i].x,curvePoints[i].y,curvePoints[i].z);
    riggingPositions.push(curvePoints[i+1].x,curvePoints[i+1].y,curvePoints[i+1].z);
  }
}

      mast.x-.03, mast.top-.16, 0
    ], 3));

    const f = new THREE.Mesh(g, flagMat);

  const mastTops = [new THREE.Vector3(.47,2.12,0), new THREE.Vector3(.06,2.36,0), new THREE.Vector3(-.55,1.88,0)];
  const bow = new THREE.Vector3(1.56,.46,0);

  for (const mt of mastTops){
    addRopeSegment([mt, bow], .12);
    addRopeSegment([mt, stern], .10);

  addRopeSegment([mastTops[0], mastTops[1]], .04);
  addRopeSegment([mastTops[1], mastTops[2]], .04);
  for (const mt of mastTops){

  // yard lifts
  for (const s of sailSet){

  }

  // a single line geometry for all rigging
  const rigGeo = new THREE.BufferGeometry();
  rigGeo.setAttribute('position', new THREE.Float32BufferAttribute(riggingPositions, 3));

}

const shipRoute = { angle: 2.15, angularSpeed: .185, rx: 1.74, rz: 1.98 };
const shipState = { pos: new THREE.Vector3(), yaw: 0, pitch: 0, roll: 0, speed: 0 };

function updateShip(time, dt, storm){
  clickFx.ship = Math.max(0, clickFx.ship - dt);
  const boost = clickFx.ship > 0 ? Math.sin((1 - clickFx.ship / 2.4) * Math.PI) : 0;
  const route = shipRoute;
  route.angle += dt * route.angularSpeed * (1 + storm * .18 + boost * 1.05);
  const a = route.angle;
  const x = ISLAND_X + route.rx * Math.cos(a);
  const z = ISLAND_Z + route.rz * Math.sin(a);
  const dx = -route.rx * Math.sin(a);
  const dz = route.rz * Math.cos(a);
  const yaw = Math.atan2(-dz, dx);
  const fx = Math.cos(yaw), fz = -Math.sin(yaw);
  const rx = Math.sin(yaw), rz = Math.cos(yaw);

  const hBow = waveHeight(x + fx*.79, z + fz*.79, time, storm);
  const hStern = waveHeight(x - fx*.74, z - fz*.74, time, storm);
  const hRight = waveHeight(x + rx*.31, z + rz*.31, time, storm);
  const hLeft = waveHeight(x - rx*.31, z - rz*.31, time, storm);
  const hMid = waveHeight(x, z, time, storm);
  const avg = (hBow+hStern+hRight+hLeft+hMid) / 5;

  shipRoot.position.set(x, WATER_LEVEL + avg + .035, z);
  shipRoot.rotation.y = yaw;
  shipTilt.rotation.z = lerp(shipTilt.rotation.z, Math.atan2(hBow - hStern, 1.53) * .92, Math.min(1, dt*5.2));
  shipTilt.rotation.x = lerp(shipTilt.rotation.x, Math.atan2(hLeft - hRight, .62) * .82, Math.min(1, dt*5.2));
  shipTilt.rotation.z += Math.sin(time*6.4) * .05 * boost + Math.sin(time*3.1) * .018 * boost;
  shipTilt.position.y = Math.sin(time*1.1)*.003*(1+storm*2) + Math.abs(Math.sin(time*5.2)) * .012 * boost;
  shipState.pos.set(x, WATER_LEVEL + avg, z);
  shipState.yaw = yaw;
  shipState.pitch = shipTilt.rotation.z;
  shipState.roll = shipTilt.rotation.x;
  shipState.speed = route.angularSpeed * Math.sqrt(Math.pow(route.rx*Math.sin(a),2) + Math.pow(route.rz*Math.cos(a),2));

  // lantern breathing with the night (updated in light loop as well)
  if (shipModel.userData.lanternGlow){
    shipModel.userData.lanternGlow.material.opacity = .24 + nightFactor * .3 + Math.sin(time*3.1)*.025;
  }
  shipLanternLight.position.set(-.86, .48, 0);
}

const whaleState = { jumpP: -1, lastJumpSide: 0, nextX: .4, nextZ: .8 };

function updateWhale(time, storm, dt){
  if (clickFx.whale > 0){
    clickFx.whale = Math.max(0, clickFx.whale - dt);
    const p = 1 - clickFx.whale / 1.6;
    const y = -1.42 + Math.sin(p * Math.PI) * 2.3;
    whale.position.set(-1.34 + p * 1.06, y, 1.38 + Math.sin(p*Math.PI)*.1);
    whale.rotation.set(0, -.12 + p*.24, Math.cos(p*Math.PI)*.74);
    whaleSplash.material.opacity = Math.sin(p*Math.PI)*.4;
    whaleSplash.scale.set(.64 + Math.sin(p*Math.PI)*.22, .64 + Math.sin(p*Math.PI)*.22, 1);
    whaleState.jumpP = p;
    return;
  }
  const cycle = 19.5 - storm * 5.5;
  const u = ((time * (1 + storm*.12) + 4.5) % cycle) / cycle;
  const jumpStart = .56, jumpEnd = .83;
  if (u > jumpStart && u < jumpEnd){
    const p = (u - jumpStart) / (jumpEnd - jumpStart);
    whaleState.jumpP = p;
    const y = -1.42 + Math.sin(p * Math.PI) * 2.12;
    whale.position.set(-1.34 + p * 1.06, y, 1.38 + Math.sin(p*Math.PI)*.08);
    whale.rotation.set(0, -.12 + p*.24, Math.cos(p*Math.PI)*.74);
    whaleSplash.material.opacity = Math.sin(p*Math.PI)*.32;
    whaleSplash.scale.set(.62 + Math.sin(p*Math.PI)*.2,.62 + Math.sin(p*Math.PI)*.2,1);
    if (Math.abs(p - .05) < .035 || Math.abs(p - .95) < .035){
      if (whaleState.lastJumpSide !== Math.round(p)){
        whaleState.lastJumpSide = Math.round(p);
        emitSprayBurst(whale.position.x, whale.position.z, .38, 20, true);
      }
    }
  } else {
    if (whaleState.jumpP !== -1){
      if (whaleState.jumpP > .5) emitSprayBurst(whale.position.x, whale.position.z, .42, 28, true);
      whaleState.jumpP = -1;
      whaleState.lastJumpSide = 0;
    }
    const glide = Math.sin(time * .35);
    whale.position.set(-.78 + glide*.36, -1.73 + Math.sin(time*.7)*.04, 1.56);
    whale.rotation.set(.03, -.26 + glide*.15, .025);
    whaleSplash.material.opacity = 0;
  }
}

function buildGull(index){
  const root = new THREE.Group();
  const bodyList = new VoxelList(matGull);
  bodyList.add(0,0,0,.22,.065,.08,'#f1eadb');
  bodyList.add(.12, .015, 0, .11,.065,.08,'#f5efe3');
  bodyList.add(.18, .012, 0, .055,.045,.055,'#ece4d3');
  bodyList.add(.225, .006, 0, .055,.022,.022,'#c79345');
  bodyList.add(-.12, .005, 0, .12,.035,.07,'#d6d6d0');
  bodyList.add(-.19, .01, 0, .08,.025,.06,'#ece7dc');
  for (const side of [-1,1]){
    bodyList.add(-.02, -.012, side*.038, .08,.035,.025,'#c4c8c5');
    bodyList.add(.07, .01, side*.036, .025,.025,.025,'#2e2924');
  }
  bodyList.build(root);

  const wingPivotL = new THREE.Group();
  const wingPivotR = new THREE.Group();
  wingPivotL.position.set(-.01,.015,.038);
  wingPivotR.position.set(-.01,.015,-.038);
  const wingListL = new VoxelList(matGull);
  const wingListR = new VoxelList(matGull);
  // both wings are modelled on +Z; the right pivot is turned to face -Z.
  // the outer segments sweep back and droop to read as a gull, not a cross.
  for (const list of [wingListL, wingListR]){
    list.add(.015, 0, .105, .115,.03,.17,'#f5f0e6');
    list.add(-.025, -.012, .255, .078,.025,.14,'#e8e4da');
    list.add(-.075, -.035, .355, .045,.018,.075,'#aeb7b5');
  }
  wingListL.build(wingPivotL);
  wingListR.build(wingPivotR);
  wingPivotR.rotation.y = Math.PI;
  root.add(wingPivotL, wingPivotR);
  root.scale.setScalar(1.22);
  gullGroup.add(root);

  const gull = {
    root, bodyList, wingPivotL, wingPivotR,
    radiusX: randRange(1.05, 1.62),
    radiusZ: randRange(.72, 1.18),
    phase: index * (TAU/6) + randRange(-.3,.3),
    speed: randRange(.22, .34) * (index % 2 ? 1 : -1),
    height: randRange(1.82, 1.99),
    bob: randRange(.02,.07),
    flap: randRange(5.2, 7.2),
    drift: randRange(-.11,.11)
  };
  gulls.push(gull);
}
for (let i=0;i<6;i++) buildGull(i);

function updateGulls(time, storm, dt = 0){
  for (let i=0;i<gulls.length;i++){
    const g = gulls[i];
    if (g.startle > 0) g.startle = Math.max(0, g.startle - dt);
    const a = g.phase + time * g.speed * (1 + storm*.35);
    const x = -2.23 + Math.cos(a) * g.radiusX;
    const z = ISLAND_Z + Math.sin(a) * g.radiusZ + g.drift * Math.sin(time*.4+i);
    let y = g.height + Math.sin(time*.9 + i)*g.bob + storm*.035*Math.sin(i);
    if (g.startle > 0){
      const k = 1 - g.startle / 1.2;
      y += Math.sin(k * Math.PI) * .34;
    }
    g.root.position.set(x,y,z);
    const dx = -Math.sin(a) * Math.sign(g.speed);
    const dz = Math.cos(a) * Math.sign(g.speed);
    g.root.rotation.order = 'YXZ';
    g.root.rotation.y = Math.atan2(-dz, dx);
    g.root.rotation.x = Math.cos(time*.8+i)*.055 - storm*.035;
    g.root.rotation.z = Math.sin(time*1.2+i)*.018;
    // mirrored wing pivots need opposite X rotation, otherwise the pair
    // behaves like one see-sawing plane instead of two flapping wings
    const flap = Math.sin(time * g.flap + i * 1.7) * .76 + .07 + storm*.14
      + (g.startle > 0 ? Math.sin(time * 22 + i) * .3 * (g.startle / 1.2) : 0);
    g.wingPivotL.rotation.x = flap;
    g.wingPivotR.rotation.x = -flap;
    g.wingPivotR.rotation.y = Math.PI;
  }
}

    uniform float uPixelRatio;

      float h = sin(p.x * 2.35 + t * 1.05) * .043
              + sin(p.y * 3.05 - t * 1.40 + p.x * .55) * .030
              + sin((p.x + p.y) * 4.60 + t * 2.05) * .015;

    );

let wakeEmitAccumulator = 0;
let bowEmitAccumulator = 0;
function updateWakeParticles(dt, time, storm){
  const fx = Math.cos(shipState.yaw);
  const fz = -Math.sin(shipState.yaw);
  const sx = Math.sin(shipState.yaw);
  const sz = Math.cos(shipState.yaw);
  const sternX = shipState.pos.x - fx*.79;
  const sternZ = shipState.pos.z - fz*.79;
  const bowX = shipState.pos.x + fx*.82;
  const bowZ = shipState.pos.z + fz*.82;

  wakeEmitAccumulator += dt * (13 + storm*34);
  while (wakeEmitAccumulator > 1){
    wakeEmitAccumulator -= 1;
    const side = randRange(-.22,.22);
    const x = sternX + sx*side;
    const z = sternZ + sz*side;
    const sy = WATER_LEVEL + waveHeight(x,z,time,storm) + .012;
    spawnWakeParticle(
      x, sy, z,
      -fx*randRange(.04,.14) + sx*randRange(-.045,.045),
      .015,
      -fz*randRange(.04,.14) + sz*randRange(-.045,.045),
      randRange(1.2,2.2), randRange(.04,.095), 0
    );
  }

  bowEmitAccumulator += dt * (storm > .05 ? 22 + storm*58 : 3.2);
  while (bowEmitAccumulator > 1){
    bowEmitAccumulator -= 1;
    const side = randRange(-.18,.18);
    const x = bowX + sx*side;
    const z = bowZ + sz*side;
    const sy = WATER_LEVEL + waveHeight(x,z,time,storm) + .03;
    spawnWakeParticle(
      x, sy, z,
      fx*randRange(.02,.16) + sx*randRange(-.18,.18),
      randRange(.12,.42) + storm*randRange(.2,.9),
      fz*randRange(.02,.16) + sz*randRange(-.18,.18),
      randRange(.42,1.05), randRange(.025,.085), 1
    );
  }

  for (let i=0;i<wakePoolCount;i++){
    const p = wakeParticles[i];
    if (p.life <= 0){
      wakeAlpha[i] = 0;
      wakeSizes[i] = 0;
      continue;
    }
    p.life -= dt;
    if (p.kind === 1){
      p.x += p.vx*dt;
      p.y += p.vy*dt;
      p.z += p.vz*dt;
      p.vy -= 1.05*dt;
      p.vx *= .985;
      p.vz *= .985;
      const surface = WATER_LEVEL + waveHeight(p.x,p.z,time,storm);
      if (p.y <= surface){
        p.y = surface + .005;
        p.kind = 0;
        p.vy = 0;
        p.vx *= .6;
        p.vz *= .6;
      }
    } else {
      p.x += p.vx*dt;
      p.z += p.vz*dt;
      p.y = WATER_LEVEL + waveHeight(p.x,p.z,time,storm) + .012;
      p.vx *= .982;
      p.vz *= .982;
    }
    if (waterPlanSd(p.x,p.z) > -.03) p.life = 0;
    if (p.y > .92) p.life = Math.min(p.life, .08);
    const k = clamp(p.life / Math.max(.001,p.maxLife), 0, 1);
    p.alpha = k > .72 ? (1-k)/.28 : Math.min(1, k*1.9);
    wakeAlpha[i] = p.alpha * (p.kind === 1 ? .7 : .58);
    wakeSizes[i] = p.size * (0.55 + (1-k)*0.65);
    wakePositions[i*3] = p.x;
    wakePositions[i*3+1] = p.y;
    wakePositions[i*3+2] = p.z;
  }
  wakeGeo.attributes.position.needsUpdate = true;
  wakeGeo.attributes.aSize.needsUpdate = true;
  wakeGeo.attributes.aAlpha.needsUpdate = true;
}

function buildLightningBolt(index){
  let x = -3.35 + index * .78 + randRange(-.18,.18);
  let y = 2.54;
  let z = .58 + index * .10 + randRange(-.06,.06);
  const main = [new THREE.Vector3(x, y, z)];
  const branches = [];
  let branchStart = null;
  for (let i=0;i<11;i++){
    const nx = x + randRange(-.16,.16);
    const ny = y - randRange(.15,.24);
    const nz = z + randRange(-.05,.05);
    if (Math.hypot(ny,nz) > 2.76 || ny < .36) break;
    x = nx; y = ny; z = nz;
    main.push(new THREE.Vector3(x,y,z));
    if ((i===4 || i===7) && x > -4.3){
      let bx=x, by=y, bz=z;
      const path = [new THREE.Vector3(bx,by,bz)];
      for (let b=0;b<3;b++){
        bx += randRange(-.2,.2);
        by -= randRange(.1,.18);
        bz += randRange(-.04,.04);
        path.push(new THREE.Vector3(bx,by,bz));
      }
      branches.push(path);
    }
  }

  const group = new THREE.Group();
  const coreMat = new THREE.MeshBasicMaterial({
    color: 0xeaf5ff, transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false
  });
  const glowMat = new THREE.MeshBasicMaterial({
    color: 0x94bcff, transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false
  });
  const paths = [main, ...branches];
  for (const path of paths){
    if (path.length < 2) continue;
    const curve = new THREE.CatmullRomCurve3(path, false, 'centripetal');
    const core = new THREE.Mesh(new THREE.TubeGeometry(curve, 28, .016, 4, false), coreMat);
    const glow = new THREE.Mesh(new THREE.TubeGeometry(curve, 28, .062, 5, false), glowMat);
    core.renderOrder = 10;
    glow.renderOrder = 9;
    core.frustumCulled = false;
    glow.frustumCulled = false;
    group.add(glow, core);
  }
  group.frustumCulled = false;
  group.visible = false;
  group.userData.coreMat = coreMat;
  group.userData.glowMat = glowMat;
  group.userData.isBolt = true;
  lightningGroup.add(group);
  lightningBolts.push(group);
}
for (let i=0;i<3;i++) buildLightningBolt(i);

let lightningCountdown = 1.35;
let lightningFlash = 0;
let activeBolt = null;

function strikeLightning(){
  activeBolt = lightningBolts[Math.floor(Math.random()*lightningBolts.length)];
  lightningFlash = 1;
  Sound.thunder();
  if (activeBolt) activeBolt.rotation.y = randRange(-.2,.2);
}

function updateLightning(dt, storm){
  if (storm > .38){
    lightningCountdown -= dt * (0.7 + storm);
    if (lightningCountdown <= 0){
      lightningCountdown = randRange(1.7, 3.8);
      strikeLightning();
    }
  } else {
    lightningCountdown = Math.min(lightningCountdown, 2.0);
  }
  if (lightningFlash > 0){
    lightningFlash = Math.max(0, lightningFlash - dt * (2.0 + Math.random()*1.6));
  }
  for (const b of lightningBolts){
    const on = b === activeBolt && lightningFlash > .005;
    b.visible = on;
    if (on){
      b.userData.coreMat.opacity = lightningFlash;
      b.userData.glowMat.opacity = lightningFlash * .32;
    }
  }
  flashLight.intensity = lightningFlash * .34;
  flashEl.style.opacity = (lightningFlash * .016).toFixed(3);
  skyUniforms.uFlash.value = lightningFlash * .11;
}

const activePalette = {
  top:new THREE.Color(), horizon:new THREE.Color(), low:new THREE.Color(),
  sun:new THREE.Color(), key:new THREE.Color(),
  hemiSky:new THREE.Color(), hemiGround:new THREE.Color(),
  keyIntensity:1, hemiIntensity:1, ambient:1, fill:1, rim:1, exposure:1
};
const roomBaseLow = new THREE.Color('#050404');
const tempVec3 = new THREE.Vector3();
const tempColor = new THREE.Color();

function samplePalette(t){
  let i = 0;
  while (i < dayKeys.length - 2 && t >= dayKeys[i+1].at) i++;
  const a = dayKeys[i], b = dayKeys[i+1];
  const raw = clamp((t - a.at) / (b.at - a.at), 0, 1);
  const f = raw * raw * (3 - 2 * raw);
  activePalette.top.copy(a.top).lerp(b.top, f);
  activePalette.horizon.copy(a.horizon).lerp(b.horizon, f);
  activePalette.low.copy(a.low).lerp(b.low, f);
  activePalette.sun.copy(a.sun).lerp(b.sun, f);
  activePalette.key.copy(a.key).lerp(b.key, f);
  activePalette.hemiSky.copy(a.hemiSky).lerp(b.hemiSky, f);
  activePalette.hemiGround.copy(a.hemiGround).lerp(b.hemiGround, f);
  activePalette.keyIntensity = lerp(a.keyIntensity,b.keyIntensity,f);
  activePalette.hemiIntensity = lerp(a.hemiIntensity,b.hemiIntensity,f);
  activePalette.ambient = lerp(a.ambient,b.ambient,f);
  activePalette.fill = lerp(a.fill,b.fill,f);
  activePalette.rim = lerp(a.rim,b.rim,f);
  activePalette.exposure = lerp(a.exposure,b.exposure,f);
}

const day = { t: .47, speed: 4, paused: false };
let nightFactor = .5;
let stormTarget = 0;
let stormVisual = 0;
let timeNow = 0;
let lightningFlicker = 0;

function setStorm(active){
  stormTarget = active ? 1 : 0;
  document.body.classList.toggle('is-storm', active);
  const label = document.getElementById('stormLabel');
  if (label) label.textContent = active ? '风暴之中' : '召来风暴';
  const btn = document.getElementById('stormBtn');
  if (btn) btn.setAttribute('aria-pressed', active ? 'true' : 'false');
}

const celestial = {
  sunP: 0, moonP: 0, sunVisible: 0, moonVisible: 0
};

function updateCelestialAndLight(time){
  samplePalette(day.t);
  nightFactor = clamp((1 - Math.cos((day.t - .25) * TAU)) * .5, 0, 1);
  const storm = stormVisual;

  const sunP = clamp(day.t / .5, 0, 1);
  const sunY = -.34 + Math.sin(sunP * Math.PI) * 2.78;
  const sunX = -4.04 + sunP * 3.92;
  const sunEdge = smoothstep(sunP, 0, .045) * smoothstep(1 - sunP, 0, .045);
  const sunAlt = smoothstep(sunY, -.02, .23);
  const sunVisible = day.t <= .5 ? sunEdge * sunAlt : 0;
  sunSprite.position.set(sunX, sunY, -.55);
  sunSprite.material.opacity = sunVisible * (1 - storm * .62);
  sunSprite.material.color.copy(activePalette.sun);
  sunSprite.visible = sunSprite.material.opacity > .001;
  celestial.sunVisible = sunVisible;

  const moonP = clamp((day.t - .5) / .5, 0, 1);
  const moonY = -.34 + Math.sin(moonP * Math.PI) * 2.75;
  const moonX = -.12 - moonP * 3.92;
  const moonEdge = smoothstep(moonP, 0, .045) * smoothstep(1 - moonP, 0, .045);
  const moonAlt = smoothstep(moonY, -.02, .2);
  const moonVisible = day.t >= .5 ? moonEdge * moonAlt : 0;
  moonSprite.position.set(moonX, moonY, -.60);
  moonSprite.material.opacity = moonVisible * (1 - storm * .58);
  moonSprite.visible = moonSprite.material.opacity > .001;
  celestial.moonVisible = moonVisible;

  tempVec3.copy(sunSprite.position).normalize();
  skyUniforms.uSunPos.value.copy(tempVec3);
  skyUniforms.uSunColor.value.copy(activePalette.sun);
  skyUniforms.uSunStrength.value = sunVisible * (.72 + (1-nightFactor)*.2) * (1-storm*.4);
  tempVec3.copy(moonSprite.position).normalize();
  skyUniforms.uMoonPos.value.copy(tempVec3);
  skyUniforms.uMoonStrength.value = moonVisible * (.38 + nightFactor*.28) * (1-storm*.4);
  skyUniforms.uTop.value.copy(activePalette.top);
  skyUniforms.uHorizon.value.copy(activePalette.horizon);
  skyUniforms.uLow.value.copy(activePalette.low);
  skyUniforms.uNight.value = nightFactor;
  skyUniforms.uStorm.value = storm;

  // Room light follows the miniature sky, but remains a warm, sheltered interior.
  roomUniforms.uTop.value.copy(activePalette.top).multiplyScalar(.16).add(tempColor.set(0x080506));
  roomUniforms.uHorizon.value.copy(activePalette.horizon).multiplyScalar(.2).add(tempColor.set(0x0b0705).multiplyScalar(.55));
  roomUniforms.uLow.value.copy(roomBaseLow);

  hemiLight.color.copy(activePalette.hemiSky);
  hemiLight.groundColor.copy(activePalette.hemiGround);
  hemiLight.intensity = activePalette.hemiIntensity * (1 - storm * .35);
  ambientLight.color.copy(activePalette.hemiSky).lerp(activePalette.key, .35);
  ambientLight.intensity = activePalette.ambient * (1 - storm * .28);
  keyLight.color.copy(activePalette.key);
  keyLight.intensity = activePalette.keyIntensity * (1 - storm * .58);
  fillLight.color.copy(activePalette.hemiSky).lerp(new THREE.Color('#709bca'), .4);
  fillLight.intensity = activePalette.fill * (1 - storm * .42);
  rimLight.color.copy(activePalette.horizon);
  rimLight.intensity = activePalette.rim * (1 - storm * .5);

  const activeOrb = sunVisible > .02 ? sunSprite : moonSprite;
  keyLight.position.set(
    activeOrb.position.x * 1.35,
    BOTTLE_Y + Math.max(1.5, activeOrb.position.y * 1.7) + 2.4,
    activeOrb.position.z * 2.4 - 2.0
  );
  keyLight.target.position.set(0, 2.8, 0);

  tableLampLight.intensity = (72 + Math.sin(time*13.1)*2.4 + Math.sin(time*7.3)*1.8) * (1 - storm*.12);
  bottleAuraLight.intensity = (11 + nightFactor*9 + Math.sin(time*4.2)*.8) * (1 - storm*.16);
  lighthouseLight.intensity = (3.5 + nightFactor*10.5 + storm*1.8);
  cottageLight.intensity = (1.6 + nightFactor*5.8);
  treasureLight.intensity = (2.4 + nightFactor*4.8 + Math.sin(time*2.2)*.6);
  shipLanternLight.intensity = (.55 + nightFactor*1.7);
  lagoonLight.intensity = (1 + nightFactor*1.4) * (1 - storm*.24);
  beamUniforms.uOpacity.value = .025 + nightFactor*.16 + storm*.018;
  beamSprite.material.opacity = .1 + nightFactor*.34;
  matGlow.opacity = .83 + nightFactor*.14;

  for (const item of interiorGlowSprites){
    const flicker = .95 + Math.sin(time*8.3 + item.sprite.position.x) * .05;
    item.sprite.material.opacity = item.baseOpacity * (.85 + nightFactor * 1.05) * flicker * (1 - storm*.14);
  }
  chestGlowSprite.material.opacity = (.22 + nightFactor*.32 + Math.sin(time*2.7)*.03) * (1-storm*.2);

  const cloudLight = .52 + (1-nightFactor)*.48;
  matCloud.color.setRGB(
    cloudLight * (1 - storm*.34),
    cloudLight * .965 * (1 - storm*.34),
    cloudLight * .94 * (1 - storm*.3)
  );
  matCloudDark.opacity = smoothstep(storm, .04, .6) * .82;

  starUniforms.uOpacity.value = smoothstep(nightFactor, .58, .94) * (1 - storm*.16);
  starUniforms.uTime.value = time;

  waterUniforms.uTime.value = time;
  waterUniforms.uStorm.value = storm;
  waterUniforms.uNight.value = nightFactor;
  waterUniforms.uSkyTop.value.copy(activePalette.top);
  waterUniforms.uSkyHorizon.value.copy(activePalette.horizon);
  waterUniforms.uSunColor.value.copy(activePalette.sun);
  waterUniforms.uSunDir.value.copy(activeOrb.position).normalize();
  volumeUniforms.uTime.value = time;
  volumeUniforms.uStorm.value = storm;
  volumeUniforms.uNight.value = nightFactor;

  bubbleUniforms.uTime.value = time;
  bubbleUniforms.uStorm.value = storm;
  crestUniforms.uTime.value = time;
  crestUniforms.uStorm.value = storm;

  glassUniforms.uStorm.value = storm;
  glassUniforms.uKeyColor.value.copy(activePalette.key);
  glassUniforms.uSkyColor.value.copy(activePalette.horizon).lerp(activePalette.top,.45);
  glassUniforms.uGlow.value.copy(activePalette.sun);

  renderer.toneMappingExposure = activePalette.exposure;
}

function updateClouds(time, dt, storm){
  for (const c of clouds){
    const drift = (1 + storm*1.7);
    c.group.position.x = c.spec.x + Math.sin(time*.042*drift + c.phase) * c.spec.drift * drift;
    c.group.position.z = c.spec.z + Math.cos(time*.033*drift + c.phase*1.4) * c.spec.drift * .55;
    c.group.position.y = c.spec.y + Math.sin(time*.13 + c.phase)*.012;
  }
  stormCloudGroup.visible = matCloudDark.opacity > .004;
  if (stormCloudGroup.visible){
    stormCloudGroup.position.x = Math.sin(time*.11)*.11*storm;
    stormCloudGroup.position.y = Math.sin(time*.17+1.2)*.025*storm;
  }
}

function updateCrabs(time, dt){
  for (const crab of crabs){
    if (crab.startle > 0) crab.startle = Math.max(0, crab.startle - dt);
    const walk = time*.26 + crab.phase;
    const excited = crab.startle > 0 ? crab.startle / 1.1 : 0;
    crab.group.position.x = crab.x + Math.sin(walk) * .14 + Math.sin(time*17 + crab.phase) * .045 * excited;
    crab.group.position.z = crab.z + Math.cos(walk*.7) * .055;
    crab.group.position.y = crab.baseY + Math.abs(Math.sin(time*7.5 + crab.phase)) * .008
      + Math.abs(Math.sin(time*19 + crab.phase)) * .06 * excited;
    crab.group.rotation.y = Math.sin(walk) * .5 + Math.sin(time*13 + crab.phase) * .4 * excited;
  }
}

function updateRowboat(time, dt, storm){
  clickFx.rowboat = Math.max(0, clickFx.rowboat - dt);
  const pulse = clickFx.rowboat > 0 ? clickFx.rowboat / 1.4 : 0;
  const h = waveHeight(-1.98, 1.37, time, storm);
  rowboat.position.y = WATER_LEVEL + h + .075 + Math.abs(Math.sin(time*8.2)) * .05 * pulse;
  rowboat.rotation.z = Math.sin(time*1.15)*.035 + Math.sin(time*.62)*.02 + storm*.05*Math.sin(time*3.1)
    + Math.sin(time*8.4) * .16 * pulse;
  rowboat.rotation.x = Math.cos(time*.9)*.028 + storm*.04*Math.cos(time*2.7) + Math.sin(time*7.1) * .09 * pulse;
  rowboatGlow.material.opacity = .1 + nightFactor*.25 + pulse*.12;
}

function updateBuoy(time, dt, storm){
  clickFx.buoy = Math.max(0, clickFx.buoy - dt);
  const pulse = clickFx.buoy > 0 ? clickFx.buoy / 1.6 : 0;
  const h = waveHeight(-4.38, -1.94, time, storm);
  buoy.position.y = WATER_LEVEL + h + .035 + Math.abs(Math.sin(time*6.8)) * .03 * pulse;
  const slope = waveHeight(-4.38+.1, -1.94, time, storm) - h;
  buoy.rotation.z = slope * 2.4 + Math.sin(time*.9)*.03 + Math.sin(time*5.6) * .12 * pulse;
  buoy.rotation.x = Math.sin(time*.7+1)*.04 + storm*.06*Math.sin(time*2.1);
  buoy.rotation.y = Math.sin(time*2.4) * .7 * pulse;
  buoyGlow.material.opacity = .12 + nightFactor*.32 + pulse*.3;
}

function updatePalms(time){
  const palms = [palmA, palmB, palmC];
  for (let i=0;i<palms.length;i++){
    const p = palms[i];
    p.group.rotation.z = p.baseRot + Math.sin(time*.48 + i*1.7) * (.017 + stormVisual*.022);
    p.group.rotation.x = Math.cos(time*.38 + i*1.3) * .008;
  }
}

function updateBottleShake(time, storm){
  const amp = storm * storm;
  glassRig.rotation.z = Math.sin(time*7.1) * .052 * amp + Math.sin(time*2.2) * .012 * amp;
  glassRig.rotation.x = Math.sin(time*8.7 + 1.1) * .028 * amp;
  glassRig.position.x = Math.sin(time*6.8) * .05 * amp;
  glassRig.position.y = BOTTLE_Y + Math.abs(Math.sin(time*8.2)) * .026 * amp;
}

let beamAngle = 0;
function updateBeam(time, dt){
  clickFx.beam = Math.max(0, clickFx.beam - dt);
  const boost = clickFx.beam > 0 ? clickFx.beam / 3.2 : 0;
  beamAngle += dt * (.46 + boost * 2.8);

function updateClickProps(time, dt){

  corkGroup.rotation.z = corkP * .7;

  treasureLight.intensity += chestP * 4.5 + Math.sin(time*18) * .4 * chestP;
  beamSprite.scale.set(.38 * (1 + clickFx.beam / 3.2 * .5), .38 * (1 + clickFx.beam / 3.2 * .5), 1);
}

const phaseEl = document.getElementById('phase');
const clockEl = document.getElementById('clock');
const dayMarkerEl = document.getElementById('dayMarker');
const speedLabelEl = document.getElementById('speedLabel');
const speedButtons = [...document.querySelectorAll('.speed-btn[data-speed]')];
const pauseBtn = document.getElementById('pauseBtn');
const stormBtn = document.getElementById('stormBtn');
let lastHud = 0;

function phaseForHour(hour){
  if (hour >= 5 && hour < 9) return '黎明';
  if (hour >= 9 && hour < 16) return '正午';
  if (hour >= 16 && hour < 20) return '黄昏';
  return '子夜';
}
function updateHUD(force = false){
  const now = performance.now();
  if (!force && now - lastHud < 120) return;
  lastHud = now;
  const hourFloat = (6 + day.t * 24) % 24;
  const hh = Math.floor(hourFloat).toString().padStart(2,'0');
  const mm = Math.floor((hourFloat % 1) * 60).toString().padStart(2,'0');
  const phase = phaseForHour(hourFloat);
  phaseEl.textContent = phase;
  clockEl.textContent = `${hh}:${mm}`;
  dayMarkerEl.style.left = `${(day.t*100).toFixed(2)}%`;
  speedLabelEl.textContent = day.paused ? '时流暂停 · 星潮停驻' : `延时 ×${day.speed} · 潮汐时流`;
  speedButtons.forEach(b => {
    const active = !day.paused && Number(b.dataset.speed) === day.speed;
    b.classList.toggle('active', active);
    b.setAttribute('aria-pressed', active ? 'true' : 'false');
  });
  pauseBtn.classList.toggle('active', day.paused);
  pauseBtn.innerHTML = day.paused ? '▶' : '❚❚';
  pauseBtn.setAttribute('aria-label', day.paused ? '继续时间' : '暂停时间');
}
function setSpeed(speed){
  day.speed = speed;
  day.paused = false;
  updateHUD(true);
}
speedButtons.forEach(btn => btn.addEventListener('click', () => setSpeed(Number(btn.dataset.speed))));
pauseBtn.addEventListener('click', () => {
  day.paused = !day.paused;
  updateHUD(true);
});

function startStorm(){
  setStorm(true);
}
function stopStorm(){
  setStorm(false);
}
stormBtn.addEventListener('pointerdown', (e)=>{
  e.preventDefault();
  stormBtn.setPointerCapture?.(e.pointerId);
  startStorm();
});
stormBtn.addEventListener('pointerup', (e)=>{
  e.preventDefault();
  stopStorm();
});
stormBtn.addEventListener('pointercancel', stopStorm);
window.addEventListener('pointerup', stopStorm);
stormBtn.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('keydown', (e)=>{
  if (e.target.closest?.('button, a')) return;
  if (e.code === 'Space' && !e.repeat){
    e.preventDefault();
    startStorm();
  }
});
window.addEventListener('keyup', (e)=>{
  if (e.code === 'Space'){
    e.preventDefault();
    stopStorm();
  }
});
window.addEventListener('blur', stopStorm);
document.addEventListener('visibilitychange', ()=>{
  if (document.hidden) stopStorm();
});
