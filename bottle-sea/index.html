const Sound = (() => {
  const AC = window.AudioContext || window.webkitAudioContext;
  const button = document.getElementById('audioBtn');
  const icon = button ? button.querySelector('.sound-icon') : null;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const BEAT = 1;
  const chordLen = BEAT * 4;
  const melodyBeats = [0, .9, 1.9, 2.9, 3.6];
  const chords = [
    { notes: [45, 48, 52], root: 33, melody: [69, 72, 76, 74, 72] },
    { notes: [41, 45, 48], root: 29, melody: [65, 69, 72, 76, 74] },
    { notes: [48, 52, 55], root: 36, melody: [72, 76, 79, 76, 74] },
    { notes: [43, 47, 50], root: 31, melody: [67, 71, 74, 79, 77] },
    { notes: [45, 48, 52], root: 33, melody: [69, 72, 76, 79, 76] },
    { notes: [38, 41, 45], root: 38, melody: [62, 65, 69, 74, 72] },
    { notes: [41, 45, 48], root: 29, melody: [65, 69, 72, 77, 76] },
    { notes: [40, 44, 47], root: 40, melody: [64, 68, 71, 76, 74] }
  ];

  let ctx = null, master = null, musicBus = null, sfxBus = null, analyser = null;
  let seaGain = null, seaFilter = null, windGain = null, noiseBuf = null;
  let started = false, on = false, ticker = 0, suspendTimer = 0;
  let nextChordAt = 0, chordIndex = 0, nextGullAt = 0, nextFogAt = 0;
  let stormLevel = 0, lastMix = 0, lastThunder = 0;

  function makeNoise(seconds = 5){
    const len = Math.floor(ctx.sampleRate * seconds);
    const buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++){
      const data = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    }
    return buf;
  }

  function makeImpulse(seconds, decay){
    const len = Math.floor(ctx.sampleRate * seconds);
    const buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++){
      const data = buf.getChannelData(ch);
      for (let i = 0; i < len; i++){
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
      }
    }
    return buf;
  }

  function build(){
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -18;
    comp.knee.value = 20;
    comp.ratio.value = 3.2;
    comp.attack.value = .008;
    comp.release.value = .35;
    master.connect(comp);
    comp.connect(ctx.destination);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 512;
    comp.connect(analyser);

    const rvIn = ctx.createBiquadFilter();
    rvIn.type = 'lowpass';
    rvIn.frequency.value = 2800;
    const reverb = ctx.createConvolver();
    reverb.buffer = makeImpulse(2.2, 2.1);
    const rvOut = ctx.createGain();
    rvOut.gain.value = .42;
    rvIn.connect(reverb);
    reverb.connect(rvOut);
    rvOut.connect(master);

    musicBus = ctx.createGain();
    musicBus.gain.value = .8;
    musicBus.connect(master);
    const musicWet = ctx.createGain();
    musicWet.gain.value = .42;
    musicBus.connect(musicWet);
    musicWet.connect(rvIn);

    sfxBus = ctx.createGain();
    sfxBus.gain.value = .9;
    sfxBus.connect(master);
    const sfxWet = ctx.createGain();
    sfxWet.gain.value = .3;
    sfxBus.connect(sfxWet);
    sfxWet.connect(rvIn);

    noiseBuf = makeNoise(5);

    seaGain = ctx.createGain();
    seaGain.gain.value = .045;
    seaGain.connect(master);
    seaFilter = ctx.createBiquadFilter();
    seaFilter.type = 'lowpass';
    seaFilter.frequency.value = 720;
    seaFilter.Q.value = .5;
    const seaA = ctx.createBufferSource();
    seaA.buffer = noiseBuf;
    seaA.loop = true;
    const seaPanA = ctx.createStereoPanner();
    seaPanA.pan.value = -.2;
    seaA.connect(seaFilter);
    seaFilter.connect(seaGain);
    seaGain.connect(seaPanA);
    seaPanA.connect(master);
    seaA.start();

    const seaB = ctx.createBufferSource();
    seaB.buffer = noiseBuf;
    seaB.loop = true;
    const seaFilterB = ctx.createBiquadFilter();
    seaFilterB.type = 'lowpass';
    seaFilterB.frequency.value = 520;
    const seaB2 = ctx.createGain();
    seaB2.gain.value = .55;
    const seaPanB = ctx.createStereoPanner();
    seaPanB.pan.value = .25;
    seaB.connect(seaFilterB);
    seaFilterB.connect(seaB2);
    seaB2.connect(seaPanB);
    seaPanB.connect(master);
    seaB.start(ctx.currentTime, 1.7);

    const seaLfo = ctx.createOscillator();
    seaLfo.frequency.value = .09;
    const seaLfoGain = ctx.createGain();
    seaLfoGain.gain.value = .012;
    seaLfo.connect(seaLfoGain);
    seaLfoGain.connect(seaGain.gain);
    seaLfo.start();

    const wind = ctx.createBufferSource();
    wind.buffer = noiseBuf;
    wind.loop = true;
    const windFilter = ctx.createBiquadFilter();
    windFilter.type = 'bandpass';
    windFilter.frequency.value = 900;
    windFilter.Q.value = .55;
    windGain = ctx.createGain();
    windGain.gain.value = .025;
    const windPan = ctx.createStereoPanner();
    windPan.pan.value = .12;
    wind.connect(windFilter);
    windFilter.connect(windGain);
    windGain.connect(windPan);
    windPan.connect(master);
    wind.start(ctx.currentTime, .8);

    const windLfo = ctx.createOscillator();
    windLfo.frequency.value = .05;
    const windLfoGain = ctx.createGain();
    windLfoGain.gain.value = .006;
    windLfo.connect(windLfoGain);
    windLfoGain.connect(windGain.gain);
    windLfo.start();

    started = true;
  }

  function pad(t, chord){
    chord.notes.forEach((midi, i) => {
      const f = mtof(midi);
      const out = ctx.createGain();
      out.gain.setValueAtTime(.0001, t);
      out.gain.linearRampToValueAtTime(.028, t + 1.4);
      out.gain.setValueAtTime(.028, t + 2.4);
      out.gain.exponentialRampToValueAtTime(.0006, t + 5.2);
      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 760;
      const pan = ctx.createStereoPanner();
      pan.pan.value = (i - 1) * .24;
      for (const [type, detune, gain] of [['sine', -3, .7], ['triangle', 4, .3]]){
        const osc = ctx.createOscillator();
        osc.type = type;
        osc.frequency.value = f;
        osc.detune.value = detune;
        const g = ctx.createGain();
        g.gain.value = gain;
        osc.connect(g);
        g.connect(filter);
        osc.start(t);
        osc.stop(t + 5.4);
      }
      filter.connect(out);
      out.connect(pan);
      pan.connect(musicBus);
    });
  }

  function pluck(t, midi, vel, pan){
    const f = mtof(midi);
    const out = ctx.createGain();
    out.gain.setValueAtTime(.0001, t);
    out.gain.linearRampToValueAtTime(vel, t + .012);
    out.gain.exponentialRampToValueAtTime(.0005, t + 1.9);
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(2800, t);
    filter.frequency.exponentialRampToValueAtTime(900, t + .85);
    const p = ctx.createStereoPanner();
    p.pan.value = clamp(pan, -.7, .7);
    for (const [ratio, type, gain] of [[1, 'triangle', 1], [2.005, 'sine', .17], [3.008, 'sine', .05]]){
      const osc = ctx.createOscillator();
      osc.type = type;
      osc.frequency.value = f * ratio;
      osc.detune.value = (Math.random() - .5) * 5;
      const g = ctx.createGain();
      g.gain.value = gain;
      osc.connect(g);
      g.connect(filter);
      osc.start(t);
      osc.stop(t + 2.1);
    }
    const click = ctx.createBufferSource();
    click.buffer = noiseBuf;
    const clickFilter = ctx.createBiquadFilter();
    clickFilter.type = 'bandpass';
    clickFilter.frequency.value = Math.min(5200, f * 2);
    clickFilter.Q.value = 1.5;
    const clickGain = ctx.createGain();
    clickGain.gain.setValueAtTime(.035, t);
    clickGain.gain.exponentialRampToValueAtTime(.0001, t + .05);
    click.connect(clickFilter);
    clickFilter.connect(clickGain);
    clickGain.connect(filter);
    click.start(t);
    click.stop(t + .06);
    filter.connect(out);
    out.connect(p);
    p.connect(musicBus);
  }

  function bass(t, midi){
    for (const [note, gain] of [[midi, .075], [midi + 12, .015]]){
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = mtof(note);
      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 210;
      const g = ctx.createGain();
      g.gain.setValueAtTime(.0001, t);
      g.gain.linearRampToValueAtTime(gain, t + .06);
      g.gain.exponentialRampToValueAtTime(.0006, t + 3.4);
      osc.connect(g);
      g.connect(filter);
      filter.connect(musicBus);
      osc.start(t);
      osc.stop(t + 3.5);
    }
  }

  function melody(t, chord){
    chord.melody.forEach((midi, i) => {
      pluck(
        t + melodyBeats[i] * BEAT + (Math.random() - .5) * .02,
        midi,
        .085 + Math.random() * .025,
        (i / 4 - .5) * .6
      );
    });
  }

  function gull(t){
    const pan = ctx.createStereoPanner();
    pan.pan.value = Math.random() * 1.4 - .7;
    pan.connect(sfxBus);
    const base = 650 + Math.random() * 500;
    for (let i = 0; i < 3; i++){
      const at = t + i * (.16 + Math.random() * .07);
      const osc = ctx.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(base * (1 + i * .05), at);
      osc.frequency.exponentialRampToValueAtTime(base * .65, at + .18);
      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 1800;
      filter.Q.value = 2.4;
      const g = ctx.createGain();
      g.gain.setValueAtTime(.0001, at);
      g.gain.linearRampToValueAtTime(.024, at + .02);
      g.gain.exponentialRampToValueAtTime(.0004, at + .24);
      osc.connect(filter);
      filter.connect(g);
      g.connect(pan);
      osc.start(at);
      osc.stop(at + .26);
    }
  }

  function foghorn(t){
    const out = ctx.createGain();
    out.gain.setValueAtTime(.0001, t);
    out.gain.linearRampToValueAtTime(.055, t + 1.2);
    out.gain.setValueAtTime(.055, t + 2.6);
    out.gain.exponentialRampToValueAtTime(.0005, t + 4.6);
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 320;
    const pan = ctx.createStereoPanner();
    pan.pan.value = .3;
    for (const [freq, gain] of [[65.4, 1], [98.1, .45], [130.8, .18]]){
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = freq;
      const g = ctx.createGain();
      g.gain.value = gain;
      osc.connect(g);
      g.connect(filter);
      osc.start(t);
      osc.stop(t + 4.8);
    }
    filter.connect(out);
    out.connect(pan);
    pan.connect(sfxBus);
  }

  function schedule(){
    if (!on || !ctx) return;
    const now = ctx.currentTime;
    const ahead = now + .7;
    if (nextChordAt < now - .2) nextChordAt = now + .1;
    while (nextChordAt < ahead){
      const chord = chords[chordIndex % chords.length];
      pad(nextChordAt, chord);
      bass(nextChordAt, chord.root);
      melody(nextChordAt, chord);
      nextChordAt += chordLen;
      chordIndex++;
    }
    if (nextGullAt < now - .2) nextGullAt = now + 2;
    if (nextGullAt < ahead){
      if (stormLevel < .45) gull(nextGullAt);
      nextGullAt += 10 + Math.random() * 9;
    }
    if (nextFogAt < now - .2) nextFogAt = now + 4;
    if (nextFogAt < ahead){
      foghorn(nextFogAt);
      nextFogAt += 38 + Math.random() * 16;
    }
  }

  function startClock(){
    stopClock();
    const now = ctx.currentTime;
    nextChordAt = now + .12;
    chordIndex = 0;
    nextGullAt = now + 4.5;
    nextFogAt = now + 7.5;
    schedule();
    ticker = window.setInterval(schedule, 200);
  }

  function stopClock(){
    if (ticker){
      clearInterval(ticker);
      ticker = 0;
    }
  }

  function setUi(){
    if (!button) return;
    button.classList.toggle('on', on);
    button.classList.remove('hint');
    if (icon) icon.classList.remove('hint');
    button.setAttribute('aria-pressed', on ? 'true' : 'false');
    button.setAttribute('aria-label', on ? '关闭环境声' : '开启环境声');
    button.title = on ? '关闭环境声' : '开启环境声';
  }

  function fail(){
    if (button){
      button.disabled = true;
      button.classList.remove('on', 'hint');
      if (icon) icon.classList.remove('hint');
      button.title = '当前浏览器不支持环境声';
    }
  }

  async function enable(){
    if (!AC || !button) return;
    try {
      if (!started) build();
      if (ctx.state === 'suspended' || ctx.state === 'interrupted') await ctx.resume();
      clearTimeout(suspendTimer);
      if (!on){
        on = true;
        startClock();
      }
      const t = ctx.currentTime;
      master.gain.cancelScheduledValues(t);
      master.gain.setTargetAtTime(.9, t, .4);
      setUi();
    } catch (err){
      fail();
    }
  }

  function disable(){
    if (!started) return;
    on = false;
    stopClock();
    const t = ctx.currentTime;
    master.gain.cancelScheduledValues(t);
    master.gain.setTargetAtTime(.0001, t, .12);
    setUi();
    clearTimeout(suspendTimer);
    suspendTimer = setTimeout(() => {
      if (!on && ctx && ctx.state === 'running') ctx.suspend().catch(() => {});
    }, 700);
  }

  function toggle(){
    if (on) disable();
    else enable();
  }

  function setStorm(value){
    stormLevel = value;
    if (!started || !on) return;
    const now = performance.now();
    if (now - lastMix < 200) return;
    lastMix = now;
    const t = ctx.currentTime;
    seaGain.gain.setTargetAtTime(.045 + value * .085, t, .55);
    windGain.gain.setTargetAtTime(.025 + value * .08, t, .6);
    seaFilter.frequency.setTargetAtTime(720 + value * 620, t, .8);
  }

  function thunder(){
    if (!on || !ctx) return;
    const now = performance.now();
    if (now - lastThunder < 2800) return;
    lastThunder = now;
    const t = ctx.currentTime;
    const pan = ctx.createStereoPanner();
    pan.pan.value = Math.random() * 1.4 - .7;
    pan.connect(sfxBus);

    const src = ctx.createBufferSource();
    src.buffer = noiseBuf;
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(260, t);
    filter.frequency.exponentialRampToValueAtTime(90, t + 2);
    const g = ctx.createGain();
    g.gain.setValueAtTime(.0001, t);
    g.gain.linearRampToValueAtTime(.12 + stormLevel * .06, t + .04);
    g.gain.exponentialRampToValueAtTime(.0005, t + 2.6);
    src.connect(filter);
    filter.connect(g);
    g.connect(pan);
    src.start(t);
    src.stop(t + 2.8);

    const sub = ctx.createOscillator();
    sub.type = 'sine';
    sub.frequency.setValueAtTime(52, t);
    sub.frequency.exponentialRampToValueAtTime(34, t + 1.6);
    const sg = ctx.createGain();
    sg.gain.setValueAtTime(.0001, t);
    sg.gain.linearRampToValueAtTime(.075, t + .08);
    sg.gain.exponentialRampToValueAtTime(.0005, t + 2.2);
    sub.connect(sg);
    sg.connect(pan);
    sub.start(t);
    sub.stop(t + 2.4);
  }

  function level(){
    if (!analyser) return 0;
    const data = new Uint8Array(analyser.fftSize);
    analyser.getByteTimeDomainData(data);
    let sum = 0;
    for (const v of data){
      const x = (v - 128) / 128;
      sum += x * x;
    }
    return Math.sqrt(sum / data.length);
  }

  if (!AC || !button){
    fail();
    return {
      enable(){}, disable(){}, toggle(){}, setStorm(){}, thunder(){}, level(){ return 0; },
      get on(){ return false; }, get started(){ return false; }, get context(){ return null; }
    };
  }

  button.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    toggle();
  });

  function autoStart(e){
    if (started || on) return;
    if (e.target.closest?.('#audioBtn, .loading')) return;
    const loading = document.getElementById('loading');
    if (loading && !loading.classList.contains('done')) return;
    enable();
  }
  window.addEventListener('pointerdown', autoStart, { passive: true });
  window.addEventListener('keydown', (e) => {
    if (started || on) return;
    if (e.target.closest?.('#audioBtn')) return;
    if (e.code === 'Space' || e.code === 'Enter') autoStart(e);
  }, { passive: true });

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden){
      if (ctx.state === 'running') ctx.suspend().catch(() => {});
    } else if (on){
      ctx.resume().then(() => startClock()).catch(() => {});
    }
  });

  return {
    enable, disable, toggle, setStorm, thunder, level,
    get on(){ return on; },
    get started(){ return started; },
    get context(){ return ctx; }
  };
})();

// Orbit / zoom
function noteInteraction(){
  lastInteract = performance.now();
}
canvas.addEventListener('pointerdown', (e)=>{
  if (!e.isPrimary) return;
  dragging = true;
  pointerDownAt = performance.now();
  pointerTravel = 0;
  prevPointer.x = e.clientX;
  prevPointer.y = e.clientY;
  canvas.classList.add('dragging');
  canvas.setPointerCapture(e.pointerId);
  noteInteraction();
});
canvas.addEventListener('pointermove', (e)=>{
  if (!dragging || !e.isPrimary) return;
  const dx = e.clientX - prevPointer.x;
  const dy = e.clientY - prevPointer.y;
  pointerTravel += Math.abs(dx) + Math.abs(dy);
  prevPointer.x = e.clientX;
  prevPointer.y = e.clientY;
  view.tAz -= dx * .0052;
  view.tPolar = clamp(view.tPolar + dy * .0036, .56, 1.42);
  noteInteraction();
});
function endDrag(e){
  if (!dragging) return;
  const shortClick = e && e.type === 'pointerup' && pointerTravel < 8 && performance.now() - pointerDownAt < 560;
  dragging = false;
  canvas.classList.remove('dragging');
  if (e && e.pointerId !== undefined && canvas.hasPointerCapture?.(e.pointerId)){
    canvas.releasePointerCapture(e.pointerId);
  }
  if (shortClick) handleSceneClick(e);
  noteInteraction();
}
function triggerClick(kind, obj, hit){
  if (kind === 'ship'){
    clickFx.ship = 2.4;
    emitSprayBurst(shipRoot.position.x, shipRoot.position.z, .5, 20);
  } else if (kind === 'whale'){
    clickFx.whale = 1.6;
    emitSprayBurst(whale.position.x, whale.position.z, .45, 24, true);
  } else if (kind === 'beam'){
    clickFx.beam = 3.2;
  } else if (kind === 'cork'){
    clickFx.cork = 1.2;
  } else if (kind === 'gull'){
    const g = gulls[obj.userData.index];
    if (g) g.startle = 1.2;
  } else if (kind === 'crab'){
    const c = crabs[obj.userData.index];
    if (c) c.startle = 1.1;
  } else if (kind === 'rowboat'){
    clickFx.rowboat = 1.4;
    emitSprayBurst(rowboat.position.x, rowboat.position.z, .32, 14);
  } else if (kind === 'buoy'){
    clickFx.buoy = 1.6;
  } else if (kind === 'chest'){
    clickFx.chest = 1.8;
  } else if (kind === 'water' && hit){
    emitSprayBurst(hit.point.x, hit.point.z, .3, 16);
  }
}
function handleSceneClick(e){
  const rect = canvas.getBoundingClientRect();
  clickNDC.set(((e.clientX - rect.left) / rect.width) * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
  clickRay.setFromCamera(clickNDC, camera);
  const hits = clickRay.intersectObjects(clickTargets, true);
  let waterHit = null;
  for (const hit of hits){
    if (hit.object.isLine || hit.object.isPoints) continue;
    let o = hit.object, kind = null, target = null;
    while (o){
      if (o.userData && o.userData.kind){ kind = o.userData.kind; target = o; break; }
      o = o.parent;
    }
    if (!kind) continue;
    if (kind === 'water'){
      if (!waterHit) waterHit = hit;
      continue;
    }
    triggerClick(kind, target, hit);
    return true;
  }
  if (waterHit){
    triggerClick('water', waterHit.object, waterHit);
    return true;
  }
  return false;
}

  view.tAz = az;

function updateCamera(dt, time, storm){
  const now = performance.now();
  if (!dragging && now - lastInteract > 4800){
    view.tAz += dt * .047;
  }
  const damp = 1 - Math.exp(-dt * 4.9);
  view.az += (view.tAz - view.az) * damp;
  view.polar += (view.tPolar - view.polar) * damp;
  view.dist += (view.tDist - view.dist) * damp;
  const horiz = Math.sin(view.polar) * view.dist;
  const shake = storm * .02;
  camera.position.set(
    cameraTarget.x + Math.sin(view.az) * horiz + Math.sin(time*23.1) * shake,
    cameraTarget.y + Math.cos(view.polar) * view.dist + Math.sin(time*19.3) * shake * .65,
    cameraTarget.z + Math.cos(view.az) * horiz + Math.cos(time*17.7) * shake
  );
  camera.lookAt(cameraTarget.x, cameraTarget.y + .05, cameraTarget.z);
}

function updateProjectionUniforms(){
  const h = window.innerHeight * renderer.getPixelRatio();
  wakeUniforms.uProjScale.value = h / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov * .5)));
  wakeUniforms.uPixelRatio.value = renderer.getPixelRatio();
  bubbleUniforms.uPixelRatio.value = renderer.getPixelRatio();
  crestUniforms.uPixelRatio.value = renderer.getPixelRatio();
  starUniforms.uPixelRatio.value = renderer.getPixelRatio();
}
function onResize(){

  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
  renderer.setSize(window.innerWidth, window.innerHeight);
  updateProjectionUniforms();
}

const clock = new THREE.Clock();
let perfStart = 0;
let perfFrames = 0;
let qualityAdjusted = false;

function animate(){
  const dt = Math.min(clock.getDelta(), .05);
  timeNow += dt;
  stormVisual += (stormTarget - stormVisual) * Math.min(1, dt * (stormTarget > stormVisual ? 2.05 : 1.28));
  if (stormVisual < .001) stormVisual = 0;
  Sound.setStorm(stormVisual);
  if (!day.paused){
    day.t = (day.t + dt * day.speed / DAY_LENGTH) % 1;
  }
  lightningFlicker = lightningFlash;

  updateCelestialAndLight(timeNow);
  updateShip(timeNow, dt, stormVisual);
  updateBottleShake(timeNow, stormVisual);
  updateWhale(timeNow, stormVisual, dt);
  updateWakeParticles(dt, timeNow, stormVisual);
  updateGulls(timeNow, stormVisual, dt);
  updateClouds(timeNow, dt, stormVisual);
  updateFish(timeNow);
  updateCrabs(timeNow, dt);
  updateRowboat(timeNow, dt, stormVisual);
  updateBuoy(timeNow, dt, stormVisual);
  updatePalms(timeNow);
  updateBeam(timeNow, dt);
  updateClickProps(timeNow, dt);
  updateLightning(dt, stormVisual);
  updateCamera(dt, timeNow, stormVisual);
  updateHUD();

  updateShipUiExtras(timeNow);

  renderer.render(scene, camera);

  if (!qualityAdjusted){
    if (!perfStart) perfStart = performance.now();
    perfFrames++;
    const elapsed = (performance.now() - perfStart) / 1000;
    if (elapsed > 5.5){
      const fps = perfFrames / elapsed;
      if (fps < 48 && renderer.getPixelRatio() > 1.2){
        renderer.setPixelRatio(1.15);
        renderer.setSize(window.innerWidth, window.innerHeight);
        updateProjectionUniforms();
      }
      qualityAdjusted = true;
    }
  }

  requestAnimationFrame(animate);
}

function updateShipUiExtras(time){
  if (buoyGlow.material) buoyGlow.material.opacity = .12 + nightFactor*.32;
  if (rowboatGlow.material) rowboatGlow.material.opacity = .1 + nightFactor*.25;
  if (shipModel.userData.lanternGlow){
    shipModel.userData.lanternGlow.material.opacity = .2 + nightFactor*.33 + Math.sin(time*3.3)*.02;
  }
}

  THREE, scene, camera, renderer, view, day, cameraTarget, telescopeGroup,
  gulls, whale, whaleState, beamGroup, audio: Sound,
  clickTargets, clickFx, triggerClick, handleSceneClick,
  shipRoot, rowboat, buoy, corkGroup, chestGlowSprite, water, crabs,
  setDayT(value){ day.t = ((value % 1) + 1) % 1; updateCelestialAndLight(timeNow); updateHUD(true); },
  setSpeed,
  setPaused(value){ day.paused = !!value; updateHUD(true); },
  setStorm(value){ setStorm(!!value); },
  strikeLightning,
  setCamera(az, polar, dist){
    view.tAz = view.az = az;
    view.tPolar = view.polar = polar;
    view.tDist = view.dist = dist;
    lastInteract = performance.now();
    updateCamera(.016, timeNow, stormVisual);
  },
  snapshot(){
    return {
      phase: phaseEl.textContent,
      clock: clockEl.textContent,
      dayT: day.t,
      storm: stormVisual,
      pixelRatio: renderer.getPixelRatio(),
      drawCalls: renderer.info.render.calls,
      triangles: renderer.info.render.triangles,
      audioOn: Sound.on,
      audioState: Sound.context ? Sound.context.state : 'idle'
    };
  }
};
</script>
</body>
</html>
