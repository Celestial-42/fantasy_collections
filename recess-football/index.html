<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#100d08" />
<title>铃响之前 · Before the Bell</title>
<meta name="description" content="幻想藏品 No.08《铃响之前》：玻璃钟罩里的青禾小学操场，五个对五个的课间足球赛，五分钟倒计时，铃声一响就跑回教学楼。" />
<style>
  :root{
    --ink:#100d08;
    --ink-deep:#060504;
    --bone:#f4ead7;
    --bone-dim:#d9c8ae;
    --muted:#a18b70;
    --accent:#e2b46a;
    --accent-hot:#ffe0a6;
    --field:#86a16b;
    --chalk:#eee4ca;
    --red:#c65d4a;
    --blue:#547f9e;
    --line:rgba(244,234,215,.14);
    --line-soft:rgba(244,234,215,.06);
    --panel:rgba(19,15,10,.72);
    --serif:"Iowan Old Style","Baskerville","Palatino Linotype","Songti SC","STSong","Noto Serif CJK SC",serif;
    --sans:"Avenir Next","Helvetica Neue","PingFang SC","Hiragino Sans GB",sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{width:100%;height:100%;margin:0;}
  html{background:var(--ink);}
  body{
    overflow:hidden;
    background:
      radial-gradient(74% 66% at 24% 8%, rgba(154,110,56,.17), transparent 62%),
      radial-gradient(64% 58% at 82% 20%, rgba(104,132,96,.11), transparent 66%),
      radial-gradient(120% 90% at 50% 100%, #181008 0%, #0b0806 62%, #050303 100%);
    color:var(--bone);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    user-select:none;
  }
  #stage{position:fixed;inset:0;}
  #scene{
    display:block;width:100%;height:100%;outline:none;
    cursor:grab;touch-action:none;
  }
  #scene.dragging{cursor:grabbing;}
  .vignette,.grain{position:fixed;inset:0;pointer-events:none;}
  .vignette{
    z-index:2;
    background:
      radial-gradient(ellipse at 50% 44%, transparent 34%, rgba(7,5,2,.15) 68%, rgba(3,2,1,.7) 100%),
      linear-gradient(180deg, rgba(6,4,2,.5), transparent 31%, transparent 68%, rgba(3,2,1,.66));
  }
  .grain{
    z-index:3;opacity:.1;mix-blend-mode:soft-light;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.62'/%3E%3C/svg%3E");
  }

  .masthead{
    position:fixed;z-index:5;
    top:clamp(22px,4vw,52px);
    left:clamp(22px,4.5vw,64px);
    max-width:min(42vw,560px);
    pointer-events:none;
  }
  .brand{display:flex;align-items:center;gap:11px;color:var(--muted);font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;}
  .brand svg{width:26px;height:34px;color:var(--accent);opacity:.88;}
  .masthead h1{
    margin:18px 0 0;
    font-family:var(--serif);
    font-weight:500;
    font-size:clamp(40px,5.2vw,76px);
    letter-spacing:.07em;
    line-height:.98;
    color:var(--bone);
    text-shadow:0 8px 34px rgba(0,0,0,.36);
  }
  .title-en{
    margin-top:13px;
    font-size:9.5px;letter-spacing:.46em;text-transform:uppercase;color:var(--accent);
  }
  .intro{
    margin:16px 0 0;
    display:flex;align-items:center;gap:14px;
    color:var(--muted);font-size:10.5px;letter-spacing:.16em;
  }
  .intro::before{content:"";width:34px;height:1px;background:var(--line);}
  .intro span{color:var(--bone-dim);letter-spacing:.08em;}

  .panel{
    position:fixed;z-index:6;
    top:clamp(22px,4vw,52px);
    right:clamp(22px,4.5vw,64px);
    width:min(312px,31vw);
    padding:17px 18px 15px;
    background:linear-gradient(160deg, rgba(27,20,13,.84), rgba(13,10,7,.66));
    border:1px solid var(--line);
    box-shadow:0 24px 60px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.035);
    backdrop-filter:blur(14px);
  }
  .panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
  .panel-head span{font-size:8.5px;letter-spacing:.28em;color:var(--muted);text-transform:uppercase;}
  .panel-head strong{font-family:var(--serif);font-size:24px;font-weight:400;color:var(--bone);letter-spacing:.04em;}
  .panel-rule{height:1px;background:var(--line-soft);margin:11px 0 10px;}

  .scoreboard{
    display:flex;align-items:flex-end;justify-content:space-between;gap:8px;
    padding:1px 2px 11px;
    border-bottom:1px solid var(--line-soft);
  }
  .team{display:flex;align-items:center;gap:7px;min-width:0;}
  .team.blue{flex-direction:row-reverse;text-align:right;}
  .team i{
    width:7px;height:7px;border-radius:50%;flex:0 0 7px;
    box-shadow:0 0 0 3px rgba(255,255,255,.045);
  }
  .team.red i{background:var(--red);}
  .team.blue i{background:var(--blue);}
  .team span{font-size:9px;letter-spacing:.14em;color:var(--muted);}
  .team b{
    font-family:var(--serif);font-weight:400;
    font-size:29px;line-height:.9;color:var(--bone);letter-spacing:.02em;
  }
  .score-colon{
    font-family:var(--serif);font-size:19px;line-height:1;
    color:rgba(244,234,215,.28);padding-bottom:4px;
  }
  .time-row{
    display:flex;align-items:baseline;justify-content:space-between;gap:10px;
    margin-top:11px;font-size:8.5px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;
  }
  .time-row b{
    font-family:var(--serif);font-weight:400;font-size:18px;letter-spacing:.08em;
    color:var(--accent-hot);font-variant-numeric:tabular-nums;
  }
  .time-track{height:2px;background:rgba(244,234,215,.1);margin-top:7px;overflow:hidden;}
  .time-track i{
    display:block;height:100%;width:100%;transform-origin:left center;
    background:linear-gradient(90deg,var(--accent),var(--accent-hot));
    transition:transform .25s linear;
  }
  .panel-meta{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:10px;color:var(--bone-dim);margin-top:11px;}
  .panel-meta em{font-style:normal;color:var(--muted);font-size:9px;letter-spacing:.08em;}
  .panel-row{
    margin-top:9px;padding-top:9px;border-top:1px solid var(--line-soft);
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:9px;color:var(--muted);letter-spacing:.08em;
  }
  .panel-row b{font-weight:500;color:var(--field);font-size:10px;}
  .panel-sound{align-items:center;}
  .panel-sound button{
    appearance:none;border:1px solid rgba(226,180,106,.22);background:rgba(226,180,106,.05);
    padding:2px 6px;min-width:26px;min-height:20px;margin-left:8px;
    display:inline-flex;align-items:center;justify-content:center;
    font-family:var(--sans);font-size:9px;line-height:1;letter-spacing:.12em;color:var(--field);
    cursor:pointer;transition:color .25s ease,border-color .25s ease,background .25s ease;
  }
  .panel-sound button:hover,.panel-sound button.is-on{
    color:var(--accent);border-color:rgba(226,180,106,.55);background:rgba(226,180,106,.13);
  }
  .panel-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:13px;}
  .panel-actions button,.panel-actions a{
    appearance:none;border:1px solid var(--line);
    background:rgba(255,255,255,.025);
    color:var(--bone-dim);text-decoration:none;
    font-family:var(--sans);font-size:9px;letter-spacing:.12em;
    display:flex;align-items:center;justify-content:center;min-height:31px;
    cursor:pointer;transition:.25s ease;
  }
  .panel-actions button:hover,.panel-actions a:hover{color:var(--bone);border-color:rgba(226,180,106,.48);background:rgba(226,180,106,.06);}
  .panel-actions .bell-btn{
    grid-column:1 / -1;
    color:var(--accent-hot);
    border-color:rgba(226,180,106,.42);
    background:linear-gradient(180deg, rgba(226,180,106,.13), rgba(226,180,106,.045));
    letter-spacing:.2em;
    min-height:35px;
  }
  .panel-actions .bell-btn:hover{
    border-color:rgba(255,224,166,.8);
    background:linear-gradient(180deg, rgba(226,180,106,.21), rgba(226,180,106,.08));
  }
  .panel-actions .bell-btn:disabled{opacity:.45;cursor:default;}

  .side-mark{
    position:fixed;z-index:4;right:clamp(14px,2vw,24px);top:50%;
    transform:rotate(90deg) translateX(50%);transform-origin:right center;
    font-size:8px;letter-spacing:.42em;color:rgba(244,234,215,.24);
    text-transform:uppercase;pointer-events:none;white-space:nowrap;
  }

  .hintbar{
    position:fixed;z-index:5;left:50%;bottom:clamp(18px,3vw,34px);
    transform:translateX(-50%);
    display:flex;align-items:center;gap:clamp(14px,2.4vw,30px);
    color:rgba(244,234,215,.34);font-size:9px;letter-spacing:.1em;
    white-space:nowrap;pointer-events:none;
  }
  .hintbar b{font-weight:500;color:rgba(244,234,215,.58);margin-right:5px;}
  .hintbar i{width:1px;height:9px;background:rgba(244,234,215,.13);}
  .hint-note{
    position:fixed;z-index:4;left:clamp(22px,4.5vw,64px);bottom:clamp(48px,6vw,72px);
    color:rgba(244,234,215,.4);font-family:var(--serif);font-size:10px;letter-spacing:.11em;text-shadow:0 2px 14px rgba(0,0,0,.55);
    pointer-events:none;
  }

  .toast{
    position:fixed;z-index:8;left:50%;top:18%;transform:translate(-50%,-8px);
    padding:10px 22px 11px;
    font-family:var(--serif);font-size:15px;letter-spacing:.18em;
    color:var(--accent-hot);
    background:linear-gradient(180deg, rgba(24,18,11,.78), rgba(12,9,6,.5));
    border:1px solid rgba(226,180,106,.24);
    opacity:0;visibility:hidden;
    transition:opacity .4s ease,transform .5s cubic-bezier(.22,.61,.36,1),visibility .4s;
    pointer-events:none;
    white-space:nowrap;
    text-shadow:0 2px 18px rgba(0,0,0,.5);
  }
  .toast.show{opacity:1;visibility:visible;transform:translate(-50%,0);}
  .toast.bell{
    font-size:28px;letter-spacing:.36em;padding:14px 38px 16px;
    color:#fff4dc;border-color:rgba(255,224,166,.42);
    box-shadow:0 0 60px rgba(226,180,106,.16);
  }
  .bell-flash{
    position:fixed;inset:0;z-index:7;pointer-events:none;opacity:0;
    background:radial-gradient(circle at 50% 34%, rgba(255,241,206,.5), rgba(255,230,178,.1) 38%, transparent 66%);
  }
  .bell-flash.show{animation:bellflash 1.25s ease-out;}
  @keyframes bellflash{
    0%{opacity:0;}12%{opacity:.6;}34%{opacity:.16;}100%{opacity:0;}
  }

  .loading{
    position:fixed;inset:0;z-index:30;display:grid;place-items:center;
    background:radial-gradient(70% 60% at 50% 40%, #1b130c, #080604 78%);
    opacity:1;visibility:visible;transition:opacity .9s ease,visibility .9s;
  }
  .loading.done{opacity:0;visibility:hidden;pointer-events:none;}
  .loading-inner{display:grid;place-items:center;gap:18px;color:var(--bone-dim);text-align:center;}
  .loading-mark{width:48px;height:56px;color:var(--accent);opacity:.84;animation:float 4s ease-in-out infinite;}
  .loading-title{font-family:var(--serif);font-size:28px;letter-spacing:.2em;color:var(--bone);}
  .loading-sub{font-size:9px;letter-spacing:.24em;color:var(--muted);text-transform:uppercase;}
  @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
  @media (prefers-reduced-motion: reduce){.loading-mark{animation:none;}}

  @media (max-width: 900px){
    .masthead{max-width:62vw;}
    .panel{width:min(262px,38vw);padding:13px 14px 12px;}
    .panel-head strong{font-size:20px;}
    .side-mark{display:none;}
  }
  @media (max-width: 700px){
    .masthead{top:18px;left:18px;max-width:60vw;}
    .masthead h1{font-size:clamp(34px,9.6vw,44px);margin-top:13px;}
    .title-en{font-size:8px;letter-spacing:.3em;}
    .intro{font-size:9px;letter-spacing:.08em;margin-top:11px;display:block;}
    .intro::before{display:none;}
    .intro span{display:block;margin-top:5px;}
    .panel{top:18px;right:14px;width:148px;padding:10px 10px 9px;background:rgba(18,13,8,.61);}
    .panel-head span{font-size:7px;letter-spacing:.1em;}
    .panel-head strong{font-size:15px;}
    .panel-rule{margin:8px 0 7px;}
    .scoreboard{padding-bottom:8px;gap:4px;}
    .team{gap:4px;}
    .team i{width:5px;height:5px;flex-basis:5px;box-shadow:none;}
    .team span{font-size:7px;letter-spacing:.04em;}
    .team b{font-size:21px;}
    .score-colon{font-size:14px;padding-bottom:2px;}
    .time-row{font-size:6.5px;letter-spacing:.08em;margin-top:8px;}
    .time-row b{font-size:13px;}
    .time-track{margin-top:5px;}
    .panel-meta{display:block;font-size:8px;line-height:1.7;margin-top:8px;}
    .panel-meta em{display:block;font-size:7px;}
    .panel-row{font-size:7.5px;margin-top:6px;padding-top:6px;}
    .panel-row b{font-size:8px;}
    .panel-sound button{font-size:8px;min-width:27px;min-height:20px;padding:2px 5px;}
    .panel-actions{gap:5px;margin-top:8px;}
    .panel-actions button,.panel-actions a{min-height:24px;font-size:7.5px;letter-spacing:.06em;}
    .panel-actions .bell-btn{min-height:27px;}
    .hintbar{bottom:14px;gap:9px;font-size:7.5px;letter-spacing:.03em;}
    .hintbar b{margin-right:3px;}
    .hintbar .desk-hint{display:none;}
    .hint-note{display:none;}
    .toast{top:15%;font-size:13px;padding:8px 16px 9px;}
    .toast.bell{font-size:22px;letter-spacing:.24em;padding:11px 26px 12px;}
  }
</style>
</head>
<body>
<div id="stage"><canvas id="scene" aria-label="玻璃钟罩里的青禾小学操场，红蓝两队课间足球赛"></canvas></div>
<div class="vignette"></div>
<div class="grain"></div>

<header class="masthead">
  <div class="brand">
    <svg viewBox="0 0 32 42" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true">
      <path d="M16 38c-7-4-10-11-10-18C6 12 10 5 16 3c6 2 10 9 10 17 0 7-3 14-10 18Z"/>
      <path d="M16 37V7M10 35.5c-2.6-5-3.5-10.2-3-15.8M22 35.5c2.6-5 3.5-10.2 3-15.8M7 27.5c2.2 1 4 1.5 6 1.7M25 27.5c-2.2 1-4 1.5-6 1.7M8 17.8c2.3-1.4 4.7-2.2 8-2.4M24 17.8c-2.3-1.4-4.7-2.2-8-2.4"/>
    </svg>
    <span>幻想藏品 · Atelier<br>Fantasy Collections</span>
  </div>
  <h1>铃响之前</h1>
  <div class="title-en">Before the Bell</div>
  <p class="intro">校园 · 课间 10:05</p>
</header>

<aside class="panel" aria-label="藏品与比赛信息">
  <div class="panel-head"><span>ATELIER NO. 08</span><strong>10:05</strong></div>
  <div class="panel-rule"></div>
  <div class="scoreboard" aria-live="polite">
    <span class="team red"><i aria-hidden="true"></i><span>红队</span><b id="scoreRed">0</b></span>
    <span class="score-colon">:</span>
    <span class="team blue"><b id="scoreBlue">0</b><span>蓝队</span><i aria-hidden="true"></i></span>
  </div>
  <div class="time-row"><span>比赛 · MATCH</span><b id="matchTime">05:00</b></div>
  <div class="time-track"><i id="timeFill"></i></div>
  <div class="panel-meta"><span>青禾小学 · 操场</span><em>晴 / 微风</em></div>
  <div class="panel-row"><span>课间 · 5v5</span><b id="matchState">比赛进行中</b></div>
  <div class="panel-row panel-sound"><span>声音 · SOUND</span><button id="soundBtn" type="button" aria-pressed="true" aria-label="切换声音">开</button></div>
  <div class="panel-actions">
    <button id="bellBtn" class="bell-btn" type="button">打上课铃</button>
    <button id="homeBtn" type="button">归位视角</button>
    <a href="../">总集目录</a>
  </div>
</aside>

<div class="side-mark">NO. 08 / BEFORE THE BELL / 2026</div>
<p class="hint-note" id="hintNote">铃声还没响，球先滚过了白线。</p>

<div class="hintbar">
  <span><b>拖拽</b>环绕</span><i></i>
  <span><b>滚轮</b>推近</span><i></i>
  <span><b>点击</b>人物 · 黑板</span><i></i>
  <span class="desk-hint"><b>双击</b>归位</span><i class="desk-hint"></i>
  <span><b>打铃</b>收队</span>
</div>

<div class="toast" id="toast" role="status"></div>
<div class="bell-flash" id="bellFlash"></div>

<div class="loading" id="loading">
  <div class="loading-inner">
    <svg class="loading-mark" viewBox="0 0 48 56" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true">
      <path d="M24 8c-7 0-11 5.2-11 12v9l-3.6 5.4v2.1h29.2v-2.1L35 29v-9C35 13.2 31 8 24 8Z"/>
      <path d="M19 40.5c.8 3 2.6 4.5 5 4.5s4.2-1.5 5-4.5"/>
      <path d="M24 3v4M13.5 13.5 11 11M34.5 13.5 37 11"/>
    </svg>
    <div class="loading-title">铃响之前</div>
    <div class="loading-sub">FIVE MINUTES BEFORE THE BELL</div>
  </div>
</div>

const canvas = document.getElementById('scene');

  const t = clamp((x - a) / (b - a), 0, 1);

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;

    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(20081005);
const rand = (a = 0, b = 1) => a + rng() * (b - a);

const BOX = new THREE.BoxGeometry(1, 1, 1);

const dummy = new THREE.Object3D();

function std(color, roughness = .82, metalness = 0, extra = {}){

}
const M = {

  keeperBlue: std(0x7ba277, .78),
  field: std(0x86a16b, .94),
  fieldDark: std(0x708b59, .95),
  track: std(0xb86e55, .94),
  sand: std(0xcdb58b, .96),

function canvasOf(w, h = w){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return [c, c.getContext('2d')];
}
function texFrom(c, repeatX = 1, repeatY = 1){
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  if (repeatX !== 1 || repeatY !== 1){
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(repeatX, repeatY);
  }
  return t;
}

function makeWoodTexture(w = 1024, h = 512, tone = 'table'){
  const [c, x] = canvasOf(w, h);
  const palette = tone === 'base'
    ? ['#2c1810', '#1d0f09', '#4e2c1b', '#6d4329']
    : ['#382016', '#1a0e08', '#5a351f', '#72482b'];
  x.fillStyle = palette[0]; x.fillRect(0, 0, w, h);
  const rows = tone === 'base' ? 5 : 6;
  for (let row = 0; row < rows; row++){
    const y0 = row * h / rows;
    x.fillStyle = palette[row % palette.length];
    x.globalAlpha = .6;
    x.fillRect(0, y0, w, h / rows + 1);
    x.globalAlpha = 1;
    for (let i = 0; i < 38; i++){
      const gy = y0 + rand(2, h / rows - 2);
      x.strokeStyle = `rgba(${row % 2 ? '120,74,42' : '42,22,13'},${rand(.05,.22)})`;
      x.lineWidth = rand(.5, 1.7);
      x.beginPath();
      for (let xx = 0; xx <= w; xx += 16){
        const yy = gy + Math.sin(xx * .013 + i * 1.7 + row) * rand(.5, 3.6);
        if (xx === 0) x.moveTo(xx, yy); else x.lineTo(xx, yy);
      }
      x.stroke();
    }
    x.strokeStyle = 'rgba(10,5,3,.55)';
    x.lineWidth = 2;
    x.beginPath(); x.moveTo(0, y0); x.lineTo(w, y0); x.stroke();
  }
  for (let i = 0; i < 5; i++){
    const kx = rand(0, w), ky = rand(0, h);
    x.strokeStyle = 'rgba(24,11,6,.4)';
    x.lineWidth = 2;
    x.beginPath(); x.ellipse(kx, ky, rand(8, 24), rand(3, 9), rand(0, TAU), 0, TAU); x.stroke();
  }
  return texFrom(c, tone === 'base' ? 1 : 4, tone === 'base' ? 1 : 3);
}

function makeBackdropTexture(){

  cool.addColorStop(0, 'rgba(120,144,102,.17)');

  x.fillStyle = cool; x.fillRect(0, 0, 1600, 900);
  // faint classroom-window light on the wall
  x.save();
  x.globalAlpha = .12;

}

function makeSkyTexture(){
  const [c, x] = canvasOf(2048, 1024);
  const g = x.createLinearGradient(0, 0, 0, 1024);
  g.addColorStop(0, '#5d9fb8');
  g.addColorStop(.28, '#8bbecb');
  g.addColorStop(.56, '#bdd8d5');
  g.addColorStop(.78, '#e8ddc2');
  g.addColorStop(.87, '#f5d3a2');
  g.addColorStop(.91, '#ecd0a5');
  g.addColorStop(.95, '#cfb690');
  g.addColorStop(1, '#b49a78');
  x.fillStyle = g; x.fillRect(0, 0, 2048, 1024);

  const sx = 520, sy = 360;
  const sun = x.createRadialGradient(sx, sy, 0, sx, sy, 360);
  sun.addColorStop(0, 'rgba(255,252,228,.98)');
  sun.addColorStop(.06, 'rgba(255,247,202,.9)');
  sun.addColorStop(.2, 'rgba(255,222,150,.38)');
  sun.addColorStop(.62, 'rgba(255,200,132,.1)');
  sun.addColorStop(1, 'rgba(255,194,132,0)');
  x.fillStyle = sun; x.fillRect(0, 0, 2048, 1024);
  x.fillStyle = 'rgba(255,255,246,.96)';
  x.beginPath(); x.arc(sx, sy, 22, 0, TAU); x.fill();

  function cloud(cx, cy, scale, alpha, warm){
    x.save();
    x.translate(cx, cy + 18 * scale);
    x.scale(1, .2);
    const shade = x.createRadialGradient(0, 0, 0, 0, 0, 250 * scale);
    shade.addColorStop(0, 'rgba(102,126,128,.07)');
    shade.addColorStop(.6, 'rgba(102,126,128,.03)');
    shade.addColorStop(1, 'rgba(102,126,128,0)');
    x.fillStyle = shade;
    x.beginPath(); x.arc(0, 0, 250 * scale, 0, TAU); x.fill();
    x.restore();
    for (let i = 0; i < 12; i++){
      const px = cx + rand(-130, 130) * scale;
      const py = cy + rand(-34, 30) * scale;
      const rx = rand(48, 142) * scale;
      const ry = rand(18, 48) * scale;
      x.save();
      x.translate(px, py);
      x.scale(1, ry / rx);
      const cg = x.createRadialGradient(0, 0, 0, 0, 0, rx);
      cg.addColorStop(0, warm ? `rgba(255,248,228,${alpha * 1.3})` : `rgba(255,253,245,${alpha * 1.3})`);
      cg.addColorStop(.48, warm ? `rgba(255,236,204,${alpha * .55})` : `rgba(244,250,246,${alpha * .48})`);
      cg.addColorStop(1, 'rgba(255,255,255,0)');
      x.fillStyle = cg;
      x.beginPath(); x.arc(0, 0, rx, 0, TAU); x.fill();
      x.restore();
    }
  }
  cloud(300, 380, 1.2, .25, false);
  cloud(760, 470, 1.0, .26, false);
  cloud(1080, 330, 1.3, .25, false);
  cloud(1450, 500, 1.25, .25, true);
  cloud(1790, 350, 1.0, .24, false);

  // distant tree line
  x.fillStyle = 'rgba(108,120,84,.22)';
  x.beginPath();
  x.moveTo(0, 946);
  x.quadraticCurveTo(260, 904, 520, 940);
  x.quadraticCurveTo(820, 902, 1120, 938);
  x.quadraticCurveTo(1440, 904, 1760, 940);
  x.quadraticCurveTo(1910, 918, 2048, 944);
  x.lineTo(2048, 1024); x.lineTo(0, 1024); x.closePath(); x.fill();
  const haze = x.createLinearGradient(0, 870, 0, 1005);
  haze.addColorStop(0, 'rgba(255,235,202,0)');
  haze.addColorStop(.58, 'rgba(255,232,196,.18)');
  haze.addColorStop(1, 'rgba(255,232,196,0)');
  x.fillStyle = haze; x.fillRect(0, 870, 2048, 135);
  return texFrom(c);
}

function makeBrickTexture(){

  const bh = 34, bw = 112;

const FIELD = { fx: 1.22, z0: .02, z1: 1.34, cz: .68, halfZ: .66, goalX: 1.22, goalHalfZ: .34, goalH: .36 };

function makeYardTexture(){
  const S = 2048;
  const [c, x] = canvasOf(S, S);
  const R = 1.97;
  const px = wx => S / 2 + wx * S / (2 * R);
  const pz = wz => S / 2 - wz * S / (2 * R);
  const pt = (wx, wz) => [px(wx), pz(wz)];

  // warm playground ground
  const g = x.createRadialGradient(S * .48, S * .44, S * .12, S * .5, S * .54, S * .66);
  g.addColorStop(0, '#d8c29a');
  g.addColorStop(.6, '#cdb58b');
  g.addColorStop(1, '#bda37a');
  x.fillStyle = g; x.fillRect(0, 0, S, S);
  for (let i = 0; i < 8000; i++){
    x.fillStyle = i % 3 ? 'rgba(255,244,216,.16)' : 'rgba(112,84,52,.13)';
    x.beginPath(); x.arc(rand(0, S), rand(0, S), rand(.5, 2.1), 0, TAU); x.fill();
  }

  // running track around the yard rim
  const cx = S / 2, cy = S / 2;
  const radii = [1.82, 1.87, 1.92].map(r => r * S / (2 * R));
  x.fillStyle = '#b86e55';
  x.beginPath();
  x.arc(cx, cy, radii[3] + 4, 0, TAU);
  x.arc(cx, cy, radii[0] - 4, 0, TAU, true);
  x.fill('evenodd');
  x.strokeStyle = 'rgba(238,228,202,.46)';
  x.lineWidth = 3;
  for (const r of radii){
    x.beginPath(); x.arc(cx, cy, r, 0, TAU); x.stroke();
  }
  x.strokeStyle = 'rgba(95,53,40,.18)';
  x.lineWidth = 1.5;
  for (let i = 0; i < 94; i++){
    const a = i / 94 * TAU;
    x.beginPath();
    x.moveTo(cx + Math.cos(a) * radii[0], cy + Math.sin(a) * radii[0]);
    x.lineTo(cx + Math.cos(a) * radii[3], cy + Math.sin(a) * radii[3]);
    x.stroke();
  }

  // concrete apron under the school entrance
  const [ax0, ay0] = pt(-1.22, -1.0);
  const [ax1, ay1] = pt(1.22, -1.48);
  x.fillStyle = '#c8b69a';
  x.fillRect(ax0, ay0, ax1 - ax0, ay1 - ay0);
  x.strokeStyle = 'rgba(120,99,72,.28)';
  x.lineWidth = 2;
  for (let i = 0; i < 7; i++){
    const yy = ay0 + (i + 1) * (ay1 - ay0) / 8;
    x.beginPath(); x.moveTo(ax0, yy); x.lineTo(ax1, yy); x.stroke();
  }

  // hopscotch on the left touchline
  x.save();
  x.translate(px(-1.5), pz(1.0));
  x.rotate(-.08);
  x.strokeStyle = 'rgba(243,236,215,.62)';
  x.lineWidth = 3;
  const cell = 24;
  const squares = [[0,0],[1,0],[0,1],[1,1],[.5,2],[0,3],[1,3],[.5,4]];
  for (let i = 0; i < squares.length; i++){
    const [sx, sy] = squares[i];
    x.strokeRect(sx * cell, sy * cell, cell, cell);
    x.fillStyle = 'rgba(243,236,215,.55)';
    x.font = '14px "Avenir Next",sans-serif';
    x.textAlign = 'center';
    x.fillText(String(i + 1), sx * cell + cell / 2, sy * cell + 16);
  }
  x.restore();

  // a few chalk scuffs and a small star
  x.strokeStyle = 'rgba(243,236,215,.3)';
  x.lineWidth = 2;
  for (let i = 0; i < 16; i++){
    const [sx, sy] = pt(rand(-1.5, 1.5), rand(-.2, 1.5));
    x.beginPath(); x.moveTo(sx, sy); x.lineTo(sx + rand(4, 18), sy + rand(-7, 7)); x.stroke();
  }
  x.save();
  x.translate(px(1.45), pz(.72));
  x.strokeStyle = 'rgba(243,236,215,.5)';
  x.lineWidth = 2;
  x.beginPath();
  for (let i = 0; i < 10; i++){
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const r = i % 2 ? 5 : 13;
    const xx = Math.cos(a) * r, yy = Math.sin(a) * r;
    if (i === 0) x.moveTo(xx, yy); else x.lineTo(xx, yy);
  }
  x.closePath(); x.stroke();
  x.restore();

  // edge wear and vignette into the glass
  const edge = x.createRadialGradient(cx, cy, S * .40, cx, cy, S * .51);
  edge.addColorStop(0, 'rgba(74,54,32,0)');
  edge.addColorStop(1, 'rgba(74,54,32,.22)');
  x.fillStyle = edge; x.fillRect(0, 0, S, S);
  return texFrom(c);
}

function makePitchPlaneTexture(){
  const W = 1024, H = 560;
  const [c, x] = canvasOf(W, H);
  const fieldW = FIELD.fx * 2;
  const fieldD = FIELD.z1 - FIELD.z0;
  const px = wx => (wx + FIELD.fx) / fieldW * W;
  const py = wz => (wz - FIELD.z0) / fieldD * H;
  const cx = W / 2, cy = H / 2;

  x.fillStyle = '#7f9c63'; x.fillRect(0, 0, W, H);
  // soft variation across the turf
  const g = x.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, 'rgba(255,248,214,.045)');
  g.addColorStop(.5, 'rgba(255,255,255,0)');
  g.addColorStop(1, 'rgba(35,52,24,.06)');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  for (let i = 0; i < 3000; i++){
    x.fillStyle = i % 3 ? 'rgba(228,239,196,.05)' : 'rgba(38,58,26,.055)';
    x.beginPath(); x.arc(rand(0, W), rand(0, H), rand(.5, 1.4), 0, TAU); x.fill();
  }

  // mowing stripes
  const stripes = 12;
  for (let i = 0; i < stripes; i++){
    if (i % 2) continue;
    x.fillStyle = 'rgba(224,235,196,.055)';
    x.fillRect(i * W / stripes, 0, W / stripes + 1, H);
  }

  // wear at the goalmouths
  for (const end of [0, W]){
    const wg = x.createRadialGradient(end, cy, 8, end, cy, W * .075);
    wg.addColorStop(0, 'rgba(197,181,131,.24)');
    wg.addColorStop(1, 'rgba(197,181,131,0)');
    x.fillStyle = wg;
    x.fillRect(end - W * .1, cy - H * .3, W * .2, H * .6);
  }
  const cg = x.createRadialGradient(cx, cy, 4, cx, cy, W * .12);
  cg.addColorStop(0, 'rgba(225,215,168,.13)');
  cg.addColorStop(1, 'rgba(225,215,168,0)');
  x.fillStyle = cg; x.fillRect(cx - W*.15, cy - H*.22, W*.3, H*.44);

  // chalk
  x.strokeStyle = 'rgba(243,236,215,.9)';
  x.lineWidth = 4;
  x.strokeRect(3, 3, W - 6, H - 6);
  // halfway line
  x.beginPath(); x.moveTo(cx, 5); x.lineTo(cx, H - 5); x.stroke();
  // centre circle
  const circleR = (FIELD.goalHalfZ + .0) * .76 / fieldW * W;
  x.beginPath(); x.arc(cx, cy, circleR, 0, TAU); x.stroke();
  x.fillStyle = 'rgba(243,236,215,.9)';
  x.beginPath(); x.arc(cx, cy, 4, 0, TAU); x.fill();

  // boxes sized around the actual goal mouth
  const goalHalf = FIELD.goalHalfZ;
  const boxHalfPx = (goalHalf + .28) / fieldD * H;
  const boxDepthPx = .32 / fieldW * W;
  const gaHalfPx = (goalHalf + .11) / fieldD * H;
  const gaDepthPx = .13 / fieldW * W;
  for (const side of [-1, 1]){
    const endX = side < 0 ? 0 : W;
    const dir = side < 0 ? 1 : -1;
    x.strokeRect(Math.min(endX, endX + dir * boxDepthPx), cy - boxHalfPx, boxDepthPx, boxHalfPx * 2);
    x.strokeRect(Math.min(endX, endX + dir * gaDepthPx), cy - gaHalfPx, gaDepthPx, gaHalfPx * 2);
    x.fillStyle = 'rgba(243,236,215,.9)';
    x.beginPath(); x.arc(endX + dir * (.26 / fieldW * W), cy, 3, 0, TAU); x.fill();
  }

  // corner arcs
  for (const sx of [0, W]) for (const sy of [0, H]){
    x.beginPath(); x.arc(sx, sy, 13, 0, TAU); x.stroke();
  }

  // small scuffs
  x.strokeStyle = 'rgba(243,236,215,.24)';
  x.lineWidth = 2;
  for (let i = 0; i < 12; i++){
    const sx = rand(20, W - 20), sy = rand(20, H - 20);
    x.beginPath(); x.moveTo(sx, sy); x.lineTo(sx + rand(4, 16), sy + rand(-6, 6)); x.stroke();
  }

  // edge shading so the pitch sits into the yard
  const edge = x.createLinearGradient(0, 0, 0, H);
  edge.addColorStop(0, 'rgba(40,54,27,.16)');
  edge.addColorStop(.12, 'rgba(40,54,27,0)');
  edge.addColorStop(.88, 'rgba(40,54,27,0)');
  edge.addColorStop(1, 'rgba(40,54,27,.12)');
  x.fillStyle = edge; x.fillRect(0, 0, W, H);
  return texFrom(c);
}

function makeFacadeTexture(){
  const W = 1024, H = 512;
  const [c, x] = canvasOf(W, H);
  x.fillStyle = '#a95f47'; x.fillRect(0, 0, W, H);
  // brick courses
  for (let row = 0; row < 30; row++){
    const y0 = row * 18;
    const off = row % 2 ? -30 : 0;
    for (let col = -1; col < 20; col++){
      const bx = col * 60 + off + 2;
      x.fillStyle = `rgba(${rand(168,199)|0},${rand(94,120)|0},${rand(74,94)|0},1)`;
      x.fillRect(bx, y0 + 2, 56, 13);
    }
  }
  // cream bands
  for (const yy of [0, 166, 332]){
    x.fillStyle = '#e7d7b8';
    x.fillRect(0, yy, W, 13);
    x.fillStyle = 'rgba(110,78,48,.16)';
    x.fillRect(0, yy + 13, W, 3);
  }
  // roof cornice
  x.fillStyle = '#e7d7b8'; x.fillRect(0, 0, W, 20);

  // windows
  const cols = [-405, -245, -85, 85, 245, 405];
  for (const rowY of [46, 210, 374]){
    for (const cx of cols){
      const wx = W / 2 + cx - 55;
      if (Math.abs(cx) < 120 && rowY === 374) continue;
      // outer frame
      x.fillStyle = '#e9dcc0';
      x.fillRect(wx - 9, rowY - 9, 128, 104);
      // glass
      const wg = x.createLinearGradient(wx, rowY, wx + 110, rowY + 84);
      wg.addColorStop(0, '#38505a');
      wg.addColorStop(.48, '#6e8a91');
      wg.addColorStop(.52, '#a9bebd');
      wg.addColorStop(1, '#4a6368');
      x.fillStyle = wg;
      x.fillRect(wx, rowY, 110, 86);
      // muntins
      x.strokeStyle = 'rgba(238,224,196,.9)';
      x.lineWidth = 4;
      x.strokeRect(wx, rowY, 110, 86);
      x.beginPath(); x.moveTo(wx + 55, rowY); x.lineTo(wx + 55, rowY + 86); x.stroke();
      x.beginPath(); x.moveTo(wx, rowY + 43); x.lineTo(wx + 110, rowY + 43); x.stroke();
      // reflection
      x.fillStyle = 'rgba(255,244,214,.16)';
      x.beginPath();
      x.moveTo(wx + 8, rowY + 70); x.lineTo(wx + 38, rowY + 8); x.lineTo(wx + 60, rowY + 8); x.lineTo(wx + 20, rowY + 80);
      x.closePath(); x.fill();
      // sill
      x.fillStyle = '#d8c6a6';
      x.fillRect(wx - 12, rowY + 91, 134, 7);
    }

function makeClockTexture(){
  const [c, x] = canvasOf(256, 256);
  x.clearRect(0, 0, 256, 256);
  x.fillStyle = '#f1e5ce';
  x.beginPath(); x.arc(128, 128, 118, 0, TAU); x.fill();
  x.strokeStyle = '#b59a6c'; x.lineWidth = 8;
  x.beginPath(); x.arc(128, 128, 112, 0, TAU); x.stroke();
  x.strokeStyle = '#6d5439'; x.lineWidth = 4;
  for (let i = 0; i < 12; i++){
    const a = i / 12 * TAU - Math.PI / 2;
    x.beginPath();
    x.moveTo(128 + Math.cos(a) * 92, 128 + Math.sin(a) * 92);
    x.lineTo(128 + Math.cos(a) * 102, 128 + Math.sin(a) * 102);
    x.stroke();
  }
  x.strokeStyle = '#4a3726'; x.lineWidth = 7; x.lineCap = 'round';
  // 10:05
  x.beginPath(); x.moveTo(128, 128); x.lineTo(128 + Math.cos(-Math.PI / 2 + (10 + 5 / 60) / 12 * TAU) * 54, 128 + Math.sin(-Math.PI / 2 + (10 + 5 / 60) / 12 * TAU) * 54); x.stroke();
  x.lineWidth = 4;
  x.beginPath(); x.moveTo(128, 128); x.lineTo(128 + Math.cos(-Math.PI / 2 + 5 / 60 * TAU) * 82, 128 + Math.sin(-Math.PI / 2 + 5 / 60 * TAU) * 82); x.stroke();
  x.fillStyle = '#4a3726'; x.beginPath(); x.arc(128, 128, 7, 0, TAU); x.fill();
  return texFrom(c);
}

function makeNetTexture(){
  const [c, x] = canvasOf(256, 256);
  x.clearRect(0, 0, 256, 256);
  x.strokeStyle = 'rgba(243,239,225,.72)';
  x.lineWidth = 2;
  for (let i = 0; i <= 256; i += 20){
    x.beginPath(); x.moveTo(i, 0); x.lineTo(i, 256); x.stroke();
    x.beginPath(); x.moveTo(0, i); x.lineTo(256, i); x.stroke();
  }
  return texFrom(c);
}

function makeBallTexture(){
  const [c, x] = canvasOf(512, 256);
  x.fillStyle = '#eee7d2'; x.fillRect(0, 0, 512, 256);
  x.fillStyle = '#2b2a26';
  const pent = (cx, cy, r, rot) => {
    x.beginPath();
    for (let i = 0; i < 5; i++){
      const a = rot + i / 5 * TAU;
      const px = cx + Math.cos(a) * r, py = cy + Math.sin(a) * r;
      if (i === 0) x.moveTo(px, py); else x.lineTo(px, py);
    }
    x.closePath(); x.fill();
  };
  pent(46, 72, 26, -.2);
  pent(170, 42, 24, .4);
  pent(300, 82, 27, .1);
  pent(438, 48, 23, -.5);
  pent(95, 190, 25, .8);
  pent(250, 202, 22, -.3);
  pent(388, 198, 26, .5);
  x.fillStyle = 'rgba(255,255,255,.28)';
  x.beginPath(); x.arc(150, 40, 36, 0, TAU); x.fill();
  return texFrom(c);
}

    varying vec3 vN;
    varying vec3 vV;
    varying vec3 vW;
    void main(){
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      vN = normalize(normalMatrix * normal);
      vV = normalize(-mv.xyz);
      vW = (modelMatrix * vec4(position, 1.0)).xyz;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vN;
    varying vec3 vV;
    varying vec3 vW;
    uniform float uFresnel;
    void main(){
      float fres = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), 2.15);
      float high = smoothstep(2.3, 4.25, vW.y);
      vec3 col = mix(vec3(.68,.82,.79), vec3(1.0,.92,.78), high);

      gl_FragColor = vec4(col, alpha);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }
  `
});

function makeYardTree(x, z, scale, tint, warm){
  const g = new THREE.Group();
  g.position.set(x, GROUND, z);
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.026 * scale, .045 * scale, .72 * scale, 7), M.wood);
  trunk.position.y = .36 * scale;
  trunk.castShadow = true;
  trunk.receiveShadow = true;
  g.add(trunk);
  for (const [bx, by, bz, rz] of [[.12,.48,.02,.5],[-.11,.55,.01,-.45],[.02,.62,-.05,.1]]){
    const branch = new THREE.Mesh(new THREE.CylinderGeometry(.012 * scale, .018 * scale, .3 * scale, 6), M.wood);
    branch.position.set(bx * scale, by * scale, bz * scale);
    branch.rotation.z = rz;
    branch.castShadow = true;
    g.add(branch);
  }
  const leafMat = std(tint, .94);
  const warmMat = std(warm, .94);
  const lobes = [
    [-.12,.78,.02,.25], [.13,.82,.01,.22], [0,.94,.02,.24],
    [-.18,.92,-.02,.18], [.17,.68,.01,.2], [.02,.76,-.13,.19]
  ];
  const leafMeshes = [];
  for (let i = 0; i < lobes.length; i++){
    const [lx, ly, lz, lr] = lobes[i];
    const leaf = new THREE.Mesh(new THREE.IcosahedronGeometry(lr * scale, 1), i === 3 ? warmMat : leafMat);
    leaf.position.set(lx * scale, ly * scale, lz * scale);
    leaf.castShadow = true;
    leaf.receiveShadow = true;
    g.add(leaf);
    leafMeshes.push(leaf);
  }
  jarRig.add(g);
  return { group: g, leaves: leafMeshes };
}

function makeGoal(side){
  const g = new THREE.Group();
  g.position.set(side * GOAL_X, GROUND, FZ);
  const width = GOAL_HALF * 2;
  for (const dz of [-GOAL_HALF, GOAL_HALF]){
    const post = new THREE.Mesh(new THREE.CylinderGeometry(.016, .018, GOAL_H, 8), goalPostMat);
    post.position.set(0, GOAL_H / 2, dz);
    post.castShadow = true;
    g.add(post);
  }
  const bar = new THREE.Mesh(new THREE.CylinderGeometry(.016, .016, width, 8), goalPostMat);
  bar.rotation.x = Math.PI / 2;
  bar.position.set(0, GOAL_H, 0);
  bar.castShadow = true;
  g.add(bar);
  const backX = side * .1;
  const back = new THREE.Mesh(new THREE.PlaneGeometry(width, GOAL_H), netMat);
  back.rotation.y = Math.PI / 2;
  back.position.set(backX, GOAL_H / 2, 0);
  g.add(back);
  for (const dz of [-GOAL_HALF, GOAL_HALF]){
    const sideNet = new THREE.Mesh(new THREE.PlaneGeometry(Math.abs(backX), GOAL_H), netMat);
    sideNet.position.set(backX / 2, GOAL_H / 2, dz);
    g.add(sideNet);
  }
  const top = new THREE.Mesh(new THREE.PlaneGeometry(width, Math.abs(backX)), netMat);
  top.rotation.x = -Math.PI / 2;
  top.position.set(backX / 2, GOAL_H, 0);
  g.add(top);
  jarRig.add(g);
  goals.push({ group: g, side, net: [back, top], pulse: 0 });
  return g;
}

function formatClock(seconds){
  const s = Math.max(0, Math.ceil(seconds));
  return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
}

function stateName(){
  if (match.status === 'play') return '比赛进行中';
  if (match.status === 'celebrate') return '进球 · 中圈开球';
  if (match.status === 'leave') return '上课铃响 · 收队';
  if (match.status === 'done') return '已回教室';
  return '课间比赛';
}

function updateHud(){
  if (ui.scoreRed.textContent !== String(match.score.red)) ui.scoreRed.textContent = String(match.score.red);
  if (ui.scoreBlue.textContent !== String(match.score.blue)) ui.scoreBlue.textContent = String(match.score.blue);
  const clock = formatClock(match.time);
  if (ui.matchTime.textContent !== clock) ui.matchTime.textContent = clock;
  ui.timeFill.style.transform = `scaleX(${clamp(match.time / match.duration, 0, 1)})`;
  const state = stateName();
  if (ui.matchState.textContent !== state) ui.matchState.textContent = state;
  const leaving = match.status === 'leave';
  const done = match.status === 'done';
  ui.bellBtn.disabled = leaving;
  ui.bellBtn.textContent = leaving ? '收队中…' : done ? '再打一场' : '打上课铃';
  if (match.status === 'play' && !ui.hintNote.dataset.base){
    ui.hintNote.dataset.base = '1';
  }
}

function nearestToBall(team, includeKeeper = false){
  let best = null, bd = Infinity;
  for (const p of players){
    if (p.state !== 'play' || p.team !== team) continue;
    if (p.isKeeper && !includeKeeper && Math.abs(ball.pos.x) < FIELD.fx - .35) continue;
    const dx = p.root.position.x - ball.pos.x;
    const dz = p.root.position.z - ball.pos.z;
    const d = Math.hypot(dx, dz);
    if (d < bd){ bd = d; best = p; }
  }
  return best;
}

function attackDir(p){
  return p.team === 'red' ? 1 : -1;
}

function kickBall(p, tx, tz, speed, isShot = false){
  const fwdX = Math.sin(p.root.rotation.y);
  const fwdZ = Math.cos(p.root.rotation.y);
  ball.owner = null;
  ball.pos.set(
    p.root.position.x + fwdX * .065,
    GROUND + BALL_R,
    p.root.position.z + fwdZ * .065
  );
  const dx = tx - ball.pos.x;
  const dz = tz - ball.pos.z;
  const d = Math.hypot(dx, dz) || 1;
  ball.vel.set(dx / d * speed, 0, dz / d * speed);
  ball.noTouch = isShot ? .2 : .15;
  ball.isShot = isShot;
  ball.saveResolved = false;
  ball.lastKicker = p;
  p.decision = rand(.32, .7);
  p.shootCooldown = isShot ? 1.25 : .55;
  emitDust(p.root.position.x, p.root.position.z, isShot ? 7 : 3);
  playKick(isShot ? .9 : .4);
}

function shootBall(p){
  const side = attackDir(p);
  const tz = FZ + rand(-GOAL_HALF * .48, GOAL_HALF * .48);
  kickBall(p, side * GOAL_X, tz, rand(1.45, 1.7), true);
}

function passBall(p){
  let best = null, bestScore = -Infinity;
  const dir = attackDir(p);
  for (const q of players){
    if (q === p || q.team !== p.team || q.state !== 'play' || q.isKeeper) continue;
    const ahead = (q.root.position.x - p.root.position.x) * dir;
    const dz = Math.abs(q.root.position.z - p.root.position.z);
    const score = ahead * .75 - dz * .5 + (q.role === 'FW' ? .25 : 0) + rand(0, .25);
    if (score > bestScore){ bestScore = score; best = q; }
  }
  if (!best) return false;
  kickBall(p, best.root.position.x + attackDir(p) * .1, best.root.position.z, rand(.96, 1.18), false);
  return true;
}

function clearBall(p){
  const dir = attackDir(p);
  const targetZ = FZ + rand(-.32, .32);
  kickBall(p, p.root.position.x + dir * 1.1, targetZ, rand(1.0, 1.3), false);
}

// Match update

const _targets = { x: 0, z: 0 };
const roles = { redChaser: null, blueChaser: null, redPress: null, bluePress: null, timer: 0 };

function nearestPlayerTo(team, x, z, includeKeeper = false){
  let best = null, bd = Infinity;
  for (const p of players){
    if (p.team !== team || p.state !== 'play') continue;
    if (p.isKeeper && !includeKeeper) continue;
    const d = Math.hypot(p.root.position.x - x, p.root.position.z - z);
    if (d < bd){ bd = d; best = p; }
  }
  return best;
}

// Lightweight steering: seek/arrive for the current role, plus a small
// separation field so the ten kids keep a little personal space.
function separationFor(p, radius = .14){
  let sx = 0, sz = 0;
  for (const q of players){
    if (q === p || q.state !== 'play') continue;
    let dx = p.root.position.x - q.root.position.x;
    let dz = p.root.position.z - q.root.position.z;
    const d = Math.hypot(dx, dz);
    if (d > .0001 && d < radius){
      const w = (radius - d) / radius;
      sx += dx / d * w;
      sz += dz / d * w;
    }
  }
  return [sx, sz];
}

function steerPlayer(p, tx, tz, dt, maxSpeed, allowOut = false, avoid = true, accel = 8){
  const dx = tx - p.root.position.x;
  const dz = tz - p.root.position.z;
  const dist = Math.hypot(dx, dz);
  let desiredX = 0, desiredZ = 0;
  if (dist > .004){
    const arrive = Math.min(1, dist / .09);
    desiredX = dx / dist * maxSpeed * arrive;
    desiredZ = dz / dist * maxSpeed * arrive;
  }
  if (avoid){
    const [sx, sz] = separationFor(p);
    desiredX += sx * maxSpeed * .72;
    desiredZ += sz * maxSpeed * .72;
  }
  let ds = Math.hypot(desiredX, desiredZ);
  if (ds > maxSpeed){
    desiredX *= maxSpeed / ds;
    desiredZ *= maxSpeed / ds;
  }
  const k = 1 - Math.exp(-dt * accel);
  p.vx += (desiredX - p.vx) * k;
  p.vz += (desiredZ - p.vz) * k;
  p.root.position.x += p.vx * dt;
  p.root.position.z += p.vz * dt;
  if (!allowOut){
    const minX = -FX - .1, maxX = FX + .1;
    const minZ = FZ - FZ_HALF - .09, maxZ = FZ + FZ_HALF + .09;
    if (p.root.position.x < minX){ p.root.position.x = minX; if (p.vx < 0) p.vx = 0; }
    else if (p.root.position.x > maxX){ p.root.position.x = maxX; if (p.vx > 0) p.vx = 0; }
    if (p.root.position.z < minZ){ p.root.position.z = minZ; if (p.vz < 0) p.vz = 0; }
    else if (p.root.position.z > maxZ){ p.root.position.z = maxZ; if (p.vz > 0) p.vz = 0; }
  }
  const speed = Math.hypot(p.vx, p.vz);
  let targetYaw;
  if (speed > .025){
    targetYaw = Math.atan2(p.vx, p.vz);
  } else {
    targetYaw = Math.atan2(ball.pos.x - p.root.position.x, ball.pos.z - p.root.position.z);
  }
  const diff = Math.atan2(Math.sin(targetYaw - p.root.rotation.y), Math.cos(targetYaw - p.root.rotation.y));
  p.root.rotation.y += diff * Math.min(1, dt * (speed > .025 ? 10 : 3.5));
  p.moveSpeed = speed;
  if (speed > .02) p.walkPhase += dt * (3 + speed * 22);
  else p.walkPhase += dt * .8;
}

function distToBall(p){
  return Math.hypot(p.root.position.x - ball.pos.x, p.root.position.z - ball.pos.z);
}

function updateRoles(){
  const owner = ball.owner;
  if (owner && owner.state === 'play'){
    roles.redChaser = roles.blueChaser = null;
    const oppTeam = owner.team === 'red' ? 'blue' : 'red';
    let press = nearestPlayerTo(oppTeam, owner.root.position.x, owner.root.position.z, false);
    const prev = oppTeam === 'red' ? roles.redPress : roles.bluePress;
    if (prev && prev.state === 'play' && press){
      const dPrev = Math.hypot(prev.root.position.x - owner.root.position.x, prev.root.position.z - owner.root.position.z);
      const dNew = Math.hypot(press.root.position.x - owner.root.position.x, press.root.position.z - owner.root.position.z);
      if (dPrev <= dNew + .16) press = prev;
    }
    if (oppTeam === 'red'){ roles.redPress = press; roles.bluePress = null; }
    else { roles.bluePress = press; roles.redPress = null; }
  } else {
    roles.redPress = roles.bluePress = null;
    let red = nearestToBall('red');
    let blue = nearestToBall('blue');
    if (roles.redChaser && roles.redChaser.state === 'play' && red){
      if (distToBall(roles.redChaser) <= distToBall(red) + .18) red = roles.redChaser;
    }
    if (roles.blueChaser && roles.blueChaser.state === 'play' && blue){
      if (distToBall(roles.blueChaser) <= distToBall(blue) + .18) blue = roles.blueChaser;
    }
    roles.redChaser = red;
    roles.blueChaser = blue;
  }
}

function updatePlayerForms(dt, time){
  if (match.status === 'celebrate' || match.status === 'leave' || match.status === 'done'){
    for (const p of players){
      if (match.status === 'leave' && p.root.visible){
        steerPlayer(p, p.exitX, p.exitZ, dt, .66, true, false, 10);
        if (Math.hypot(p.root.position.x - p.exitX, p.root.position.z - p.exitZ) < .075){
          p.root.visible = false;
          p.inside = true;
          p.vx = p.vz = 0;
          emitDust(p.root.position.x, p.root.position.z, 2);
        }
      } else if (match.status === 'celebrate'){
        p.vx *= Math.exp(-dt * 7);
        p.vz *= Math.exp(-dt * 7);
        p.root.position.x += p.vx * dt;
        p.root.position.z += p.vz * dt;
        p.moveSpeed *= Math.exp(-dt * 8);
      }
    }
    if (match.status === 'leave'){
      const left = players.some(p => p.root.visible) || spectators.some(sp => sp.root.visible);
      if (!left){
        match.status = 'done';
        ui.hintNote.textContent = '球留在白线边，风替他们数着秒。';
        updateHud();
        drawBoard();
        showToast('教室门关上，操场安静了。', false, 1900);
      }
    }
    return;
  }

  roles.timer -= dt;
  if (roles.timer <= 0){
    updateRoles();
    roles.timer = .3;
  }

  const owner = ball.owner;
  for (const p of players){
    if (p.state !== 'play') continue;
    p.shootCooldown = Math.max(0, p.shootCooldown - dt);
    p.tackleCooldown = Math.max(0, p.tackleCooldown - dt);
    p.reaction = Math.max(0, p.reaction - dt);
    p.stumble = Math.max(0, p.stumble - dt);
    const dir = attackDir(p);
    const speedScale = p.stumble > 0 ? .35 : 1;
    let tx, tz, maxSpeed = .25, accel = 7;

    if (p.isKeeper){
      const lineX = p.team === 'red' ? -KEEPER_X : KEEPER_X;
      tx = lineX;
      tz = clamp(ball.pos.z + ball.vel.z * .1, FZ - GOAL_HALF + .04, FZ + GOAL_HALF - .04);
      if (ball.owner && ball.owner.team !== p.team && Math.abs(ball.pos.x) < FX - .18){
        tz = clamp(ball.pos.z, FZ - .28, FZ + .28);
      }
      maxSpeed = .29;
      accel = 8;
      if (owner === p){
        p.decision -= dt;
        if (p.decision <= 0) clearBall(p);
      }
    } else if (owner === p){
      let avoidZ = 0;
      for (const q of players){
        if (q.team === p.team || q.state !== 'play') continue;
        const dx = q.root.position.x - p.root.position.x;
        const dz = q.root.position.z - p.root.position.z;
        const d = Math.hypot(dx, dz);
        if (d < .38) avoidZ -= Math.sign(dz || 1) * (.38 - d) * .45;
      }
      const goalZ = clamp(FZ + Math.sin(time * 1.2 + p.phase) * .07 + avoidZ, FZ - GOAL_HALF + .04, FZ + GOAL_HALF - .04);
      tx = dir * (GOAL_X - .09);
      tz = goalZ;
      maxSpeed = .34;
      p.decision -= dt;
      if (p.decision <= 0){
        const goalDist = Math.abs(ball.pos.x - dir * GOAL_X);
        if (goalDist < .44 && Math.abs(ball.pos.z - FZ) < GOAL_HALF + .08 && Math.random() < .4){
          shootBall(p);
        } else if (Math.random() < .62 && passBall(p)){
          // pass
        } else {
          p.decision = rand(.35, .7);
        }
      }
    } else if (owner){
      const sameTeam = owner.team === p.team;
      if (!sameTeam && p === (p.team === 'red' ? roles.redPress : roles.bluePress)){
        tx = owner.root.position.x + owner.vx * .1 - dir * .06;
        tz = owner.root.position.z + owner.vz * .1;
        maxSpeed = .41;
        accel = 8.5;
      } else {
        const push = sameTeam ? dir * .12 : -dir * .12;
        tx = p.home.x + push + ball.pos.x * .04;
        tz = p.home.z + (ball.pos.z - FZ) * .12;
        maxSpeed = sameTeam ? .26 : .27;
      }
    } else {
      const chaser = p.team === 'red' ? roles.redChaser : roles.blueChaser;
      if (p === chaser){
        tx = ball.pos.x + ball.vel.x * .12;
        tz = ball.pos.z + ball.vel.z * .12;
        maxSpeed = .46;
        accel = 9;
      } else {
        tx = p.home.x + dir * .06 + ball.pos.x * .05;
        tz = p.home.z + (ball.pos.z - FZ) * .12;
        maxSpeed = .25;
      }
    }

    steerPlayer(p, tx, tz, dt, maxSpeed * speedScale, false, true, accel);
  }

  if (owner && owner.state === 'play'){
    for (const p of players){
      if (p.team === owner.team || p.state !== 'play' || p.tackleCooldown > 0) continue;
      const d = Math.hypot(p.root.position.x - owner.root.position.x, p.root.position.z - owner.root.position.z);
      if (d < .095 && Math.random() < dt * 1.4){
        ball.owner = p;
        p.decision = rand(.18, .35);
        p.tackleCooldown = .85;
        owner.stumble = .25;
        owner.tackleCooldown = .5;
        playKick(.28);
        emitDust(owner.root.position.x, owner.root.position.z, 2);
        break;
      }
    }
  }
}

function updateBall(dt){
  if (ball.owner && (ball.owner.state !== 'play' || match.status !== 'play')){
    ball.owner = null;
    ball.vel.set(0, 0, 0);
  }
  if (match.status !== 'play'){
    ball.vel.multiplyScalar(1 - Math.min(.9, dt * 2));
    if (ball.owner) ball.owner = null;
  }
  ball.isShot = ball.isShot && Math.hypot(ball.vel.x, ball.vel.z) > .35;
  if (ball.owner){
    const p = ball.owner;
    const fwdX = Math.sin(p.root.rotation.y);
    const fwdZ = Math.cos(p.root.rotation.y);
    ball.pos.set(
      p.root.position.x + fwdX * .072,
      GROUND + BALL_R,
      p.root.position.z + fwdZ * .072
    );
    ballMesh.rotation.x += p.moveSpeed * dt * 8.5;
    return;
  }

  ball.noTouch = Math.max(0, ball.noTouch - dt);
  ball.pos.x += ball.vel.x * dt;
  ball.pos.z += ball.vel.z * dt;
  ball.pos.y = GROUND + BALL_R;
  const drag = Math.max(0, 1 - dt * 2.1);
  ball.vel.x *= drag;
  ball.vel.z *= drag;
  const speed = Math.hypot(ball.vel.x, ball.vel.z);
  if (speed > .01){
    ballMesh.rotation.x += speed * dt / BALL_R * .55;
    ballMesh.rotation.z += speed * dt / BALL_R * .09;
  }

  if (match.status === 'play'){
    // a keeper can come and smother a shot before it crosses the line
    if (ball.isShot && !ball.saveResolved){
      let keeperSave = null, saveDist = .2;
      for (const p of players){
        if (!p.isKeeper || p.state !== 'play' || p === ball.lastKicker) continue;
        const d = Math.hypot(p.root.position.x - ball.pos.x, p.root.position.z - ball.pos.z);
        if (d < saveDist){ saveDist = d; keeperSave = p; }
      }
      if (keeperSave && Math.abs(ball.pos.x) > .68){
        ball.saveResolved = true;
        if (Math.random() < .82){
          ball.owner = keeperSave;
          ball.vel.set(0, 0, 0);
          ball.noTouch = .15;
          ball.isShot = false;
          keeperSave.decision = rand(.4, .65);
          playKick(.3);
          return;
        } else {
          ball.vel.z += rand(-.22, .22);
        }
      }
    }

    if (ball.pos.x > GOAL_X && Math.abs(ball.pos.z - FZ) < GOAL_HALF){
      scoreGoal('red', 1);
      return;
    }
    if (ball.pos.x < -GOAL_X && Math.abs(ball.pos.z - FZ) < GOAL_HALF){
      scoreGoal('blue', -1);
      return;
    }
  }

  const zMin = FZ - FZ_HALF + .02;
  const zMax = FZ + FZ_HALF - .02;
  if (ball.pos.z < zMin){ ball.pos.z = zMin; ball.vel.z = Math.abs(ball.vel.z) * .35; }
  else if (ball.pos.z > zMax){ ball.pos.z = zMax; ball.vel.z = -Math.abs(ball.vel.z) * .35; }
  if (ball.pos.x > GOAL_X + .1){ ball.pos.x = GOAL_X + .1; ball.vel.x = -Math.abs(ball.vel.x) * .32; }
  else if (ball.pos.x < -GOAL_X - .1){ ball.pos.x = -GOAL_X - .1; ball.vel.x = Math.abs(ball.vel.x) * .32; }

  if (match.status === 'play' && ball.noTouch <= 0){
    let best = null, bd = .125;
    let keeperBest = null, kd = .155;
    for (const p of players){
      if (p.state !== 'play') continue;
      const d = Math.hypot(p.root.position.x - ball.pos.x, p.root.position.z - ball.pos.z);
      if (p.isKeeper){
        if (d < kd){ kd = d; keeperBest = p; }
      } else if (d < bd){
        bd = d; best = p;
      }
    }
    if (keeperBest && (!best || kd < bd + .02)){
      best = keeperBest;
      bd = kd;
    }
    if (best){
      ball.owner = best;
      ball.vel.set(0, 0, 0);
      best.decision = best.isKeeper ? rand(.35, .55) : rand(.24, .5);
      ball.noTouch = .1;
      playKick(.22);
    }
  }
}

function updateMatches(dt, time){
  if (match.status === 'play'){
    match.time = Math.max(0, match.time - dt);
    if (match.time <= 0){
      ringBell();
      updateHud();
      return;
    }
  }

  if (match.status === 'celebrate'){
    match.celebrate -= dt;
    if (match.celebrate <= 0){
      resetKickoff();
      return;
    }
  }

  updatePlayerForms(dt, time);
  updateBall(dt);
  updateHud();

  match.boardClock -= dt;
  if (match.boardClock <= 0){
    match.boardClock = .4;
    drawBoard();
  }
}

function updateMatchVisuals(dt, time){
  for (const p of players){
    if (!p.root.visible) continue;
    const speed = p.moveSpeed;
    const runTarget = speed > .03 ? 1 : 0;
    p.runBlend += (runTarget - p.runBlend) * Math.min(1, dt * 8);
    const swing = Math.sin(p.walkPhase) * (.035 + .585 * p.runBlend);
    p.legs[0].rotation.x = swing;
    p.legs[1].rotation.x = -swing;
    p.arms[0].rotation.x = -swing * .72;
    p.arms[1].rotation.x = swing * .72;
    const bob = Math.abs(Math.sin(p.walkPhase)) * (.0025 + .0055 * p.runBlend);
    const celebrateJump = match.status === 'celebrate' && p.scoring ? Math.max(0, Math.sin(time * 9 + p.phase)) * .035 : 0;
    const reactionJump = p.reaction > 0 ? Math.max(0, Math.sin(p.reaction * 15)) * .028 : 0;
    p.body.position.y = bob + celebrateJump + reactionJump;
    p.body.rotation.x = -.07 * p.runBlend;
    p.body.rotation.z = Math.sin(p.walkPhase) * .025 * p.runBlend;
    let headYaw, headPitch;
    if (p.isKeeper && match.status === 'play'){
      headYaw = clamp((ball.pos.x - p.root.position.x) * .9, -.5, .5);
      headPitch = clamp((ball.pos.z - p.root.position.z) * -.5, -.35, .35);
    } else {
      const lookYaw = Math.atan2(ball.pos.x - p.root.position.x, ball.pos.z - p.root.position.z) - p.root.rotation.y;
      headYaw = Math.atan2(Math.sin(lookYaw), Math.cos(lookYaw)) * .35;
      headPitch = Math.sin(time * 1.2 + p.phase) * .03;
    }
    p.headPivot.rotation.y += (headYaw - p.headPivot.rotation.y) * Math.min(1, dt * 6);
    p.headPivot.rotation.x += (headPitch - p.headPivot.rotation.x) * Math.min(1, dt * 5);
  }

  for (const g of goals){
    if (g.pulse > 0){
      g.pulse = Math.max(0, g.pulse - dt * 1.8);
      const k = Math.sin(g.pulse * 19) * g.pulse;
      for (const net of g.net){
        net.scale.setScalar(1 + k * .035);
      }
    }
  }

  bellPivot.rotation.z = match.bell > 0 ? Math.sin(time * 17) * .32 * Math.min(1, match.bell) : 0;
  if (match.bell > 0) match.bell = Math.max(0, match.bell - dt * .9);
}

const DUST_COUNT = 40;
const dustGeo = new THREE.BoxGeometry(1, 1, 1);
const dustInst = new THREE.InstancedMesh(dustGeo, std(0xd8c49d, 1), DUST_COUNT);
dustInst.frustumCulled = false;
jarRig.add(dustInst);
const dust = [];
for (let i = 0; i < DUST_COUNT; i++){
  dust.push({ life: 0, maxLife: 1, x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, size: 0 });
  dummy.position.set(0, -10, 0);
  dummy.scale.setScalar(0);
  dummy.updateMatrix();
  dustInst.setMatrixAt(i, dummy.matrix);
}
let dustCursor = 0;
function emitDust(x, z, count = 3){
  for (let i = 0; i < count; i++){
    const d = dust[dustCursor++ % DUST_COUNT];
    const a = rand(0, TAU);
    d.life = d.maxLife = rand(.28, .55);
    d.x = x + rand(-.03, .03);
    d.y = GROUND + .015;
    d.z = z + rand(-.03, .03);
    const s = rand(.06, .18);
    d.vx = Math.cos(a) * s;
    d.vy = rand(.05, .16);
    d.vz = Math.sin(a) * s;
    d.size = rand(.006, .015);
  }
}
function updateDust(dt){
  for (let i = 0; i < DUST_COUNT; i++){
    const d = dust[i];
    if (d.life > 0){
      d.life -= dt;
      d.vy -= .18 * dt;
      d.x += d.vx * dt; d.y += d.vy * dt; d.z += d.vz * dt;
      const k = Math.max(0, d.life / d.maxLife);
      dummy.position.set(d.x, d.y, d.z);
      dummy.scale.setScalar(d.size * k);
      dummy.rotation.set(0, 0, 0);
    } else {
      dummy.position.set(0, -10, 0);
      dummy.scale.setScalar(0);
    }
    dummy.updateMatrix();
    dustInst.setMatrixAt(i, dummy.matrix);
  }
  dustInst.instanceMatrix.needsUpdate = true;
}

// -------------------------------------------------------------------------
// Sound: playground hush, whistle, kick, cheer and the class bell
// -------------------------------------------------------------------------

const Sound = { ctx: null, master: null, ambient: null, on: true, lastKick: 0, birdTimer: 0 };

function makeNoiseBuffer(ctx, seconds = 2){
  const buffer = ctx.createBuffer(1, Math.floor(ctx.sampleRate * seconds), ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * .62;
  return buffer;
}

function ensureAudio(){
  if (!Sound.ctx){
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    const ctx = new Ctx();
    const master = ctx.createGain();
    master.gain.value = Sound.on ? .58 : 0;
    master.connect(ctx.destination);

    const src = ctx.createBufferSource();
    src.buffer = makeNoiseBuffer(ctx, 3);
    src.loop = true;
    const low = ctx.createBiquadFilter();
    low.type = 'lowpass';
    low.frequency.value = 520;
    low.Q.value = .18;
    const amb = ctx.createGain();
    amb.gain.value = .05;
    const lfo = ctx.createOscillator();
    lfo.frequency.value = .11;
    const lfoGain = ctx.createGain();
    lfoGain.gain.value = .018;
    lfo.connect(lfoGain).connect(amb.gain);
    src.connect(low).connect(amb).connect(master);
    src.start();
    lfo.start();

    Sound.ctx = ctx;
    Sound.master = master;
    Sound.ambient = amb;
    Sound.birdTimer = setInterval(() => {
      if (Sound.ctx && Sound.on && Math.random() < .55) chirp();
    }, 4600);
  }
  if (Sound.ctx.state === 'suspended') Sound.ctx.resume();
  return Sound.ctx;
}

function soundGain(value){
  const ctx = Sound.ctx;
  if (!ctx) return null;
  const g = ctx.createGain();
  g.gain.value = value;
  g.connect(Sound.master);
  return g;
}

function chirp(){
  const ctx = Sound.ctx;
  if (!ctx || !Sound.on) return;
  const now = ctx.currentTime;
  for (let i = 0; i < 2; i++){
    const t = now + i * .16;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(2300 + rand(-120, 120), t);
    osc.frequency.exponentialRampToValueAtTime(3300 + rand(-120, 160), t + .07);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(.009, t + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t + .14);
    osc.connect(g).connect(Sound.master);
    osc.start(t);
    osc.stop(t + .16);
  }
}

function playKick(force = .4){
  const ctx = ensureAudio();
  if (!ctx || !Sound.on) return;
  const now = ctx.currentTime;
  if (now - Sound.lastKick < .055) return;
  Sound.lastKick = now;
  const noise = ctx.createBufferSource();
  noise.buffer = makeNoiseBuffer(ctx, .16);
  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 640;
  const ng = ctx.createGain();
  ng.gain.setValueAtTime(.12 * force, now);
  ng.gain.exponentialRampToValueAtTime(.0001, now + .1);
  noise.connect(lp).connect(ng).connect(Sound.master);
  noise.start(now);
  noise.stop(now + .12);

  const thump = ctx.createOscillator();
  const tg = ctx.createGain();
  thump.type = 'sine';
  thump.frequency.setValueAtTime(95, now);
  thump.frequency.exponentialRampToValueAtTime(54, now + .09);
  tg.gain.setValueAtTime(.08 * force, now);
  tg.gain.exponentialRampToValueAtTime(.0001, now + .1);
  thump.connect(tg).connect(Sound.master);
  thump.start(now);
  thump.stop(now + .11);
}

function playWhistle(volume = .5, duration = .45){
  const ctx = ensureAudio();
  if (!ctx || !Sound.on) return;
  const now = ctx.currentTime;
  const out = ctx.createGain();
  out.gain.setValueAtTime(0, now);
  out.gain.linearRampToValueAtTime(.075 * volume, now + .015);
  out.gain.setValueAtTime(.075 * volume, now + duration * .7);
  out.gain.exponentialRampToValueAtTime(.0001, now + duration);
  out.connect(Sound.master);
  const osc = ctx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(2240, now);
  osc.frequency.linearRampToValueAtTime(2580, now + duration * .25);
  osc.frequency.linearRampToValueAtTime(2320, now + duration);
  const trem = ctx.createOscillator();
  trem.frequency.value = 29;
  const tremGain = ctx.createGain();
  tremGain.gain.value = 40;
  trem.connect(tremGain).connect(osc.frequency);
  osc.connect(out);
  osc.start(now);
  trem.start(now);
  osc.stop(now + duration + .02);
  trem.stop(now + duration + .02);
}

function playCheer(){
  const ctx = ensureAudio();
  if (!ctx || !Sound.on) return;
  const now = ctx.currentTime;
  const src = ctx.createBufferSource();
  src.buffer = makeNoiseBuffer(ctx, .9);
  const bp = ctx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = 980;
  bp.Q.value = .7;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(.09, now + .08);
  g.gain.exponentialRampToValueAtTime(.0001, now + .8);
  src.connect(bp).connect(g).connect(Sound.master);
  src.start(now);
  src.stop(now + .85);
}

function playBell(){
  const ctx = ensureAudio();
  if (!ctx || !Sound.on) return;
  const now = ctx.currentTime;

  const out = ctx.createGain();
  out.gain.setValueAtTime(0, now);
  out.gain.linearRampToValueAtTime(.16, now + .025);
  out.gain.setValueAtTime(.16, now + 1.35);
  out.gain.exponentialRampToValueAtTime(.0001, now + 2.15);
  out.connect(Sound.master);

  const trem = ctx.createGain();
  trem.gain.value = .55;
  trem.connect(out);
  const lfo = ctx.createOscillator();
  lfo.frequency.value = 18;
  const depth = ctx.createGain();
  depth.gain.value = .38;
  lfo.connect(depth).connect(trem.gain);

  for (const [freq, type, vol] of [[1046, 'triangle', .6], [1568, 'sine', .35], [2093, 'sine', .18]]){
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    g.gain.value = vol;
    osc.connect(g).connect(trem);
    osc.start(now);
    osc.stop(now + 2.18);
  }
  lfo.start(now);
  lfo.stop(now + 2.18);
}

function toggleSound(){
  ensureAudio();
  Sound.on = !Sound.on;
  ui.soundBtn.textContent = Sound.on ? '开' : '关';
  ui.soundBtn.setAttribute('aria-pressed', String(Sound.on));
  ui.soundBtn.classList.toggle('is-on', Sound.on);
  if (Sound.ctx){
    const now = Sound.ctx.currentTime;
    Sound.master.gain.cancelScheduledValues(now);
    Sound.master.gain.setTargetAtTime(Sound.on ? .58 : 0, now, .08);
  }
}
ui.soundBtn.classList.add('is-on');
ui.soundBtn.addEventListener('click', (e) => {
  e.preventDefault();
  toggleSound();
});

window.addEventListener('pointerdown', () => ensureAudio(), { once: true });
window.addEventListener('keydown', () => ensureAudio(), { once: true });

ui.bellBtn.addEventListener('click', (e) => {
  e.preventDefault();
  ensureAudio();
  if (match.status === 'done') resetMatch();
  else ringBell();
});

function updateCamera(dt){

    view.tAz += autoDriftDir * dt * .018;
    if (view.tAz > .58){ view.tAz = .58; autoDriftDir = -1; }
    else if (view.tAz < -.58){ view.tAz = -.58; autoDriftDir = 1; }
  }
  const k = 1 - Math.pow(.0016, dt);
  view.az = lerp(view.az, view.tAz, k);
  view.polar = lerp(view.polar, view.tPolar, k);
  view.dist = lerp(view.dist, view.tDist, k);
  const sp = Math.sin(view.polar);
  camera.position.set(
    target.x + Math.sin(view.az) * sp * view.dist,
    target.y + Math.cos(view.polar) * view.dist,
    target.z + Math.cos(view.az) * sp * view.dist
  );
  camera.lookAt(target);
}

function applyHomeView(snap = false){
  const narrow = window.innerWidth / window.innerHeight < .82;
  target.set(0, narrow ? 1.82 : 1.92, narrow ? .12 : 0);
  view.tAz = .04;
  view.tPolar = narrow ? 1.27 : 1.3;
  view.tDist = narrow ? 8.9 : 8.1;
  if (snap){
    view.az = .04;
    view.polar = view.tPolar;
    view.dist = view.tDist;
  }
}

function pickScene(clientX, clientY){
  const rect = canvas.getBoundingClientRect();
  pointerNDC.set(
    ((clientX - rect.left) / rect.width) * 2 - 1,
    -((clientY - rect.top) / rect.height) * 2 + 1
  );
  raycaster.setFromCamera(pointerNDC, camera);
  const hits = raycaster.intersectObjects(clickables, false);
  if (!hits.length) return;
  const data = hits[0].object.userData;
  if (data.spectator){
    const sp = data.spectator;
    if (sp.root.visible){
      sp.reaction = 1.25;
      sp.cheer = 1.45;
      showToast(sp.def.say || `${sp.def.girl ? '女同学' : '同学'}在场边挥了挥手。`, false, 1400);
    }
  } else if (data.player){
    const p = data.player;
    if (p.state === 'play' || match.status === 'celebrate'){
      p.reaction = .9;
      p.decision = Math.max(p.decision, .25);
      emitDust(p.root.position.x, p.root.position.z, 2);
      playWhistle(.22, .18);
    }
  } else if (data.bell){
    ensureAudio();
    ringBell();
  } else if (data.board){
    showToast(`黑板：红队 ${match.score.red} : ${match.score.blue} 蓝队 · ${formatClock(match.time)}`, false, 1400);
  } else if (data.ball){
    if (match.status === 'play'){
      ball.owner = null;
      ball.vel.set(rand(-.85, .85), 0, rand(-.85, .85));
      ball.noTouch = .18;
      ball.isShot = false;
      ball.saveResolved = true;
      ball.lastKicker = null;
      emitDust(ball.pos.x, ball.pos.z, 2);
      playKick(.5);
    }
  }
}

canvas.addEventListener('pointerdown', (e) => {
  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  noteInteraction();
  if (activePointers.size === 1){
    dragging = true;
    pointerDown = true;
    pointerStartAt = performance.now();
    pointerTravel = 0;
    pinched = false;
    prevPointer = { x: e.clientX, y: e.clientY };
    canvas.classList.add('dragging');
  } else {
    dragging = false;
    pinched = true;
    pointerDown = false;
    const pts = [...activePointers.values()];
    pinchStart = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    pinchBase = view.tDist;
  }
});
canvas.addEventListener('pointermove', (e) => {
  if (!activePointers.has(e.pointerId)) return;
  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (activePointers.size >= 2){
    const pts = [...activePointers.values()];
    const sep = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    if (pinchStart > 0 && sep > 4) view.tDist = clamp(pinchBase * (pinchStart / sep), 5.1, 10.8);
    noteInteraction();
    return;
  }
  if (!dragging) return;
  const dx = e.clientX - prevPointer.x;
  const dy = e.clientY - prevPointer.y;
  prevPointer = { x: e.clientX, y: e.clientY };
  pointerTravel += Math.abs(dx) + Math.abs(dy);
  view.tAz = clamp(view.tAz - dx * .0046, -.62, .62);
  view.tPolar = clamp(view.tPolar - dy * .0032, .91, 1.43);
  noteInteraction();
});
function endPointer(e, allowClick){
  const was = dragging;
  const canClick = pointerDown && pointerTravel < 8 && performance.now() - pointerStartAt < 560;
  activePointers.delete(e.pointerId);
  try {
    if (canvas.hasPointerCapture?.(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
  } catch (err) {}
  if (activePointers.size === 0){
    if (allowClick && was && canClick && !pinched) pickScene(e.clientX, e.clientY);
    dragging = false;
    pointerDown = false;
    pinched = false;
    canvas.classList.remove('dragging');
  } else if (activePointers.size === 1){
    const pt = [...activePointers.values()][0];
    prevPointer = { x: pt.x, y: pt.y };
    pointerDown = false;
    dragging = true;
    pointerTravel = 99;
  }
  noteInteraction();
}
canvas.addEventListener('pointerup', (e) => endPointer(e, true));
canvas.addEventListener('pointercancel', (e) => endPointer(e, false));
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  view.tDist = clamp(view.tDist * Math.exp(e.deltaY * .00105), 5.1, 10.8);
  noteInteraction();
}, { passive: false });
canvas.addEventListener('dblclick', (e) => {
  e.preventDefault();
  applyHomeView();
  noteInteraction();
});
canvas.addEventListener('contextmenu', e => e.preventDefault());

ui.homeBtn.addEventListener('click', () => {
  applyHomeView();
  noteInteraction();
});

function onResize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w < 700 ? 42 : 34;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
  if (w < 700 && Math.abs(view.tDist - HOME.dist) < .18){
    target.set(0, 1.82, .12);
    view.tDist = view.dist = 8.9;
    view.tPolar = view.polar = 1.27;
  }
}
window.addEventListener('resize', onResize);

// -------------------------------------------------------------------------
// Sky, swallows, motes, glass
// -------------------------------------------------------------------------

function updateSpectators(dt, time){
  for (const sp of spectators){
    if (!sp.root.visible) continue;
    if (match.status === 'leave'){
      const tx = sp.baseX * .16;
      const tz = -.8;
      const dx = tx - sp.root.position.x;
      const dz = tz - sp.root.position.z;
      const d = Math.hypot(dx, dz);
      if (d < .055){
        sp.root.visible = false;
        continue;
      }
      const step = Math.min(d, .62 * dt);
      sp.root.position.x += dx / d * step;
      sp.root.position.z += dz / d * step;
      sp.root.rotation.y = Math.atan2(dx, dz);
      sp.walkPhase += dt * 9;
      sp.legs[0].rotation.x = Math.sin(sp.walkPhase) * .5;
      sp.legs[1].rotation.x = -Math.sin(sp.walkPhase) * .5;
      sp.body.position.y = Math.abs(Math.sin(sp.walkPhase)) * .006;
      continue;
    }
    if (match.status === 'done') continue;
    sp.reaction = Math.max(0, sp.reaction - dt);
    sp.cheer = Math.max(0, sp.cheer - dt);
    const excited = sp.cheer > 0 || sp.reaction > 0;
    const jump = excited ? Math.max(0, Math.sin(time * 10 + sp.phase)) * .032 : 0;
    sp.body.position.y = jump + Math.sin(time * 1.1 + sp.phase) * .003;
    sp.body.rotation.z = excited ? Math.sin(time * 8 + sp.phase) * .045 : Math.sin(time * .8 + sp.phase) * .018;
    const wave = excited ? 2.25 + Math.sin(time * 12 + sp.phase) * .18 : .07;
    sp.arms[0].rotation.z = -wave;
    sp.arms[1].rotation.z = wave;
    sp.arms[0].rotation.x = excited ? Math.sin(time * 11 + sp.phase) * .16 : 0;
    sp.arms[1].rotation.x = excited ? -Math.sin(time * 11 + sp.phase) * .16 : 0;
    sp.legs[0].rotation.x = 0;
    sp.legs[1].rotation.x = 0;
    const look = Math.atan2(ball.pos.x - sp.root.position.x, ball.pos.z - sp.root.position.z) - sp.root.rotation.y;
    const headYaw = Math.atan2(Math.sin(look), Math.cos(look)) * .42;
    sp.headPivot.rotation.y += (headYaw - sp.headPivot.rotation.y) * Math.min(1, dt * 4);
    sp.headPivot.rotation.x = Math.sin(time * .9 + sp.phase) * .03;
  }
}

function updateClouds(time){
  for (const c of clouds){
    c.sprite.position.x = c.x + Math.sin(time * c.speed + c.phase) * .1;
    c.sprite.material.opacity = .32 + Math.sin(time * .22 + c.phase) * .07;
  }
}

function updateSwallows(dt, time){
  for (const b of swallows){
    const a = b.phase + time * b.speed;
    const vx = -Math.sin(a) * b.rx * b.speed;
    const vz = Math.cos(a) * b.rz * b.speed;
    b.group.position.set(
      Math.cos(a) * b.rx,
      b.y + Math.sin(time * .7 + b.bob) * .035,
      b.cz + Math.sin(a) * b.rz
    );
    b.group.rotation.y = Math.atan2(vx, vz);
    b.rig.rotation.z = .1 * Math.sign(b.speed);
    const glide = .5 + .5 * Math.sin(time * .32 + b.bob);
    const flap = .1 + Math.sin(time * b.flapSpeed + b.phase) * (.05 + .36 * glide);
    for (const w of b.wings) w.pivot.rotation.z = w.side > 0 ? flap : -flap;
  }
}

function updateMotes(time){
  for (const m of motes){
    m.sprite.position.y = m.baseY + Math.sin(time * m.speed + m.phase) * .09;
    m.sprite.material.opacity = .12 + Math.sin(time * .6 + m.phase) * .06;
  }
}

function updateGlass(time){
  glassUniforms.uFresnel.value = 1 + Math.sin(time * .45) * .08;
  glintA.material.opacity = .12 + Math.sin(time * 1.1) * .035;
  glintB.material.opacity = .06 + Math.sin(time * 1.4 + 2) * .018;
}

// -------------------------------------------------------------------------
// Boot and animation
// -------------------------------------------------------------------------

applyHomeView(true);
onResize();
updateCamera(.016);
renderer.render(scene, camera);
requestAnimationFrame(animate);

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .05);
  timeNow += dt;

  updateCamera(dt);
  updateMatches(dt, timeNow);
  updateMatchVisuals(dt, timeNow);
  updateClouds(timeNow);
  updateSwallows(dt, timeNow);
  updateMotes(timeNow);
  updateSpectators(dt, timeNow);
  updateDust(dt);
  updateGlass(timeNow);

  renderer.render(scene, camera);
  if (!ready){
    ready = true;
    window.__RECESS_READY__ = true;
    setTimeout(() => document.getElementById('loading').classList.add('done'), 360);
  }
}

// -------------------------------------------------------------------------
// Debug
// -------------------------------------------------------------------------

window.__RECESS_DEBUG__ = {
  THREE, scene, camera, renderer, view, target, jarRig, baseGroup, glass, building,
  bellPivot, bellProxy, players, spectators, ball, match, goals, ui, clickables,
  setCamera(az, polar, dist, tx = 0, ty = 1.92, tz = 0){
    target.set(tx, ty, tz);
    view.tAz = view.az = az;
    view.tPolar = view.polar = polar;
    view.tDist = view.dist = dist;
    updateCamera(.016);
    lastInteract = performance.now();
  },
  home(){ applyHomeView(true); updateCamera(.016); },
  hideUI(hide = true){
    document.querySelectorAll('.masthead,.panel,.hintbar,.hint-note,.side-mark,.toast,.bell-flash,.loading').forEach(e => e.style.display = hide ? 'none' : '');
  },
  showUI(){
    document.querySelectorAll('.masthead,.panel,.hintbar,.hint-note,.side-mark,.toast,.bell-flash,.loading').forEach(e => e.style.display = '');
  },
  ringBell, resetMatch,
  setTime(seconds){
    match.time = clamp(Number(seconds) || 0, 0, match.duration);
    updateHud();
    drawBoard();
  },
  setScore(red, blue){
    match.score.red = Math.max(0, Number(red) || 0);
    match.score.blue = Math.max(0, Number(blue) || 0);
    updateHud();
    drawBoard();
  },
  triggerGoal(team){
    scoreGoal(team, team === 'red' ? 1 : -1);
  },
  pickAt(x, y){
    const rect = canvas.getBoundingClientRect();
    pointerNDC.set(((x - rect.left) / rect.width) * 2 - 1, -((y - rect.top) / rect.height) * 2 + 1);
    raycaster.setFromCamera(pointerNDC, camera);
    return raycaster.intersectObjects(clickables, false).map(h => ({
      kind: h.object.userData.player ? 'player' + h.object.userData.player.team + h.object.userData.player.index : h.object.userData.ball ? 'ball' : h.object.userData.bell ? 'bell' : '?',
      d: +h.distance.toFixed(2)
    }));
  },
  step(seconds = 1, stepDt = 1 / 60){
    const total = Math.max(0, Math.min(seconds, 30));
    const n = Math.max(1, Math.round(total / stepDt));
    const dt = Math.min(stepDt, .05);
    for (let i = 0; i < n; i++){
      timeNow += dt;
      updateCamera(dt);
      updateMatches(dt, timeNow);
      updateMatchVisuals(dt, timeNow);
      updateClouds(timeNow);
      updateSwallows(dt, timeNow);
      updateMotes(timeNow);
      updateSpectators(dt, timeNow);
      updateDust(dt);
      updateGlass(timeNow);
    }
    renderer.render(scene, camera);
    return this.snapshot();
  },
  snapshot(){
    return {
      ready: !!window.__RECESS_READY__,
      calls: renderer.info.render.calls,
      triangles: renderer.info.render.triangles,
      pixelRatio: renderer.getPixelRatio(),
      camera: camera.position.toArray().map(v => +v.toFixed(2)),
      status: match.status,
      time: +match.time.toFixed(2),
      score: { ...match.score },
      owner: ball.owner ? `${ball.owner.team}${ball.owner.index}` : null,
      ball: ball.pos.toArray().map(v => +v.toFixed(2)),
      playersVisible: players.filter(p => p.root.visible).length,
      spectatorsVisible: spectators.filter(p => p.root.visible).length,
      audio: { on: Sound.on, state: Sound.ctx ? Sound.ctx.state : 'none' }
    };
  }
};
</script>
