<style>

  .masthead{

    .hint-note{display:none;}
  }

<script type="module">
import * as THREE from 'three';

// -------------------------------------------------------------------------
// Setup
// -------------------------------------------------------------------------

const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.04;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x100b07);
scene.fog = new THREE.FogExp2(0x1b120b, .018);

const camera = new THREE.PerspectiveCamera(34, 1, .05, 80);
const target = new THREE.Vector3(0, 1.95, 0);
const HOME = { az: .05, polar: 1.3, dist: 7.85 };
const view = { az: HOME.az, polar: HOME.polar, dist: HOME.dist, tAz: HOME.az, tPolar: HOME.polar, tDist: HOME.dist };

const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => {
  const t = clamp((x - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
};
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(19981024);
const rand = (a = 0, b = 1) => a + rng() * (b - a);
const chance = (p) => Math.random() < p;

const BOX = new THREE.BoxGeometry(1, 1, 1);
const Y_AXIS = new THREE.Vector3(0, 1, 0);
const dummy = new THREE.Object3D();
const _v = new THREE.Vector3();
const _v2 = new THREE.Vector3();

function std(color, roughness = .84, metalness = 0, extra = {}){
  return new THREE.MeshStandardMaterial({ color, roughness, metalness, ...extra });
}
const M = {
  bark: std(0x5a3924, .92),
  barkDark: std(0x3b2516, .94),
  barkLight: std(0x78513a, .9),
  leafRed: std(0xae4a2f, .86),
  leafRust: std(0xc26438, .86),
  leafOrange: std(0xd9823f, .86),
  leafGold: std(0xdfa44f, .86),
  leafOlive: std(0x93934d, .88),
  leafGreen: std(0x5f7845, .9),
  pine: std(0x43583d, .92),
  pineDeep: std(0x344934, .92),
  moss: std(0x788449, .96),
  soil: std(0x684b34, .96),
  rock: std(0x8b7f6d, .95),
  rockDark: std(0x635a4d, .95),
  cream: std(0xefe2c8, .86),
  dark: std(0x241a12, .8),
  black: std(0x100d0a, .7),
  fruit: std(0xd85a34, .58),
  fruitDark: std(0xb84227, .62),
  fruitLeaf: std(0x77854a, .85),
  deer: std(0x8f5a33, .88),
  deerLight: std(0xc49563, .88),
  deerDark: std(0x503522, .86),
  antler: std(0xb99b6b, .82),
  bear: std(0x5c3d29, .9),
  bearDark: std(0x3a2517, .92),
  bearSnout: std(0xb78c60, .88),
  fox: std(0xc46838, .88),
  foxLight: std(0xefe0c5, .88),
  foxDark: std(0x342219, .88),
  squirrel: std(0xa85d34, .88),
  squirrelLight: std(0xe1ba8e, .88),
  mushroom: std(0xc46145, .78),
  mushroomStem: std(0xe8d8b9, .9),
  gold: std(0xd3b073, .32, .5),
  metal: std(0xcbb38b, .34, .58)
};

// -------------------------------------------------------------------------
// Procedural textures
// -------------------------------------------------------------------------

function canvasOf(w, h = w){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return [c, c.getContext('2d')];
}
function texFrom(c, repeatX = 1, repeatY = 1){
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  if (repeatX !== 1 || repeatY !== 1){
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(repeatX, repeatY);
  }
  return t;
}

function makeWoodTexture(w = 1024, h = 512, tone = 'table'){
  const [c, x] = canvasOf(w, h);
  const palette = tone === 'base'
    ? ['#2c1810', '#1d0f09', '#4e2c1b', '#6d4329']
    : ['#382016', '#1a0e08', '#5a351f', '#72482b'];
  x.fillStyle = palette[0]; x.fillRect(0, 0, w, h);
  const rows = tone === 'base' ? 5 : 6;
  for (let row = 0; row < rows; row++){
    const y0 = row * h / rows;
    x.fillStyle = palette[row % palette.length];
    x.globalAlpha = .6;
    x.fillRect(0, y0, w, h / rows + 1);
    x.globalAlpha = 1;
    for (let i = 0; i < 38; i++){
      const gy = y0 + rand(2, h / rows - 2);
      x.strokeStyle = `rgba(${row % 2 ? '120,74,42' : '42,22,13'},${rand(.05,.22)})`;
      x.lineWidth = rand(.5, 1.7);
      x.beginPath();
      for (let xx = 0; xx <= w; xx += 16){
        const yy = gy + Math.sin(xx * .013 + i * 1.7 + row) * rand(.5, 3.6);
        if (xx === 0) x.moveTo(xx, yy); else x.lineTo(xx, yy);
      }
      x.stroke();
    }
    x.strokeStyle = 'rgba(10,5,3,.55)';
    x.lineWidth = 2;
    x.beginPath(); x.moveTo(0, y0); x.lineTo(w, y0); x.stroke();
  }
  return texFrom(c, tone === 'base' ? 1 : 4, tone === 'base' ? 1 : 3);
}

function makeBackdropTexture(){
  const [c, x] = canvasOf(1600, 900);
  const g = x.createRadialGradient(380, 250, 20, 380, 250, 950);
  g.addColorStop(0, '#3a2718');
  g.addColorStop(.42, '#1d130c');
  g.addColorStop(1, '#080504');
  x.fillStyle = g; x.fillRect(0, 0, 1600, 900);
  const warm = x.createRadialGradient(1260, 420, 20, 1260, 420, 560);
  warm.addColorStop(0, 'rgba(170,106,56,.16)');
  warm.addColorStop(1, 'rgba(35,25,16,0)');
  x.fillStyle = warm; x.fillRect(0, 0, 1600, 900);
  for (let i = 0; i < 90; i++){
    x.fillStyle = `rgba(255,214,166,${rand(.01,.05)})`;
    x.beginPath(); x.arc(rand(0, 1600), rand(0, 900), rand(10, 60), 0, TAU); x.fill();
  }
  return texFrom(c);
}

function makeAutumnSky(){
  const [c, x] = canvasOf(2048, 1024);
  const g = x.createLinearGradient(0, 0, 0, 1024);
  g.addColorStop(0, '#33434c');
  g.addColorStop(.22, '#5e6c6d');
  g.addColorStop(.4, '#9d9483');
  g.addColorStop(.55, '#d4b18c');
  g.addColorStop(.68, '#f0c99b');
  g.addColorStop(.78, '#e8ac70');
  g.addColorStop(.88, '#c37b4e');
  g.addColorStop(1, '#89553a');
  x.fillStyle = g; x.fillRect(0, 0, 2048, 1024);

  const sx = 560, sy = 430;
  const sun = x.createRadialGradient(sx, sy, 0, sx, sy, 340);
  sun.addColorStop(0, 'rgba(255,250,224,.98)');
  sun.addColorStop(.07, 'rgba(255,241,192,.9)');
  sun.addColorStop(.22, 'rgba(255,213,145,.4)');
  sun.addColorStop(.62, 'rgba(255,186,120,.12)');
  sun.addColorStop(1, 'rgba(255,178,112,0)');
  x.fillStyle = sun; x.fillRect(0, 0, 2048, 1024);
  x.fillStyle = 'rgba(255,255,244,.94)';
  x.beginPath(); x.arc(sx, sy, 21, 0, TAU); x.fill();

  function cloud(cx, cy, scale, alpha, warm){
    for (let i = 0; i < 12; i++){
      const px = cx + rand(-135, 135) * scale;
      const py = cy + rand(-28, 26) * scale;
      const rx = rand(55, 150) * scale;
      const ry = rand(16, 42) * scale;
      x.save();
      x.translate(px, py);
      x.scale(1, ry / rx);
      const cg = x.createRadialGradient(0, 0, 0, 0, 0, rx);
      cg.addColorStop(0, warm ? `rgba(255,241,214,${alpha * 1.15})` : `rgba(246,243,232,${alpha * 1.05})`);
      cg.addColorStop(.5, warm ? `rgba(255,228,188,${alpha * .45})` : `rgba(235,240,232,${alpha * .38})`);
      cg.addColorStop(1, 'rgba(255,255,255,0)');
      x.fillStyle = cg;
      x.beginPath(); x.arc(0, 0, rx, 0, TAU); x.fill();
      x.restore();
    }
  }
  cloud(300, 330, 1.2, .26, false);
  cloud(730, 470, 1.15, .24, true);

function makeSoftTexture(){

}

function block(parent, w, h, d, mat, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, cast = true){

function limb(parent, a, b, thickness, depth, mat, cast = true){
  const dir = _v.copy(b).sub(a);

  const m = new THREE.Mesh(BOX, mat);
  m.position.copy(a).addScaledVector(dir, .5);
  m.quaternion.setFromUnitVectors(Y_AXIS, dir.normalize());
  m.scale.set(thickness, len, depth);
  m.castShadow = cast;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

  m.castShadow = cast;
  m.receiveShadow = true;
  parent.add(m);

}

const TERRAIN_R = 1.94;
function terrainH(x, z){
  const peakA = 2.52 * Math.exp(-(((x + .12) ** 2) / .78 + ((z + 1.16) ** 2) / 1.02));
  const peakB = .92 * Math.exp(-(((x - .98) ** 2) / .4 + ((z + .72) ** 2) / .44));
  const shoulder = .38 * Math.exp(-(((x + 1.14) ** 2) / .8 + ((z + .18) ** 2) / .5));
  const ripple = .035 * Math.sin(x * 4.2 + z * 3.1) + .022 * Math.cos(z * 5.4 - x * 2.2);
  const clearing = .012 * Math.sin(x * 7.0 + 1.2) * Math.cos(z * 6.0);
  return Math.max(.06, .048 + peakA + peakB + shoulder + ripple + clearing);
}

const RINGS = 54, SEGS = 168;
const terrainPos = [], terrainCol = [], terrainIdx = [];
const colorLow = new THREE.Color(0xb1bd75);
const colorLitter = new THREE.Color(0xc49b62);
const colorRust = new THREE.Color(0xb6734c);
const colorRock = new THREE.Color(0x8f7c66);
const colorPeak = new THREE.Color(0xb09a7c);
for (let ri = 0; ri <= RINGS; ri++){
  const rr = TERRAIN_R * (ri / RINGS);
  for (let si = 0; si <= SEGS; si++){
    const a = si / SEGS * TAU;
    const x = Math.cos(a) * rr, z = Math.sin(a) * rr;
    const h = terrainH(x, z);
    terrainPos.push(x, h, z);
    const n = .5 + .5 * Math.sin(x * 9.1 + z * 7.3) * Math.cos(x * 3.7 - z * 5.1);
    const col = colorLow.clone().lerp(colorLitter, smooth(.1, .55, h) * (.55 + n * .45));
    col.lerp(colorRust, smooth(.45, 1.15, h) * (.45 + n * .35));
    col.lerp(colorRock, smooth(1.25, 1.9, h) * .75);
    col.lerp(colorPeak, smooth(2.05, 2.5, h) * .85);
    if (h < .3 && z > .35){
      col.lerp(new THREE.Color(0x93a05a), .34);
      col.multiplyScalar(.9 + n * .22);
    }
    col.multiplyScalar(.95 + n * .1);
    terrainCol.push(col.r, col.g, col.b);
  }
}
for (let ri = 0; ri < RINGS; ri++){
  for (let si = 0; si < SEGS; si++){
    const a = ri * (SEGS + 1) + si;
    const b = a + SEGS + 1;
    terrainIdx.push(a, a + 1, b, b, a + 1, b + 1);
  }
}
const terrainGeo = new THREE.BufferGeometry();
terrainGeo.setAttribute('position', new THREE.Float32BufferAttribute(terrainPos, 3));
terrainGeo.setAttribute('color', new THREE.Float32BufferAttribute(terrainCol, 3));
terrainGeo.setIndex(terrainIdx);
terrainGeo.computeVertexNormals();
const terrainMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .96, flatShading: true });
const terrain = new THREE.Mesh(terrainGeo, terrainMat);
terrain.receiveShadow = true;
terrain.castShadow = false;

terrain.userData.kind = 'forest';

// a narrow path curling up into the forest
const pathPts = [
  new THREE.Vector3(.52, 0, 1.72),
  new THREE.Vector3(.36, 0, 1.34),
  new THREE.Vector3(.12, 0, 1.02),
  new THREE.Vector3(-.02, 0, .74),
  new THREE.Vector3(-.22, 0, .5),
  new THREE.Vector3(-.5, 0, .3),
  new THREE.Vector3(-.78, 0, .16)
];
const pathCurve = new THREE.CatmullRomCurve3(pathPts);
const pathVerts = [], pathIdx = [];
const pathSegs = 44, halfW = .11;
for (let i = 0; i <= pathSegs; i++){
  const p = pathCurve.getPoint(i / pathSegs);
  const tan = pathCurve.getTangent(i / pathSegs);
  const nx = -tan.z, nz = tan.x;
  const w = halfW * (1 - .25 * i / pathSegs);
  for (const side of [-1, 1]){
    const x = p.x + nx * w * side, z = p.z + nz * w * side;
    pathVerts.push(x, terrainH(x, z) + .013, z);
  }
  if (i < pathSegs){
    const a = i * 2;
    pathIdx.push(a, a + 1, a + 2, a + 2, a + 1, a + 3);
  }
}
const pathGeo = new THREE.BufferGeometry();
pathGeo.setAttribute('position', new THREE.Float32BufferAttribute(pathVerts, 3));
pathGeo.setIndex(pathIdx);
pathGeo.computeVertexNormals();

  const x = Math.cos(a) * rr, z = Math.sin(a) * rr;

  if (h < .3) continue;
  if (z > .02 && h < .58) continue;

  const conifer = h > 1.3 ? chance(.68) : chance(.16);

    color: conifer ? pinePalette[Math.floor(rand(0, pinePalette.length))] : autumnPalette[Math.floor(rand(0, autumnPalette.length))]
  };
  treeSpecs.push(spec);

}

// Fruit physics
// -------------------------------------------------------------------------

let fruitTimer = 8 + Math.random() * 3;
function dropFruit(n = 1){
  let dropped = 0;
  for (let i = 0; i < fruits.length && dropped < n; i++){
    const f = fruits[Math.floor(Math.random() * fruits.length)];
    if (f.state !== 'hanging') continue;
    jarRig.attach(f.group);
    f.state = 'falling';
    f.vy = -.05;
    f.vx = rand(-.05, .05);
    f.vz = rand(-.05, .05);
    f.bounces = 0;
    f.timer = 0;
    dropped++;
  }
  return dropped;
}
function updateFruits(dt, time){
  fruitTimer -= dt;
  if (fruitTimer <= 0){
    fruitTimer = 6 + Math.random() * 5;
    if (chance(.55)) dropFruit(1);
  }
  for (const f of fruits){
    if (f.state === 'hanging'){
      f.group.rotation.z = Math.sin(time * 1.4 + f.home.x * 3) * .04;
    } else if (f.state === 'falling'){
      f.vy -= 3.6 * dt;
      f.group.position.y += f.vy * dt;
      f.group.position.x += f.vx * dt;
      f.group.position.z += f.vz * dt;
      f.group.rotation.x += dt * 2.2;
      f.group.rotation.z += dt * 1.5;
      const ground = terrainH(f.group.position.x, f.group.position.z) + .055;
      if (f.group.position.y <= ground){
        f.group.position.y = ground;
        if (f.bounces < 2 && Math.abs(f.vy) > .35){
          f.vy = -f.vy * .28;
          f.vx *= .7; f.vz *= .7;
          f.bounces++;
        } else {
          f.state = 'ground';
          f.timer = 0;
          f.group.rotation.x = Math.PI / 2;
        }
      }
    } else if (f.state === 'ground'){
      f.timer += dt;
      if (f.timer > 9){
        f.state = 'fade';
        f.timer = 0;
      }
    } else if (f.state === 'fade'){
      f.timer += dt;
      const k = clamp(1 - f.timer / .7, 0, 1);
      f.group.scale.setScalar(Math.max(.001, k));
      if (f.timer > .7){
        jarRig.remove(f.group);
        f.group.scale.setScalar(1);
        f.group.position.copy(f.home);
        f.group.rotation.set(0, 0, 0);
        heroTree.add(f.group);
        f.state = 'grow';
        f.timer = 0;
        f.group.scale.setScalar(.001);
      }
    } else if (f.state === 'grow'){
      f.timer += dt;
      const k = smooth(0, .6, f.timer);
      f.group.scale.setScalar(Math.max(.001, k));
      if (f.timer > .6){
        f.group.scale.setScalar(1);
        f.state = 'hanging';
      }
    }
  }
}

const hintNoteEl = document.getElementById('hintNote');
let windLabel = '';
function setWindLabel(text){
  if (windLabel === text) return;
  windLabel = text;
  if (windStateEl) windStateEl.textContent = text;
  if (hintNoteEl) hintNoteEl.textContent = text === '起风'
    ? '山风起了，整座山都在沙沙响。'
    : '风一过，整座山的叶子都在轻轻响。';
}
function triggerGust(strength = 1, drop = true){
  wind.gust = Math.max(wind.gust, strength);
  wind.timer = 0;
  setWindLabel('起风');
  for (let i = 0; i < 18; i++){
    const idx = Math.floor(Math.random() * FALLING_LEAVES);
    const l = leaves[idx];
    l.x = TREE_X + rand(-1.0, 1.0);
    l.z = TREE_Z + rand(-.8, 1.0);
    l.y = TREE_BASE_Y + rand(1.1, 2.05);
    l.vy = rand(.08, .18);
    l.life = rand(8, 14);
  }
  if (drop && chance(.75)) dropFruit(1 + Math.floor(Math.random() * 2));
}
function updateLeaves(dt, time){
  wind.timer += dt;
  if (wind.gust > 0){
    wind.gust = Math.max(0, wind.gust - dt * .42);
    if (wind.gust === 0) setWindLabel('微风');
  }
  wind.next -= dt;
  if (wind.next <= 0){
    wind.next = 9 + Math.random() * 7;
    triggerGust(.6 + Math.random() * .35, chance(.35));
  }
  wind.current = .12 + wind.gust * .32;
  const gust = wind.gust;
  for (let i = 0; i < FALLING_LEAVES; i++){
    const l = leaves[i];
    l.life -= dt;
    const sway = Math.sin(time * 1.5 + l.phase) * (.035 + gust * .05);
    l.x += (wind.current * .5 + l.vx + sway) * dt;
    l.z += (wind.current * .16 + l.vz + Math.cos(time * 1.15 + l.phase) * .025) * dt;
    l.y -= (l.vy + gust * .06) * dt;
    l.rotX += l.spin * dt * (1 + gust);
    l.rotY += l.spin * .7 * dt;
    l.rotZ += Math.sin(time * 1.2 + l.phase) * .8 * dt;
    const ground = terrainH(l.x, l.z) + .015;
    const out = Math.hypot(l.x, l.z) > 1.9;
    if (l.y < ground || out || l.life <= 0){
      spawnLeaf(l, false);
    }
    dummy.position.set(l.x, l.y, l.z);
    dummy.rotation.set(l.rotX, l.rotY, l.rotZ + l.tilt);
    dummy.scale.set(l.size, l.size, l.size);
    dummy.updateMatrix();
    leafMesh.setMatrixAt(i, dummy.matrix);
  }
  leafMesh.instanceMatrix.needsUpdate = true;
  treeCrown.rotation.z = Math.sin(time * .8) * .012 + gust * .045;
  treeCrown.rotation.x = Math.sin(time * .63 + 1.7) * .008 + gust * .018;
}

const animalNames = { deer: '小鹿', bear: '熊', fox: '赤狐', squirrel: '松鼠' };
const entryPoints = [
  new THREE.Vector2(-1.55, .82),
  new THREE.Vector2(1.55, .82),
  new THREE.Vector2(-.7, .36),
  new THREE.Vector2(.78, .38)
];
const spots = [
  { x: -.08, z: 1.08, ry: .3 },
  { x: .38, z: .94, ry: -.4 },
  { x: -.46, z: 1.2, ry: 1.0 },
  { x: .56, z: 1.3, ry: -1.2 }
];
let active = null;
let animalTimer = 0;
let lastKind = null;
function setVisitorLabel(text){
  if (visitorStateEl) visitorStateEl.textContent = text;
}
function placeAnimal(a, x, z){
  a.root.position.set(x, terrainH(x, z) + .005, z);
}
function spawnAnimal(kind, initial = false){
  if (active) active.root.visible = false;
  const a = animalModels[kind];
  a.root.visible = true;
  a.root.scale.setScalar(kind === 'deer' ? 1.16 : 1);
  a.root.rotation.set(0, 0, 0);
  a.reaction = 0;
  a.walkPhase = rand(0, TAU);
  active = a;
  lastKind = kind;
  setVisitorLabel(animalNames[kind]);
  if (initial){
    const s = spots[0];
    placeAnimal(a, s.x, s.z);
    a.state = 'stay';
    a.timer = 11;
    a.stayTarget = null;
    a.root.rotation.y = s.ry;
  } else {
    let idx = Math.floor(Math.random() * entryPoints.length);
    const e = entryPoints[idx];
    const s = spots[Math.floor(Math.random() * spots.length)];
    placeAnimal(a, e.x, e.y);
    a.state = 'enter';
    a.target = new THREE.Vector3(s.x, 0, s.z);
    a.exit = entryPoints[(idx + 1 + Math.floor(Math.random() * 3)) % entryPoints.length];
    a.root.rotation.y = Math.atan2(s.x - e.x, s.z - e.y);
    a.timer = 0;
  }
  return a;
}
function updateAnimal(dt, time){
  if (!active){
    animalTimer -= dt;
    if (animalTimer <= 0){
      const pool = Object.keys(animalModels).filter(k => k !== lastKind);
      spawnAnimal(pool[Math.floor(Math.random() * pool.length)]);
    }
    return;
  }
  const a = active;
  const speed = a.speed;
  if (a.state === 'enter' || a.state === 'leave'){
    const tx = a.state === 'enter' ? a.target.x : a.exit.x;
    const tz = a.state === 'enter' ? a.target.z : a.exit.y;
    const dx = tx - a.root.position.x, dz = tz - a.root.position.z;
    const dist = Math.hypot(dx, dz);
    if (dist < .04){
      if (a.state === 'enter'){
        a.state = 'stay';
        a.timer = 4.5 + Math.random() * 3.5;
      } else {
        a.root.visible = false;
        active = null;
        animalTimer = 2.5 + Math.random() * 3.5;
        setVisitorLabel('林间安静');
        return;
      }
    } else {
      const step = Math.min(dist, speed * dt);
      const nx = a.root.position.x + dx / dist * step;
      const nz = a.root.position.z + dz / dist * step;
      placeAnimal(a, nx, nz);
      const targetYaw = Math.atan2(dx, dz);
      a.root.rotation.y += Math.atan2(Math.sin(targetYaw - a.root.rotation.y), Math.cos(targetYaw - a.root.rotation.y)) * Math.min(1, dt * 7);
      a.walkPhase += dt * speed * 18;
    }
  } else if (a.state === 'stay'){
    a.timer -= dt;
    a.walkPhase += dt * 1.2;
    if (a.timer <= 0){
      a.state = 'leave';
      a.exit = entryPoints[Math.floor(Math.random() * entryPoints.length)];
    }
  }
  if (a.reaction > 0) a.reaction = Math.max(0, a.reaction - dt);
  const walking = a.state === 'enter' || a.state === 'leave';
  const legSwing = walking ? Math.sin(a.walkPhase) * .38 : Math.sin(time * 1.1 + a.walkPhase) * .02;
  for (let i = 0; i < a.legs.length; i++){
    a.legs[i].rotation.x = legSwing * (i % 2 ? -1 : 1);
  }
  const react = a.reaction > 0 ? Math.sin(a.reaction * 8) * .06 : 0;
  a.head.rotation.x = (walking ? Math.sin(a.walkPhase * 2) * .02 : Math.sin(time * 1.2 + a.walkPhase) * .03) - react * .5;
  a.head.rotation.z = react * .12;
  a.tail.rotation.y = Math.sin(time * (walking ? 7 : 2.2) + a.walkPhase) * (a.kind === 'squirrel' ? .22 : .12);
  if (a.kind === 'squirrel'){
    const hop = walking ? Math.abs(Math.sin(a.walkPhase * 1.5)) * .045 : 0;
    a.root.position.y += hop;
  }
  if (a.kind === 'bear'){
    a.root.rotation.z = walking ? Math.sin(a.walkPhase) * .025 : 0;
  }
}

const clickTargets = [terrain, heroTree];
function markAnimal(parts){
  clickTargets.push(parts.root);
}
for (const key in animalModels) markAnimal(animalModels[key]);
const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2();
function triggerClick(kind, obj){
  if (kind === 'tree'){
    triggerGust(1.1, false);
    dropFruit(2);
    treeCrown.rotation.z += .06;
  } else if (kind === 'forest'){
    triggerGust(.72, chance(.25));
  } else if (kind === 'animal'){
    if (active && active.kind === obj.userData.animal){
      active.reaction = 1.4;
    }
  }
}
function handleClick(e){
  const rect = canvas.getBoundingClientRect();
  pointerNDC.set(
    ((e.clientX - rect.left) / rect.width) * 2 - 1,
    -((e.clientY - rect.top) / rect.height) * 2 + 1
  );
  raycaster.setFromCamera(pointerNDC, camera);
  const hits = raycaster.intersectObjects(clickTargets, true);
  for (const hit of hits){
    let o = hit.object;
    while (o){
      if (o.userData && o.userData.kind){
        if (o.userData.kind === 'animal'){
          if (!active || active.kind !== o.userData.animal) { o = o.parent; continue; }
          triggerClick('animal', o);
        } else {
          triggerClick(o.userData.kind, o);
        }
        return true;
      }
      o = o.parent;
    }
  }
  return false;
}

function updateClouds(time){
  for (const c of clouds){
    c.sprite.position.x = c.x + Math.sin(time * c.speed + c.phase) * .16;
    c.sprite.material.opacity = .1 + Math.sin(time * .3 + c.phase) * .03;
  }
  for (const m of mists){
    m.sprite.position.x = m.x + Math.sin(time * .08 + m.phase) * .2;
    m.sprite.material.opacity = .07 + Math.sin(time * .22 + m.phase) * .02;
  }
  sunHaze.material.opacity = .17 + Math.sin(time * .5) * .02;
}
function updateBirds(dt, time){
  for (const b of birds){
    const a = b.phase + time * b.speed;
    b.group.position.set(Math.cos(a) * b.radius, b.y + Math.sin(time * .6 + b.phase) * .05, -.7 + Math.sin(a) * b.radius * .45);
    b.group.rotation.y = Math.atan2(-Math.sin(a), Math.cos(a) * .45);
    const flap = Math.sin(time * 9 + b.phase) * .55;
    b.group.userData.wings[0].rotation.z = flap;
    b.group.userData.wings[1].rotation.z = -flap;
  }
}
function updateGlass(time){
  glassUniforms.uFresnel.value = 1 + Math.sin(time * .45) * .08;
  glintA.material.opacity = .12 + Math.sin(time * 1.1) * .035;
  glintB.material.opacity = .065 + Math.sin(time * 1.4 + 2) * .02;
}

function updateCamera(dt){
  const now = performance.now();
  if (!dragging && now - lastInteract > 7000) view.tAz += dt * .018;
  const k = 1 - Math.pow(.0016, dt);
  view.az = lerp(view.az, view.tAz, k);
  view.polar = lerp(view.polar, view.tPolar, k);
  view.dist = lerp(view.dist, view.tDist, k);
  const sp = Math.sin(view.polar);
  camera.position.set(
    target.x + Math.sin(view.az) * sp * view.dist,
    target.y + Math.cos(view.polar) * view.dist,
    target.z + Math.cos(view.az) * sp * view.dist
  );
  camera.lookAt(target);
}
function applyHomeView(snap = false){
  const narrow = window.innerWidth / window.innerHeight < .82;
  target.y = narrow ? 1.82 : 1.95;
  view.tAz = .05;
  view.tPolar = narrow ? 1.29 : 1.3;
  view.tDist = narrow ? 8.85 : 7.85;
  if (snap){
    view.az = .05;
    view.polar = view.tPolar;
    view.dist = view.tDist;
  }
}
canvas.addEventListener('pointerdown', (e) => {
  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  noteInteraction();
  if (activePointers.size === 1){
    dragging = true;
    pointerDown = true;
    pointerStartAt = performance.now();
    pointerTravel = 0;
    pinched = false;
    prevPointer = { x: e.clientX, y: e.clientY };
    canvas.classList.add('dragging');
  } else {
    dragging = false;
    pinched = true;
    pointerDown = false;
    const pts = [...activePointers.values()];
    pinchStart = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    pinchBase = view.tDist;
  }
});
canvas.addEventListener('pointermove', (e) => {
  if (!activePointers.has(e.pointerId)) return;
  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (activePointers.size >= 2){
    const pts = [...activePointers.values()];
    const sep = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    if (pinchStart > 0 && sep > 4) view.tDist = clamp(pinchBase * (pinchStart / sep), 5.1, 10.8);
    noteInteraction();
    return;
  }
  if (!dragging) return;
  const dx = e.clientX - prevPointer.x;
  const dy = e.clientY - prevPointer.y;
  prevPointer = { x: e.clientX, y: e.clientY };
  pointerTravel += Math.abs(dx) + Math.abs(dy);
  view.tAz = clamp(view.tAz - dx * .0046, -.62, .62);
  view.tPolar = clamp(view.tPolar - dy * .0032, .91, 1.43);
  noteInteraction();
});
function endPointer(e, allowClick){
  const was = dragging;
  const canClick = pointerDown && pointerTravel < 8 && performance.now() - pointerStartAt < 560;
  activePointers.delete(e.pointerId);
  try {
    if (canvas.hasPointerCapture?.(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
  } catch (err) {}
  if (activePointers.size === 0){
    if (allowClick && was && canClick && !pinched) handleClick(e);
    dragging = false;
    pointerDown = false;
    pinched = false;
    canvas.classList.remove('dragging');
  } else if (activePointers.size === 1){
    const pt = [...activePointers.values()][0];
    prevPointer = { x: pt.x, y: pt.y };
    pointerDown = false;
    dragging = true;
    pointerTravel = 99;
  }
  noteInteraction();
}
canvas.addEventListener('pointerup', (e) => endPointer(e, true));
canvas.addEventListener('pointercancel', (e) => endPointer(e, false));
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  view.tDist = clamp(view.tDist * Math.exp(e.deltaY * .00105), 5.1, 10.8);
  noteInteraction();
}, { passive: false });
canvas.addEventListener('dblclick', (e) => {
  e.preventDefault();
  applyHomeView();
  noteInteraction();
});
canvas.addEventListener('contextmenu', e => e.preventDefault());
document.getElementById('homeBtn').addEventListener('click', () => {
  applyHomeView();
  noteInteraction();
});
window.addEventListener('resize', onResize);
function onResize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w < 700 ? 42 : 34;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
  if (w < 700){
    if (Math.abs(view.tDist - HOME.dist) < .22){
      target.y = 1.82;
      view.tDist = view.dist = 8.85;
      view.tPolar = view.polar = 1.29;
    }
  }
}

// -------------------------------------------------------------------------
// Boot and debug
// -------------------------------------------------------------------------

applyHomeView(true);
onResize();
updateCamera(.016);
renderer.render(scene, camera);
requestAnimationFrame(animate);

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .05);
  timeNow += dt;

  updateCamera(dt);
  updateLeaves(dt, timeNow);
  updateFruits(dt, timeNow);
  updateAnimal(dt, timeNow);
  updateClouds(timeNow);
  updateBirds(dt, timeNow);
  updateGlass(timeNow);

  renderer.render(scene, camera);
  if (!ready){
    ready = true;
    window.__AUTUMN_READY__ = true;
    setTimeout(() => document.getElementById('loading').classList.add('done'), 360);
  }
}

window.__AUTUMN_DEBUG__ = {
  THREE, scene, camera, renderer, view, target, jarRig, baseGroup, glass, heroTree, treeCrown,
  terrain, animals: animalModels, get active(){ return active; }, wind, leaves, fruits, animalModels,
  triggerGust, dropFruit, spawnAnimal, triggerClick, handleClick,
  setCamera(az, polar, dist, tx = 0, ty = 1.95, tz = 0){
    target.set(tx, ty, tz);
    view.tAz = view.az = az;
    view.tPolar = view.polar = polar;
    view.tDist = view.dist = dist;
    updateCamera(.016);
    lastInteract = performance.now();
  },
  home(){ applyHomeView(true); updateCamera(.016); },
  hideUI(hide = true){
    document.querySelectorAll('.masthead,.panel,.hintbar,.hint-note,.side-mark,.loading').forEach(e => e.style.display = hide ? 'none' : '');
  },
  showUI(){
    document.querySelectorAll('.masthead,.panel,.hintbar,.hint-note,.side-mark,.loading').forEach(e => e.style.display = '');
  },
  snapshot(){
    return {
      ready: !!window.__AUTUMN_READY__,
      calls: renderer.info.render.calls,
      triangles: renderer.info.render.triangles,
      pixelRatio: renderer.getPixelRatio(),
      camera: camera.position.toArray().map(v => +v.toFixed(2)),
      wind: +wind.gust.toFixed(2),
      active: active ? active.kind : null,
      fruitsHanging: fruits.filter(f => f.state === 'hanging').length,
      leaves: leaves.length
    };
  }
};
</script>
